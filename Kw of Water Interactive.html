<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kw of Water & Le Chatelier's Principle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f3f4f6; }
    </style>
</head>
<body class="p-6 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [tempC, setTempC] = React.useState(25);
            const [acidScale, setAcidScale] = React.useState(0); 

            // Thermodynamic calculation of pKw based on temperature
            const T = tempC + 273.15;
            const pKw = (4470.99 / T) - 6.0875 + (0.01706 * T);
            const Kw = Math.pow(10, -pKw);

            // Added acid concentration (Ca)
            const Ca = acidScale > 0 ? Math.pow(10, -7 + acidScale) : 0;

            // Calculate [H+] and [OH-]
            const H = (Ca + Math.sqrt(Ca * Ca + 4 * Kw)) / 2;
            const OH = Kw / H;

            const pH = -Math.log10(H);
            const pOH = -Math.log10(OH);

            const canvasRef = React.useRef(null);

            // Particle Animation Effect
            React.useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                // Visual scaling
                const numH = Math.min(200, Math.max(0, Math.round(10 * Math.pow(H / 1e-7, 0.3))));
                const numOH = Math.min(200, Math.max(0, Math.round(10 * Math.pow(OH / 1e-7, 0.3))));
                const numH2O = 60; // Fixed number of solvent molecules

                let particles = [];
                
                // Initialize H2O particles (solvent)
                for(let i=0; i<numH2O; i++) {
                    particles.push({ 
                        x: Math.random() * canvas.width, 
                        y: Math.random() * canvas.height, 
                        vx: (Math.random() - 0.5) * 1.5, // Slightly slower than ions
                        vy: (Math.random() - 0.5) * 1.5, 
                        type: 'H2O' 
                    });
                }
                
                // Initialize H+ particles
                for(let i=0; i<numH2O; i++) { // offset loop so they don't block
                    if (i < numH) {
                        particles.push({ 
                            x: Math.random() * canvas.width, 
                            y: Math.random() * canvas.height, 
                            vx: (Math.random() - 0.5) * 2.5, 
                            vy: (Math.random() - 0.5) * 2.5, 
                            type: 'H' 
                        });
                    }
                }
                
                // Initialize OH- particles
                for(let i=0; i<numH2O; i++) {
                    if (i < numOH) {
                        particles.push({ 
                            x: Math.random() * canvas.width, 
                            y: Math.random() * canvas.height, 
                            vx: (Math.random() - 0.5) * 2.5, 
                            vy: (Math.random() - 0.5) * 2.5, 
                            type: 'OH' 
                        });
                    }
                }

                // Speed multiplier based on temperature
                const speedFactor = 0.5 + (tempC / 50);

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(p => {
                        // Move
                        p.x += p.vx * speedFactor;
                        p.y += p.vy * speedFactor;
                        
                        // Bounce off walls
                        if(p.x < 12 || p.x > canvas.width - 12) p.vx *= -1;
                        if(p.y < 12 || p.y > canvas.height - 12) p.vy *= -1;

                        p.x = Math.max(12, Math.min(canvas.width - 12, p.x));
                        p.y = Math.max(12, Math.min(canvas.height - 12, p.y));

                        // Draw particle
                        ctx.beginPath();
                        
                        if (p.type === 'H2O') {
                            ctx.arc(p.x, p.y, 14, 0, 2 * Math.PI);
                            ctx.fillStyle = '#374151'; // Dark gray/blue for H2O
                        } else {
                            ctx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
                            ctx.fillStyle = p.type === 'H' ? '#ef4444' : '#3b82f6';
                        }
                        
                        ctx.fill();
                        
                        // Draw label
                        ctx.fillStyle = '#ffffff';
                        ctx.font = p.type === 'H2O' ? 'bold 10px sans-serif' : 'bold 8px sans-serif';
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(p.type === 'H' ? 'H+' : (p.type === 'OH' ? 'OH-' : 'H₂O'), p.x, p.y);
                    });

                    animationFrameId = requestAnimationFrame(render);
                }

                render();

                return () => cancelAnimationFrame(animationFrameId);
            }, [H, OH, tempC]); 

            return (
                <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8">
                    <h1 className="text-3xl font-bold text-center text-blue-900 mb-2">Water Equilibrium (K<sub>w</sub>) Simulator</h1>
                    <p className="text-center text-gray-600 mb-8">Explore how temperature and added acid affect the autoionization of water.</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div className="space-y-6">
                            <div className="bg-blue-50 p-5 rounded-lg border border-blue-100">
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    Temperature: {tempC}°C
                                </label>
                                <input 
                                    type="range" 
                                    min="0" max="100" 
                                    value={tempC} 
                                    onChange={(e) => setTempC(Number(e.target.value))}
                                    className="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"
                                />
                                <p className="text-xs text-gray-500 mt-2">Notice how K<sub>w</sub> increases as temperature rises. The autoionization of water is endothermic.</p>
                            </div>

                            <div className="bg-red-50 p-5 rounded-lg border border-red-100">
                                <label className="block text-sm font-bold text-gray-700 mb-2">
                                    Add Acid (H⁺): {Ca === 0 ? "None" : `${Ca.toExponential(1)} M`}
                                </label>
                                <input 
                                    type="range" 
                                    min="0" max="5" step="0.1"
                                    value={acidScale} 
                                    onChange={(e) => setAcidScale(Number(e.target.value))}
                                    className="w-full h-2 bg-red-200 rounded-lg appearance-none cursor-pointer"
                                />
                                <p className="text-xs text-gray-500 mt-2">Slide to increase the amount of strong acid added to the water.</p>
                            </div>

                            <div className="bg-gray-50 p-5 rounded-lg border border-gray-200">
                                <h2 className="text-lg font-bold mb-3 border-b pb-2">Calculated Values</h2>
                                <div className="grid grid-cols-2 gap-4 text-sm">
                                    <div><span className="font-semibold text-gray-600">K<sub>w</sub>:</span> {Kw.toExponential(3)}</div>
                                    <div><span className="font-semibold text-gray-600">pK<sub>w</sub>:</span> {pKw.toFixed(2)}</div>
                                    <div className="text-red-600"><span className="font-semibold">pH:</span> {pH.toFixed(2)}</div>
                                    <div className="text-blue-600"><span className="font-semibold">pOH:</span> {pOH.toFixed(2)}</div>
                                    <div className="text-red-600"><span className="font-semibold">[H⁺]:</span> {H.toExponential(3)} M</div>
                                    <div className="text-blue-600"><span className="font-semibold">[OH⁻]:</span> {OH.toExponential(3)} M</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div className="bg-gray-900 rounded-lg overflow-hidden relative shadow-inner">
                                <canvas 
                                    ref={canvasRef} 
                                    width="400" 
                                    height="300" 
                                    className="w-full h-64 object-cover"
                                ></canvas>
                                <div className="absolute top-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded">
                                    Particle View (Solvent visually scaled)
                                </div>
                            </div>
                            
                            <div className="mt-6 bg-yellow-50 p-5 rounded-lg border border-yellow-200 text-sm text-gray-800">
                                <h3 className="font-bold text-lg text-yellow-800 mb-2">Why does [OH⁻] decrease when H⁺ is added?</h3>
                                <p className="mb-2">
                                    This is a perfect example of <strong>Le Chatelier's Principle</strong>. Water is in a dynamic equilibrium:
                                </p>
                                <p className="text-center font-mono bg-white py-2 rounded border border-yellow-100 my-2">
                                    H₂O(l) ⇌ H⁺(aq) + OH⁻(aq)
                                </p>
                                <p className="mb-2">
                                    At any given temperature, the product of the ion concentrations must equal the equilibrium constant, K<sub>w</sub> 
                                    (<strong>K<sub>w</sub> = [H⁺][OH⁻]</strong>). 
                                </p>
                                <p>
                                    When you add acid, you increase the concentration of H⁺. To keep the K<sub>w</sub> value constant, the system shifts to the <em>left</em>. The extra H⁺ reacts with existing OH⁻ to form unionized liquid water, thereby <strong>consuming OH⁻</strong> and driving its concentration down.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
