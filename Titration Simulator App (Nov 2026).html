function curveFigs(){return [[COMBO_A,'Acid in the flask, base added from the burette'],[COMBO_B,'Base in the flask, acid added from the burette']].map(([g,t])=>{const ks=g.filter(k=>S.cres[k]); if(!ks.length) return '';
  return chartImg({xmax:50,ymin:0,ymax:14,ystep:2,ylab:'pH',series:ks.map(k=>({pts:S.cres[k].pts,color:'--'+CHEM[k].c})),marks:ks.map(k=>({x:S.cres[k].eqV,y:S.cres[k].eqpH,color:'--'+CHEM[k].c})),hlines:[{y:7,color:'--muted',label:'pH 7'}],legend:ks.map(k=>({label:CHEM[k].short,color:'--'+CHEM[k].c}))},
    `${t}. Dots mark each equivalence point: compare its pH with 7 and the size of the vertical jump.`);}).join('');}
function finishCurve(){
  const rows=COMBO_C.filter(k=>S.cres[k]).map(k=>{const r=S.cres[k],v=CHEM[k]; return `<tr><td><b>${v.short}</b></td><td class="num mono">${r.eqV.toFixed(2)}</td><td class="num mono">${r.eqpH.toFixed(2)}</td><td>${r.good.join(', ')}</td></tr>`;}).join('');
  const html=reportShell('Curve Lab: pH titration curves','To compare the pH titration curves of strong and weak acids and bases, find the equivalence points, and choose suitable indicators.',
   `<h4>Method</h4><ul><li>25.00 mL of 0.1000 mol/L acid or base in a conical flask with a pH probe.</li><li>0.1000 mol/L titrant added from a burette, recording pH continuously to about 45 mL.</li><li>Combos run: ${COMBO_C.filter(k=>S.cres[k]).map(k=>CHEM[k].tab).join('; ')}.</li></ul>
    <h4>Results</h4><div class="tw"><table><thead><tr><th>Combo</th><th class="num">V at equiv. (mL)</th><th class="num">pH at equiv.</th><th>Suitable indicators</th></tr></thead><tbody>${rows}</tbody></table></div>${curveFigs()}
    ${S.cres.c_wasb?`<p>pKa of ethanoic acid from the half-equivalence point: ${S.cres.c_wasb.pk} (accepted 4.76).</p>`:''}${S.cres.cb_wbsa?`<p>pKb of ammonia from the half-equivalence point: ${S.cres.cb_wbsa.pk} (accepted 4.75).</p>`:''}
    <h4>Calculations</h4><div class="work">n(acid) = 0.1000 × 0.02500 = 2.500 × 10⁻³ mol<br>V(base) at equivalence = 2.500 × 10⁻³ ÷ 0.1000 = 0.02500 L = 25.00 mL (1 : 1 ratio)</div>
    <h4>Conclusion</h4><ul><li>Strong acid + strong base: equivalence at pH 7 (neutral salt NaCl). Many indicators work because the jump is so large (about pH 4 to 10).</li><li>Weak acid + strong base: equivalence above pH 7 because ethanoate is a weak base. Use phenolphthalein or phenol red.</li><li>Strong acid + weak base: equivalence below pH 7 because ammonium is a weak acid. Use bromocresol green or methyl red (methyl orange and bromophenol blue are borderline).</li><li>Swapping which solution is in the flask flips the curve (rising vs falling), but the pH at equivalence is the same for the same pair.</li><li>A suitable indicator changes colour within the steep part of the curve.</li></ul>`);
  S.report=html; saveReport('curve','Curve Lab',html); PROG.curve.done=true; S.finished=true; delete RESUME.curve; save(true); badge('curve'); confetti();
}

/* ================= module: Conductivity Lab ================= */
const COMBO_K=['k_sasb','k_wasb','k_ba'];
QUIZ.fastion=[{t:'Na⁺',ok:false,fb:'Sodium ions are fairly slow.'},{t:'H⁺',ok:true,fb:'Yes! H⁺ is by far the best conductor, then OH⁻. That\'s the key to reading these graphs.'},{t:'Cl⁻',ok:false,fb:'Chloride is middling.'}];
QUIZ.shape_k_sasb=[{t:'Fast H⁺ ions are replaced by slower Na⁺ ions',ok:true,fb:'Yes. H⁺ + OH⁻ → H₂O removes fast H⁺, and Na⁺ (much slower) takes its place. After equivalence, extra OH⁻ makes it rise again.'},{t:'The solution gets diluted',ok:false,fb:'Dilution is tiny here. Think about which ions are swapped.'},{t:'NaCl doesn\'t conduct',ok:false,fb:'It does, just less than HCl.'}];
QUIZ.shape_k_wasb=[{t:'Ethanoic acid barely ionises, so adding NaOH makes more ions (Na⁺ and CH₃COO⁻)',ok:true,fb:'Yes. A weak acid starts with few ions. The reaction turns it into ions, so conductivity climbs slowly, then faster once extra OH⁻ appears.'},{t:'H⁺ is being added',ok:false,fb:'No H⁺ is added. Think about what the reaction makes.'},{t:'The probe warms up',ok:false,fb:'Not the reason. Think about ions.'}];
QUIZ.shape_k_ba=[{t:'Ba²⁺ and SO₄²⁻ form a solid, and H⁺ + OH⁻ make water, so almost no ions are left',ok:true,fb:'Yes. BaSO₄ precipitates and water forms, so at equivalence there are hardly any ions. After that, extra H₂SO₄ adds ions again.'},{t:'The meter runs out of battery',ok:false,fb:'Ha. Think about what forms in the flask.'},{t:'Sulfuric acid doesn\'t conduct',ok:false,fb:'It conducts very well. Look at the white cloud in the flask.'}];
function lsq(p){const n=p.length; if(n<2) return null; let sx=0,sy=0,sxx=0,sxy=0; p.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}); const d=n*sxx-sx*sx; if(Math.abs(d)<1e-12) return null; const m=(n*sxy-sx*sy)/d; return {m,b:(sy-m*sx)/n};}
function fitAt(div){const P=run().rec; let A=P.filter(p=>p[0]<div); const B=P.filter(p=>p[0]>div); if(sys().type==='weak') A=A.filter(p=>p[0]>=0.2*div);
  const f1=lsq(A),f2=lsq(B); if(!f1||!f2||Math.abs(f1.m-f2.m)<1e-9) return null; const x=(f2.b-f1.b)/(f1.m-f2.m); return {f1,f2,x,y:f1.m*x+f1.b,nA:A.length,nB:B.length};}
function condFig(P,fit,name,col,xlab){if(!P||!P.length) return ''; const ym=Math.max(1,...P.map(p=>p[1]))*1.1,ys=[0.5,1,2,5,10,20,50].find(t=>ym/t<=6)||100,xm=Math.max(10,Math.ceil((Math.max(...P.map(p=>p[0]))+1)/5)*5);
  const cfg={xmax:xm,xstep:xm>20?5:2,ymin:0,ymax:Math.ceil(ym/ys)*ys,ystep:ys,ylab:'mS/cm',xlab:xlab||'mL added',series:[{pts:P,color:col||'--orange',dots:true,r:3.5}]};
  if(fit){cfg.lines=[{x1:0,y1:fit.f1.b,x2:fit.x,y2:fit.y,color:'--violet',width:2},{x1:fit.x,y1:fit.y,x2:xm,y2:fit.f2.m*xm+fit.f2.b,color:'--teal',width:2}]; cfg.vlines=[{x:fit.x,color:'--pink',label:'equivalence '+fit.x.toFixed(2)+' mL'}];}
  return chartImg(cfg,`Conductivity graph: ${name}. Dots are your readings${fit?'; the two best-fit lines cross at the equivalence point':''}.`);}
function condCfg(extra){const P=run().rec,ym=Math.max(1,...P.map(p=>p[1]),kappa(0))*1.15,xm=Math.max(10,Math.ceil((Math.max(vb(),...P.map(p=>p[0]))+2)/5)*5);
  return Object.assign({xmax:xm,xstep:xm>20?5:2,ymin:0,ymax:+ym.toFixed(1),ylab:'mS/cm',series:[{pts:P,color:'--orange',dots:true}]},extra||{});}
function recCounts(){const ve=veq(),P=run().rec; return {a:P.filter(p=>p[0]<ve-0.3).length,b:P.filter(p=>p[0]>ve+0.3).length,max:Math.max(0,...P.map(p=>p[0]))};}
function startCond(k){setKey(k); autoBench(null,'Measure','titrating'); S.div=null; S.fit=null; S.fitOk=false; S.fitMsg=null; delete S.quiz['shape_'+k]; ['kn','kA','kc'].forEach(x=>{delete S.calc[x]; delete S.ctries[x];});}
function condCalcList(){const s=sys(),V=S.fit.x,nT=s.ct*V/1000,nA=nT*s.ratio,c=nA/0.02500;
  return [{id:'kn',f:`mol ${s.tSym}`,why:'At the equivalence point (the corner) the titrant has exactly reacted with the sample. Concentration × volume counts the moles added.',q:`Moles of ${s.tSym}`,sub:`Equivalence volume from your graph: ${V.toFixed(2)} mL. n = c × V (c = ${s.ct.toFixed(3)} mol/L)`,unit:'mol',target:nT,rel:0.01,hint:`${s.ct.toFixed(3)} × (${V.toFixed(2)} ÷ 1000)`},
    {id:'kA',f:`mol ${s.aSym}`,why:'The equation says how many of each react, so it converts moles of titrant into moles of sample.',q:`Moles of ${s.aSym}`,sub:`Equation: ${s.eq}`,unit:'mol',target:nA,rel:0.01,hint:s.ratioHint},
    {id:'kc',f:`[${s.aSym}]`,why:'Concentration = moles per litre of the original 25.00 mL sample. The water added later spreads the same moles out but doesn\'t change how many there are.',q:`Concentration of ${s.aSym}`,sub:'The sample was 25.00 mL (the 75 mL of water added doesn\'t change the moles).',unit:'mol/L',target:c,rel:0.01,hint:'Moles ÷ 0.02500'}];}
MODULES.cond={title:'Conductivity Lab',blurb:'No indicator: track ions with a conductivity meter and find the end point from a graph.',c:'blue',defKey:'k_sasb',quickBench:true,probe:'cond',
  worlds:[{n:'Learn',c:'blue'},{n:'Measure',c:'orange'},{n:'Analyse',c:'violet'}],
  init:()=>{S.kres={}; startCond('k_sasb');},
  steps:[
  {id:'k_intro',w:0,solo:true,title:'Ions carry the current',
   html:()=>`<p class="lead">Dissolved ions let electricity flow. A conductivity meter measures how well a solution conducts.</p>
    ${newWord('Conductivity','how easily a solution carries an electric current. Unit here: mS/cm.')}
    <div class="bars">${[['H⁺',349.8,'pink'],['OH⁻',198.6,'violet'],['SO₄²⁻',160,'teal'],['Ba²⁺',127.2,'blue'],['Cl⁻',76.3,'yellow'],['Na⁺',50.1,'orange'],['CH₃COO⁻',40.9,'orange']].map(([n,v,c])=>`<div class="bar" style="--c:var(--${c})"><span>${n}</span><i style="width:${v/349.8*100}%"></i><span class="mono">${v}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:.85rem">How well each ion conducts (molar conductivity, S cm²/mol). More ions, or faster ions, means higher conductivity.</p>
    ${quiz('fastion','Which ion is the best conductor?')}
    ${quizOk('fastion')?'<p>During a titration, ions get swapped, removed or added. The conductivity changes direction at the equivalence point, so you can find it with a graph, no indicator needed. Handy for coloured or cloudy solutions.</p>':''}`,
   can:()=>quizOk('fastion'),gate:'Answer the question',next:'Pick a reaction'},
  {id:'k_pick',w:0,solo:true,title:'Pick a reaction',
   html:()=>`<div class="choices">${COMBO_K.map(k=>{const v=CHEM[k],d=PROG.cond.combos[k]||S.kres[k]; return `<button type="button" class="choice" data-k="${k}" aria-pressed="${k===S.key}" style="--c:${cv(v.c)}"><span class="band"><span>${v.type==='ba'?'Precipitate':v.type==='weak'?'Weak acid':'Strong acid'}</span><span>${d?'✓ done':''}</span></span><span class="body"><b>${v.tab}</b><small>Find: concentration of ${v.aSym} (25.00 mL + 75 mL water)</small><small>Titrant: ${v.ct.toFixed(3)} mol/L ${v.tSym}</small></span></button>`;}).join('')}</div>`,
   bind:()=>document.querySelectorAll('.choice[data-k]').forEach(b=>b.addEventListener('click',()=>{startCond(b.dataset.k); blip('tap'); snap(); renderCard();})),
   can:()=>true,next:'Start measuring',onNext:()=>startCond(S.key)},
  {id:'k_run',w:1,title:'Measure and record',strip:true,panel:'cond',
   html:()=>{const n=run().rec.length; return `<div class="ctrl"><p class="coach" id="coach"></p><div class="row"><button class="btn go big" id="recBtn" type="button">Record point</button><button class="btn" id="plusH" type="button">+0.50 mL</button><button class="btn hold" id="tap" type="button">Hold to pour</button></div></div>
     <canvas class="chart" id="kChart"></canvas><p class="muted" style="font-size:.85rem">${n} point${n===1?'':'s'} recorded. Add about 0.5–1 mL, then record. Keep going until the graph has clearly turned a corner and carried on as far again.</p>`;},
   coach:()=>`${vb().toFixed(2)} mL added · ${kappa(vb()).toFixed(2)} mS/cm`,
   live:()=>{const c=$('kChart'); if(c) drawChart(c,condCfg());},
   bind:()=>{bindTitrate(1.0); $('plusH').addEventListener('click',()=>add(0.50,false));
     $('recBtn').addEventListener('click',()=>{const R=run().rec,v=+vb().toFixed(2); if(R.some(p=>Math.abs(p[0]-v)<0.1)){floatMsg('Add some titrant first'); wrong(); return;}
       R.push([v,+(kappa(v)*(1+rand(-0.004,0.004))).toFixed(3)]); R.sort((a,b)=>a[0]-b[0]); blip('drop'); award(2); renderCard(true);});
     MODULES.cond.steps[sid('k_run')].live();},
   can:()=>{const c=recCounts(); return c.a>=4&&c.b>=4&&c.max>=1.6*veq();},
   gate:'Need more points past the turn'},
  {id:'k_fit',w:2,solo:true,title:'Find the corner',strip:true,
   html:()=>{const f=S.div!=null?fitAt(S.div):null; S.fit=f; const ok=f&&Math.abs(f.x-veq())<=0.3&&S.fitOk;
     return `${doLine('Drag','across the graph to move the divider. Points on the left make line 1, points on the right make line 2. Where the lines cross is the equivalence point.')}
     <canvas class="chart" id="kChart" style="height:230px"></canvas>
     ${S.key==='k_wasb'?'<p class="muted" style="font-size:.84rem">The first few readings curve because the weak acid barely ionises, so they\'re left out of line 1.</p>':''}
     ${f?`<p class="toastline info">Lines cross at <b class="mono">${f.x.toFixed(2)} mL</b> (line 1: ${f.nA} points, line 2: ${f.nB} points)</p>`:'<p class="toastline info">Drag on the graph to place the divider.</p>'}
     ${S.fitMsg?`<p class="toastline ${S.fitOk?'good':'bad'}">${S.fitMsg}</p>`:''}
     ${f&&!ok?'<div class="row"><button class="btn go big" id="fitBtn" type="button">Lock in</button></div>':''}`;},
   bind:()=>{const c=$('kChart'),draw=()=>{const f=S.div!=null?fitAt(S.div):null,cfg=condCfg(); cfg.vlines=S.div!=null?[{x:S.div,color:'--muted'}]:[];
       if(f){cfg.lines=[{x1:cfg.xmin||0,y1:f.f1.b,x2:f.x,y2:f.y,color:'--blue',width:2},{x1:f.x,y1:f.y,x2:cfg.xmax,y2:f.f2.m*cfg.xmax+f.f2.b,color:'--pink',width:2}]; cfg.marks=[{x:f.x,y:Math.max(0,f.y),color:'--yellow'}];} return drawChart(c,cfg);};
     let m=draw(),down=false; const setD=e=>{if(!m) return; S.div=Math.max(0.5,m.xFromClient(e.clientX)); S.fitMsg=null; S.fitOk=false; m=draw();};
     c.addEventListener('pointerdown',e=>{down=true; try{c.setPointerCapture(e.pointerId);}catch(_){} setD(e);}); c.addEventListener('pointermove',e=>{if(down) setD(e);});
     c.addEventListener('pointerup',()=>{down=false; renderCard(true);});
     const b=$('fitBtn'); if(b) b.addEventListener('click',()=>{const f=fitAt(S.div); if(!f) return; if(Math.abs(f.x-veq())<=0.3){S.fitOk=true; S.fitMsg=`Equivalence volume: ${f.x.toFixed(2)} mL.`; right(20,'corner found');} else {S.fitOk=false; S.fitMsg=f.nA<3||f.nB<3?'Each line needs at least 3 points.':'The lines don\'t fit well. Put the divider right at the corner of the graph.'; wrong();} renderCard(true);});},
   can:()=>!!(S.fit&&S.fitOk),gate:'Lock in the corner'},
  {id:'k_calc',w:2,calc:true,title:'Calculate',strip:true,html:()=>calcHTML(condCalcList()),bind:()=>bindCalc(condCalcList()),can:()=>calcDone(condCalcList()),gate:'Solve them all'},
  {id:'k_shape',w:2,solo:true,title:'Explain the shape',
   html:()=>`<canvas class="chart" id="kChart" style="height:170px"></canvas>${quiz('shape_'+S.key,S.key==='k_sasb'?'Why does the conductivity fall at first?':S.key==='k_wasb'?'Why does it rise slowly before the equivalence point?':'Why does it drop almost to zero?')}`,
   bind:()=>drawChart($('kChart'),condCfg()),can:()=>quizOk('shape_'+S.key),gate:'Answer the question',
   next:()=>COMBO_K.every(k=>S.kres[k]||k===S.key)?'Finish':'Next reaction',
   onNext:()=>{const k=S.key,s=sys(),V=S.fit.x; S.kres[k]={fit:S.fit?{f1:S.fit.f1,f2:S.fit.f2,x:S.fit.x,y:S.fit.y}:null,rec:run().rec.slice(),V,c:s.ct*V/1000*s.ratio/0.025,trueC:S.Ca}; PROG.cond.combos[k]=true; save();
     const nxt=COMBO_K.find(x=>!S.kres[x]); if(nxt) startCond(nxt); else finishCond();},
   goto:()=>COMBO_K.every(k=>S.kres[k])?'k_report':'k_pick'},
  {id:'k_report',w:2,solo:true,title:'Conductivity Lab complete',last:true,html:()=>`<p class="lead">All three reactions done.</p>${reportActions()}${S.report}`,bind:()=>bindReportActions(S.report,'Conductivity Lab report')}
]};
function finishCond(){
  const rows=COMBO_K.map(k=>{const r=S.kres[k],v=CHEM[k]; return `<tr><td><b>${v.tab}</b></td><td class="num mono">${r.V.toFixed(2)}</td><td class="num mono">${r.c.toFixed(4)}</td><td class="num mono">${r.trueC.toFixed(4)}</td></tr>`;}).join('');
  const work=COMBO_K.map(k=>{const r=S.kres[k],v=CHEM[k],n=v.ct*r.V/1000; return `${v.tab}: n(${v.tSym}) = ${v.ct.toFixed(3)} × ${(r.V/1000).toFixed(5)} = ${sci(n)} mol → n(${v.aSym}) = ${sci(n*v.ratio)} mol → c = ${sci(n*v.ratio)} ÷ 0.02500 = ${r.c.toFixed(4)} mol/L`;}).join('<br>');
  const html=reportShell('Conductivity Lab: conductometric titrations','To find the concentration of three solutions by following conductivity during a titration, with no indicator.',
   `<h4>Method</h4><ul><li>25.00 mL of sample plus 75 mL of distilled water in a beaker with a conductivity probe.</li><li>Titrant added in small portions from a burette, recording conductivity after each.</li><li>Two best-fit lines drawn through the points either side of the turn; their intersection gives the equivalence volume.</li></ul>
    <h4>Equations</h4><p class="mono">${COMBO_K.map(k=>CHEM[k].eq).join('<br>')}</p>
    <h4>Results</h4><div class="tw"><table><thead><tr><th>Reaction</th><th class="num">V equiv. (mL)</th><th class="num">c found (mol/L)</th><th class="num">Accepted (mol/L)</th></tr></thead><tbody>${rows}</tbody></table></div>${COMBO_K.map(k=>condFig(S.kres[k].rec,S.kres[k].fit,CHEM[k].tab,'--'+CHEM[k].c,'mL '+CHEM[k].tSym+' added')).join('')}
    <h4>Calculations</h4><div class="work">${work}</div>
    <h4>Explaining the shapes</h4><ul><li>HCl + NaOH: falls as fast H⁺ is replaced by slower Na⁺, then rises as excess OH⁻ builds up (V-shape).</li><li>CH₃COOH + NaOH: starts low because the weak acid barely ionises, rises slowly as ions form, then faster after equivalence.</li><li>Ba(OH)₂ + H₂SO₄: falls almost to zero because BaSO₄ precipitates and water forms, then rises with excess acid.</li></ul>
    <h4>Evaluation</h4><ul><li>Conductometric titrations work for coloured or cloudy solutions where an indicator can't be seen.</li><li>Adding water first, and using a more concentrated titrant, keeps dilution small so the lines stay straight.</li><li>The accuracy depends on having enough points well away from the corner on both sides.</li></ul>`);
  S.report=html; saveReport('cond','Conductivity Lab',html); PROG.cond.done=true; S.finished=true; delete RESUME.cond; save(true); badge('cond'); confetti();
}

/* ================= module: Vitamin C investigation ================= */
const JUICES=[{name:'Freshly squeezed',c:'orange',lo:46,hi:56},{name:'Chilled bottled',c:'yellow',lo:30,hi:40},{name:'Long-life (shelf-stable)',c:'pink',lo:14,hi:24}];
QUIZ.vratio=[{t:'1',ok:false,fb:'Each IO₃⁻ makes 3 I₂. How many vitamin C can 3 I₂ react with?'},{t:'3',ok:true,fb:'Yes. 1 IO₃⁻ → 3 I₂ → reacts with 3 vitamin C. So n(vitamin C) = 3 × n(IO₃⁻).'},{t:'5',ok:false,fb:'The 5 is for iodide (I⁻), not vitamin C. Follow the I₂.'}];
QUIZ.vconc=[{t:'Heat treatment and long storage break vitamin C down',ok:true,fb:'Yes. Long-life juice is heat-treated and sits on the shelf for months. Vitamin C is destroyed by heat and by oxygen over time.'},{t:'Long-life juice has extra water added',ok:false,fb:'Not the main reason. Think about how it\'s processed and stored.'},{t:'The carton absorbs vitamin C',ok:false,fb:'No. Think about heat and time.'}];
QUIZ.veval=[{t:'Strain the pulp, use a white tile, and compare against an unreacted sample',ok:true,fb:'Yes. Removing pulp and having a reference colour makes the first blue-black much easier to spot.'},{t:'Add more starch',ok:false,fb:'More starch won\'t fix the orange colour hiding the change.'},{t:'Titrate faster',ok:false,fb:'That makes overshooting more likely.'}];
QUIZ.vox=[{t:'Vitamin C reacts with oxygen in the air, so the amount drops while it sits',ok:true,fb:'Yes. That\'s a systematic error: waiting would make every result too low.'},{t:'The juice evaporates',ok:false,fb:'Not significantly. Think about what vitamin C reacts with.'},{t:'Starch goes off',ok:false,fb:'Not the main issue. Think about vitamin C and air.'}];
const mgOf=mean=>3*0.001000*mean/1000*176.12*1000*5;
function setJuice(j){S.j=j; S.runSet='j'+j; S.Ca=S.juices[j].mg/17612; S.rated={};}
function prepJuice(j){setJuice(j); benchPos(); S.runs=[]; S.cur=-1; S.R=null; S.setup.aliquot=false; S.vprep=0;}
function vitcSteps(){
  const out=[
  {id:'v_intro',w:0,solo:true,title:'The vitamin C showdown',
   html:()=>`<p class="lead">Your body can't make vitamin C, so it has to come from food. Too little for too long causes scurvy: bleeding gums, wounds that won't heal.</p>
    <p>Vitamin C is fragile. <b>Heat, oxygen and time</b> all break it down. So does it matter which orange juice you buy?</p>
    <div class="info-card" style="--c:var(--orange);--c-soft:var(--orange-soft)"><b>Aim</b><span>Compare the vitamin C concentration (mg per 100 mL) of three orange juices by redox titration.</span></div>
    <div class="bars">${JUICES.map(J=>`<div class="bar" style="--c:var(--${J.c})"><span>${J.name}</span><i style="width:100%;opacity:.35"></i><span>?</span></div>`).join('')}</div>
    ${why('scurvy','Sailors on long voyages used to die of scurvy until the navy started giving them citrus. That\'s where the nickname "limey" comes from.')}`,can:()=>true,next:'How do we measure it?'},
  {id:'v_chem',w:0,solo:true,title:'The chemistry',
   html:()=>`<p>Vitamin C (ascorbic acid, C₆H₈O₆) reacts with iodine. We make the iodine in the flask from <b>potassium iodate</b> (the titrant) and excess <b>potassium iodide</b>:</p>
    <div class="work">IO₃⁻ + 5I⁻ + 6H⁺ → 3I₂ + 3H₂O<br>C₆H₈O₆ + I₂ → C₆H₆O₆ + 2I⁻ + 2H⁺</div>
    <p>While vitamin C is left, the iodine gets used up instantly. Once it's all gone, iodine builds up and turns the <b>starch</b> blue-black. That's the end point.</p>
    ${newWord('Redox titration','a titration where electrons are transferred. Here vitamin C is oxidised by iodine.')}
    ${quiz('vratio','So 1 IO₃⁻ deals with how many vitamin C molecules?')}`,can:()=>quizOk('vratio'),gate:'Answer the question'},
  {id:'v_predict',w:0,solo:true,title:'Make a prediction',
   html:()=>`${doLine('Pick','the juice you think has the MOST vitamin C.')}
    <div class="choices">${JUICES.map((J,i)=>`<button type="button" class="choice" data-p="${i}" aria-pressed="${S.pred===i}" style="--c:var(--${J.c})"><span class="band"><span>Juice ${i+1}</span></span><span class="body"><b>${J.name}</b></span></button>`).join('')}</div>
    ${S.pred!=null?`<p class="toastline info"><b>Hypothesis:</b> If vitamin C breaks down with processing and storage, then the ${JUICES[S.pred].name.toLowerCase()} juice will have the highest concentration.</p>`:''}`,
   bind:()=>document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{S.pred=+b.dataset.p; blip('tap'); renderCard(true);})),can:()=>S.pred!=null,gate:'Make a prediction',onNext:()=>prepJuice(0)}];

      html:()=>{const n=S.vprep||0,items=[['Pipette 20.00 mL of juice into the flask','The aliquot. A 20.00 mL pipette is ±0.03 mL.'],['Add about 10 mL of potassium iodide (KI) solution','Excess I⁻ so all the iodate turns into iodine.'],['Add about 5 mL of 1 mol/L hydrochloric acid','The iodate reaction needs H⁺ ions.'],['Add 1 mL of starch solution','Starch + iodine = blue-black. That\'s your signal.'],['Fill the burette with 0.001000 mol/L KIO₃','The titrant. Rinse with it first, as always.']];
        return `${checks(items.map((x,i)=>({t:['Juice','KI','HCl','Starch','Burette'][i],done:n>i})))}
        ${n<5?`${doLine('Tap',items[n][0])}<p class="muted" style="font-size:.88rem">${items[n][1]}</p><div class="row"><button class="btn go big" id="vAdd" type="button">Do it</button></div>`:'<p class="toastline good">Flask ready: juice, iodide, acid and starch. Burette full of iodate.</p>'}`;},
      bind:()=>{const b=$('vAdd'); if(b) b.addEventListener('click',()=>{S.vprep=(S.vprep||0)+1; if(S.vprep===1){S.setup.aliquot=true; S.setup.flaskOn=true; S.anim.fill=performance.now();} if(S.vprep===5){autoBench(null,'Rough','readInitial');} award(3); renderAll();});},
      can:()=>(S.vprep||0)>=5,gate:'Prepare the flask'});
    out.push(stepRead({id:'v_read_'+j,w:j+1,title:`${J.name}: read the burette`}));
    out.push(stepRough({id:'v_rough_'+j,w:j+1,title:`${J.name}: rough run`}));
    out.push(stepPrecise({id:'v_prec_'+j,w:j+1,title:`${J.name}: accurate runs`,roughId:'v_rough_'+j,onNext:()=>{S.jres[j]={runs:JSON.parse(JSON.stringify(S.runs)),mean:meanOf(concordant())}; if(j<2) prepJuice(j+1);}}));
  });
  out.push(
  {id:'v_calc',w:4,calc:true,title:`${JUICES[0].name}: calculate`,html:()=>calcHTML(vCalc1(),doLine('Solve','Full working for juice 1. Each answer unlocks the next.')),bind:()=>bindCalc(vCalc1()),can:()=>calcDone(vCalc1()),gate:'Solve them all'},
  {id:'v_calc23',w:4,calc:true,title:'Juices 2 and 3',html:()=>calcHTML(vCalc23(),doLine('Repeat','Same method, straight to mg per 100 mL.')),bind:()=>bindCalc(vCalc23()),can:()=>calcDone(vCalc23()),gate:'Solve both'},
  {id:'v_compare',w:4,solo:true,title:'The results',
   html:()=>{const v=S.jres.map(r=>mgOf(r.mean)),mx=Math.max(...v),top=v.indexOf(mx);
    return `<div class="bars">${JUICES.map((J,i)=>`<div class="bar" style="--c:var(--${J.c})"><span>${J.name}</span><i style="width:${v[i]/mx*100}%"></i><span class="mono">${v[i].toFixed(1)}</span></div>`).join('')}</div>
     <p class="muted" style="font-size:.84rem">mg of vitamin C per 100 mL</p>
     <p class="toastline ${top===S.pred?'good':'info'}">You predicted ${JUICES[S.pred].name.toLowerCase()}. ${top===S.pred?'Your hypothesis is supported.':`The data doesn't support it: ${JUICES[top].name.toLowerCase()} came out highest.`}</p>
     ${quiz('vconc','Why is the long-life juice lowest?')}`;},can:()=>quizOk('vconc'),gate:'Answer the question'},
  {id:'v_eval',w:4,solo:true,title:'Evaluate',
   html:()=>`${quiz('veval','The juice is orange, so the blue-black end point is hard to see. Best fix?')}${quizOk('veval')?quiz('vox','Why titrate straight after opening or squeezing the juice?'):''}`,
   can:()=>quizOk('veval')&&quizOk('vox'),gate:'Answer both',next:'Finish',onNext:()=>finishVitc()},
  {id:'v_report',w:4,solo:true,title:'Investigation complete',last:true,html:()=>`<p class="lead">Juice detective work done.</p>${reportActions()}${S.report}`,bind:()=>bindReportActions(S.report,'Vitamin C report')});
  return out;
}
function vCalc1(){const m=S.jres[0].mean,nI=0.001000*m/1000,nA=3*nI,mg=nA*176.12*1000,per=mg*5;
  return [{id:'v_mean',f:'Average titre',why:'Concordant titres agree, so their average is the best value. The rough run is left out.',q:'Average titre',sub:`Concordant titres: ${concordantOf(S.jres[0].runs).map(r=>titre(r).toFixed(2)).join(', ')} mL`,unit:'mL',target:m,abs:0.011,hint:'Add them, divide by how many.'},
    {id:'v_nI',f:'mol IO₃⁻',why:'We know the iodate concentration and the volume used, so c × V counts the moles of iodate added.',q:'Moles of IO₃⁻',sub:'n = c × V   (c = 0.001000 mol/L, V in L)',unit:'mol',target:nI,rel:0.01,hint:'0.001000 × (average ÷ 1000)'},
    {id:'v_nA',f:'mol vit C',why:'Each IO₃⁻ makes 3 I₂, and each I₂ reacts with one vitamin C. So every iodate deals with 3 vitamin C.',q:'Moles of vitamin C',sub:'n(C₆H₈O₆) = 3 × n(IO₃⁻)',unit:'mol',target:nA,rel:0.01,hint:'Multiply by 3.'},
    {id:'v_mg',f:'mg in 20 mL',why:'Nutrition labels use mass, not moles. Mass = moles × molar mass, then × 1000 to turn grams into milligrams.',q:'Mass of vitamin C in 20.00 mL',sub:'m = n × M   (M = 176.12 g/mol), then × 1000 for mg',unit:'mg',target:mg,rel:0.01,hint:'moles × 176.12 × 1000'},
    {id:'v_per',f:'mg/100 mL',why:'Labels compare drinks per 100 mL. Our sample was 20.00 mL, and 100 mL is 5 times that.',q:'mg per 100 mL',sub:'100 mL is 5 × 20.00 mL',unit:'mg/100 mL',target:per,rel:0.01,hint:'Multiply by 5.'}].concat(uncSteps('vu_',m,20.00,null,per,'mg/100 mL'));}
function vCalc23(){return [1,2].map(j=>({id:'v_j'+j,f:JUICES[j].name,why:'Same chain as juice 1: titre → mol IO₃⁻ → × 3 → × 176.12 g/mol → × 1000 → × 5.',q:`${JUICES[j].name}: mg per 100 mL`,sub:`Average titre ${S.jres[j].mean.toFixed(2)} mL`,unit:'mg/100 mL',target:mgOf(S.jres[j].mean),rel:0.01,hint:`0.001000 × (${S.jres[j].mean.toFixed(2)} ÷ 1000) × 3 × 176.12 × 1000 × 5`}));}
function finishVitc(){
  const v=S.jres.map(r=>mgOf(r.mean)),pct=S.jres.map(r=>(0.10/r.mean+0.03/20)*100);
  const tables=JUICES.map((J,i)=>`<p><b>${J.name}</b></p>${tableRuns(S.jres[i].runs,concordantOf(S.jres[i].runs))}`).join('');
  const m=S.jres[0].mean,nI=0.001*m/1000;
  const html=reportShell('Vitamin C in orange juice','To compare the vitamin C concentration of three orange juices by redox titration with potassium iodate.',
   `<h4>Hypothesis</h4><p>If vitamin C breaks down with processing and storage, then the ${JUICES[S.pred].name.toLowerCase()} juice will have the highest concentration.</p>
    <h4>Method</h4><ul><li>20.00 mL of juice pipetted into a conical flask with about 10 mL KI solution, 5 mL of 1 mol/L HCl and 1 mL starch.</li><li>Titrated with 0.001000 mol/L KIO₃ to the first permanent blue-black colour.</li><li>Rough run, then accurate runs until two titres agreed within 0.10 mL, for each juice.</li></ul>
    <h4>Equations</h4><p class="mono">IO₃⁻ + 5I⁻ + 6H⁺ → 3I₂ + 3H₂O<br>C₆H₈O₆ + I₂ → C₆H₆O₆ + 2I⁻ + 2H⁺<br>Overall: n(C₆H₈O₆) = 3 × n(IO₃⁻)</p>
    <h4>Results</h4>${tables}
    <div class="tw"><table><thead><tr><th>Juice</th><th class="num">Average titre (mL)</th><th class="num">mg/100 mL</th><th class="num">± (mg/100 mL)</th></tr></thead><tbody>${JUICES.map((J,i)=>`<tr><td>${J.name}</td><td class="num mono">${S.jres[i].mean.toFixed(2)}</td><td class="num mono">${v[i].toFixed(1)}</td><td class="num mono">${(v[i]*pct[i]/100).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>${barsHTML(JUICES.map((J,i)=>({label:J.name,v:v[i],txt:v[i].toFixed(1)+' ± '+(v[i]*pct[i]/100).toFixed(1),color:['#d86b00','#e0a800','#d61f73'][i%3]})),'mg/100 mL','Vitamin C in each juice (mg per 100 mL). This is a redox titration with a starch indicator, so there is no pH curve — the bar graph compares the results.')}
    <h4>Sample calculation (${JUICES[0].name})</h4><div class="work">n(IO₃⁻) = 0.001000 × ${(m/1000).toFixed(5)} = ${sci(nI)} mol<br>n(C₆H₈O₆) = 3 × ${sci(nI)} = ${sci(3*nI)} mol<br>m = ${sci(3*nI)} × 176.12 = ${(3*nI*176.12*1000).toFixed(2)} mg in 20.00 mL<br>× 5 = ${v[0].toFixed(1)} mg per 100 mL<br>Instrumental % uncertainty (equipment tolerances only) = (0.10 ÷ ${m.toFixed(2)} + 0.03 ÷ 20.00) × 100 = ${pct[0].toFixed(2)} %</div>
    <h4>Conclusion</h4><p>${JUICES[v.indexOf(Math.max(...v))].name} juice had the most vitamin C (${Math.max(...v).toFixed(1)} mg/100 mL) and ${JUICES[v.indexOf(Math.min(...v))].name.toLowerCase()} juice the least (${Math.min(...v).toFixed(1)} mg/100 mL). The hypothesis is ${v.indexOf(Math.max(...v))===S.pred?'supported':'not supported'}. Heat treatment and long storage expose vitamin C to heat and oxygen, which break it down.</p>
    <h4>Evaluation</h4><ul><li>The orange colour and pulp make the blue-black end point harder to see. Straining the juice and comparing against an untitrated sample would help.</li><li>Vitamin C oxidises in air, so samples should be titrated straight away. Delays would make results systematically low.</li><li>Only one brand of each type was tested, so the conclusion can't be generalised to all juices of that type.</li></ul>`);
  S.report=html; saveReport('vitc','Vitamin C investigation',html); PROG.vitc.done=true; S.finished=true; delete RESUME.vitc; save(true); badge('vitc'); confetti();
}

function backSteps(){return [
  {id:'b_intro',w:0,solo:true,title:'The antacid problem',

    ${quiz('whyback','Why can\'t we just titrate the tablet directly?')}
    ${quizOk('whyback')?`${newWord('Back titration','add a known EXCESS of a reagent, let it react, then titrate what\'s left over.')}<div class="work">acid added = acid used by the tablet + acid left over<br>so: acid used = acid added − acid left over</div><div class="info-card" style="--c:var(--teal);--c-soft:var(--teal-soft)"><b>Aim</b><span>To determine the mass of CaCO₃ in an antacid tablet by back titration.</span></div>`:''}`,
   can:()=>quizOk('whyback'),gate:'Answer the question'},
  {id:'b_idea',w:0,solo:true,title:'The back titration trick',
   html:()=>{const st=S.bidea||0,steps=['Step 1: add a KNOWN amount of acid. We know its concentration and volume, so we know exactly how many moles we added.','Step 2: the tablet reacts and uses up SOME of the acid. We can\'t measure that part directly. That\'s the mystery.','Step 3: titrate the acid that\'s LEFT OVER with NaOH. That part we can measure.','So: acid used by tablet = acid added − acid left over.'];
     const bar=st===0?'<div style="flex-basis:100%;background:var(--surface-2);color:var(--muted)">empty beaker</div>':`<div style="flex-basis:${st>=2?40:0}%;background:var(--orange)">${st>=2?'used by tablet ?':''}</div><div style="flex-basis:${st>=2?60:100}%;background:${st>=3?'var(--blue)':'var(--violet)'}">${st>=3?'left over: titrate it!':st>=2?'left over':'HCl added (known)'}</div>`;
     return `<div class="acid"><div class="acidbar">${bar}</div></div>
     <p class="lead">${steps[Math.min(st,3)]}</p>
     ${st<3?`<div class="row"><button class="btn go big" id="bNext" type="button">${['Add the acid','Let the tablet react','Titrate the leftover'][st]}</button></div>`:`<div class="work">acid ADDED   (known: c × V)
 − acid LEFT OVER   (measured by titration)
 = acid USED by the tablet   → moles of CaCO₃</div>${quiz('bq','Practice: you add 10.0 mmol of acid. The titration shows 3.5 mmol is left over. How much did the tablet use?')}`}
     ${why('bwhy','It\'s like working out what someone spent: you know what was in their wallet before, you count what\'s left, and the difference is what they spent.')}`;},
   bind:()=>{const b=$('bNext'); if(b) b.addEventListener('click',()=>{S.bidea=(S.bidea||0)+1; blip('tap'); award(3); renderCard(true);});},
   can:()=>(S.bidea||0)>=3&&quizOk('bq'),gate:'Work through the idea'},
  {id:'b_dilute',w:0,solo:true,title:'Why dilute to 250 mL?',
   html:()=>`<p>After the tablet reacts, we pour everything into a <b>250.0 mL volumetric flask</b> and fill it exactly to the line. Then we pipette out <b>25.00 mL</b> portions to titrate.</p>
     <div class="acid"><div class="acidbar">${Array.from({length:10},(_,i)=>`<div style="flex-basis:10%;background:${i===0?'var(--pink)':'var(--blue)'};border-right:2px solid var(--surface)">${i===0?'25 mL':''}</div>`).join('')}</div></div>
     <p>Each 25.00 mL portion is exactly <b>one tenth</b> of the flask. That gives us several identical samples, so we can repeat the titration until results are concordant. At the end we multiply by 10 to get back to the whole flask.</p>
     ${quiz('bx','One 25.00 mL portion contains 1.50 mmol of leftover HCl. How much leftover HCl is in the whole 250.0 mL flask?')}`,
   can:()=>quizOk('bx'),gate:'Answer the question'},
  {id:'b_crush',w:1,title:'Crush the tablet',scene:'prep',panel:'none',
   html:()=>`${doLine('Tap',`Grind the tablet into a fine powder (${Math.min(6,S.prep.crush)}/6).`)}<div class="row"><button class="btn go big" id="grind" type="button" ${S.prep.crush>=6?'disabled':''}>Grind</button></div>${why('crush','Powder has a much bigger surface area, so it reacts with the acid faster and completely.')}`,
   bind:()=>{const g=$('grind'); if(g) g.addEventListener('click',()=>{S.prep.crush++; S.prep.pestle=!S.prep.pestle; blip('tap'); if(S.prep.crush===6) award(10,'powdered'); renderAll();});},can:()=>S.prep.crush>=6,gate:'Grind it fine',onNext:()=>{S.prep.stage='acid';}},
  {id:'b_acid',w:1,title:'Add excess acid',scene:'prep',panel:'none',
   html:()=>{const P=S.prep; return `<div class="work">CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂</div>
    ${!P.acid?doLine('Tap','Pipette in 50.00 mL of 0.5000 mol/L HCl. That\'s more than enough to react with all the CaCO₃.')+'<div class="row"><button class="btn go big" id="addAcid" type="button">Add 50.00 mL HCl</button></div>'
     :P.fizz>0?doLine('Swirl','until the fizzing stops, so every bit of CaCO₃ has reacted.')+'<div class="row"><button class="btn go big" id="swirl" type="button">Swirl</button></div>'
     :'<p class="toastline good">Fizzing stopped. All the CaCO₃ has reacted, with HCl left over.</p>'}
    ${newWord('Excess','more than is needed, so some is left over at the end.')}`;},
   bind:()=>{const a=$('addAcid'); if(a) a.addEventListener('click',()=>{S.prep.acid=true; S.prep.fizz=1; award(5); fizzLoop(); renderAll();});
     const s=$('swirl'); if(s) s.addEventListener('click',()=>{S.prep.fizz=Math.max(0,+(S.prep.fizz-0.2).toFixed(2)); blip('tap'); if(S.prep.fizz===0) award(10,'reacted'); renderAll();});},
   can:()=>S.prep.acid&&S.prep.fizz===0,gate:'React it fully',onNext:()=>{S.prep.stage='flask';}},
  {id:'b_flask',w:1,title:'Make up to 250.0 mL',scene:'prep',panel:'vmark',
   html:()=>{const P=S.prep;
    if(!P.transfer) return `${doLine('Tap','Pour the mixture into a 250.0 mL volumetric flask, then rinse the beaker into it with distilled water.')}<div class="row"><button class="btn go big" id="xfer" type="button">Transfer and rinse</button></div>${why('rinseb','Rinsing makes sure every bit of leftover acid ends up in the flask.')}`;
    if(!P.ok) return `${doLine('Fill','Add water until the bottom of the meniscus sits ON the line. Use the wash bottle, then drops near the top. Watch the zoom.')}
      <div class="row"><button class="btn hold" id="wb" type="button">Hold: wash bottle</button><button class="btn hold" id="dp" type="button">Hold: dropper</button><button class="btn" id="d1" type="button">1 drop</button><button class="btn go" id="lockV" type="button">Lock in</button></div>${msgHTML()}`;
    return P.stopper?'<p class="toastline good">Made up to exactly 250.0 mL and mixed. Every 25.00 mL now holds exactly one tenth of the leftover acid.</p>':`<p class="toastline good">On the mark!</p>${doLine('Tap','Stopper and invert the flask about 10 times so it\'s evenly mixed.')}<div class="row"><button class="btn go big" id="inv" type="button">Stopper and mix</button></div>`;},
   bind:()=>{const P=S.prep,x=$('xfer'); if(x) x.addEventListener('click',()=>{P.transfer=true; P.w=150; P.tries=0; award(5); renderAll();});
     if($('wb')){holdButton($('wb'),dt=>{P.w+=20*dt; overV(); renderScene();}); holdButton($('dp'),dt=>{P.w+=0.5*dt; overV(); renderScene();}); $('d1').addEventListener('click',()=>{P.w+=0.05; overV(); renderScene();});
       $('lockV').addEventListener('click',()=>{P.tries++; const d=P.w-250; if(Math.abs(d)<=0.08){P.ok=true; S.msg=null; right(P.tries===1?20:8,'on the mark'); if(P.tries===1) badge('mark');} else {wrong(); setMsg(false,d<0?'Below the mark. Add a little more.':'Above the mark.');} renderAll();});}
     const iv=$('inv'); if(iv) iv.addEventListener('click',()=>{P.stopper=true; award(5,'mixed'); renderAll();});},
   can:()=>S.prep.ok&&S.prep.stopper,gate:'Make it up to the mark'},
  {id:'b_aliq',w:2,title:'Take an aliquot',strip:true,
   html:()=>S.setup.aliquot?'<p class="toastline good">25.00 mL aliquot in the flask with phenolphthalein. Ready to titrate the leftover acid.</p>':`${doLine('Tap','Pipette 25.00 mL of the diluted solution into a conical flask and add phenolphthalein.')}<div class="row"><button class="btn go big" id="aliq" type="button">Pipette and add indicator</button></div>`,
   bind:()=>{const a=$('aliq'); if(a) a.addEventListener('click',()=>{autoBench('phenolphthalein','Rough','readInitial'); award(5); renderAll();});},can:()=>S.setup.aliquot,gate:'Take the aliquot'},
  stepRead({id:'b_read',w:2}),stepRough({id:'b_rough',w:2}),stepPrecise({id:'b_prec',w:2,roughId:'b_rough'}),
  {id:'b_calc',w:3,calc:true,title:'Work backwards',html:()=>calcHTML(bCalc(),doLine('Solve','Follow the acid: added − left over = used by the tablet.')),bind:()=>bindCalc(bCalc()),can:()=>calcDone(bCalc()),gate:'Solve them all',next:'Finish',onNext:()=>finishBack()},
  {id:'b_report',w:3,solo:true,title:'Investigation complete',last:true,html:()=>`<p class="lead">You found ${S.bmg.toFixed(0)} mg of CaCO₃ in the tablet (label: 500 mg).</p>${reportActions()}${S.report}`,bind:()=>bindReportActions(S.report,'Back titration report')}
];}

function bCalc(){const c=concordant(),m=meanOf(c),nN=0.1*m/1000,nEx=nN*10,nR=0.02500-nEx,nC=nR/2,mg=nC*100.09*1000,pct=mg/500*100;
  return [{id:'b_mean',f:'Average titre',why:'Concordant titres agree, so their average is the best value. The rough run is left out.',q:'Average titre',sub:`Concordant titres: ${c.map(r=>titre(r).toFixed(2)).join(', ')} mL`,unit:'mL',target:m,abs:0.011,hint:'Add them, divide by how many.'},
    {id:'b_nN',f:'mol NaOH',why:'We know the NaOH concentration and the volume used, so c × V counts the moles of NaOH.',q:'Moles of NaOH',sub:'n = c × V   (0.1000 mol/L)',unit:'mol',target:nN,rel:0.01,hint:'0.1000 × (average ÷ 1000)'},
    {id:'b_nH',f:'HCl left (25 mL)',why:'NaOH and HCl react 1 : 1, so the NaOH tells us exactly how much leftover HCl was in that 25.00 mL portion.',q:'Moles of HCl left over in the 25.00 mL aliquot',sub:'HCl + NaOH → NaCl + H₂O (1 : 1)',unit:'mol',target:nN,rel:0.01,hint:'Same as the moles of NaOH.'},
    {id:'b_nEx',f:'× 10',why:'We only titrated one tenth of the 250.0 mL flask. The whole flask held 10 times as much leftover HCl.',q:'Moles of HCl left over in total',sub:'The aliquot was 25.00 mL out of 250.0 mL',unit:'mol',target:nEx,rel:0.01,hint:'Multiply by 10.'},
    {id:'b_nR',f:'added − left',why:'The back titration trick: acid used by the tablet = acid added − acid left over.',q:'Moles of HCl used by the tablet',sub:'HCl added = 0.5000 × 0.05000 = 0.02500 mol. Used = added − left over.',unit:'mol',target:nR,rel:0.01,hint:'0.02500 − your total left over'},
    {id:'b_nC',f:'÷ 2',why:'CaCO₃ + 2HCl: every CaCO₃ uses up two HCl, so there were half as many CaCO₃.',q:'Moles of CaCO₃',sub:'CaCO₃ + 2HCl → … (1 : 2)',unit:'mol',target:nC,rel:0.01,hint:'Halve the moles of HCl used.'},
    {id:'b_mg',f:'mg CaCO₃',why:'The label is in milligrams. Mass = moles × molar mass (100.09 g/mol), then × 1000 for mg.',q:'Mass of CaCO₃',sub:'m = n × M   (M = 100.09 g/mol), × 1000 for mg',unit:'mg',target:mg,rel:0.01,hint:'moles × 100.09 × 1000'},
    {id:'b_pc',f:'% of label',why:'Comparing with the label shows whether the claim holds up: (found ÷ claimed) × 100.',q:'% of the label claim',sub:'Label: 500 mg',unit:'%',target:pct,rel:0.01,hint:'(your mg ÷ 500) × 100'}].concat(uncSteps('bu_',m,25.00,null,null));}
function finishBack(){const c=concordant(),m=meanOf(c),nN=0.1*m/1000,nEx=nN*10,nR=0.025-nEx,nC=nR/2,mg=nC*100.09*1000;
  const uEx=nEx*(0.10/m+0.03/25+0.15/250),uAdd=0.025*(0.05/50),uR=uEx+uAdd,umg=mg*(uR/nR);
  S.bmg=mg;
  const html=titrationReport({title:'Back titration: CaCO₃ in an antacid tablet',aim:'To determine the mass of calcium carbonate in an antacid tablet by back titration, and compare it with the label claim of 500 mg.',
    method:['Crushed one tablet and added 50.00 mL of 0.5000 mol/L HCl (excess). Swirled until fizzing stopped.','Transferred to a 250.0 mL volumetric flask with rinsings, made up to the mark and mixed.','Titrated 25.00 mL aliquots with 0.1000 mol/L NaOH using phenolphthalein, until two titres agreed within 0.10 mL.'],
    eq:'CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂<br>HCl + NaOH → NaCl + H₂O',runs:S.runs,graph:titrCurveFig(m,'phenolphthalein','This is the leftover HCl in a 25.00 mL aliquot being neutralised by NaOH.'),
    calc:[`Average titre = ${m.toFixed(2)} mL`,`n(NaOH) = 0.1000 × ${(m/1000).toFixed(5)} = ${sci(nN)} mol = n(HCl) left in 25.00 mL`,`n(HCl) left in 250.0 mL = 10 × ${sci(nN)} = ${sci(nEx)} mol`,`n(HCl) added = 0.5000 × 0.05000 = 2.500 × 10⁻² mol`,`n(HCl) used = 2.500 × 10⁻² − ${sci(nEx)} = ${sci(nR)} mol`,`n(CaCO₃) = ½ × ${sci(nR)} = ${sci(nC)} mol`,`m(CaCO₃) = ${sci(nC)} × 100.09 = ${(mg/1000).toFixed(4)} g = ${mg.toFixed(0)} mg`,
      `Uncertainty: n(HCl) left ± ${sci(uEx,2)} mol (titre, pipette, flask); n(HCl) added ± ${sci(uAdd,2)} mol (50 mL pipette ±0.05 mL). Subtracting adds absolute uncertainties: ± ${sci(uR,2)} mol → m(CaCO₃) ± ${umg.toFixed(0)} mg`],
    result:`The tablet contained <b>${mg.toFixed(0)} ± ${umg.toFixed(0)} mg</b> of CaCO₃, ${(mg/5).toFixed(1)}% of the label claim.`,

/* ================= module: Soda vs Teeth ================= */
const SODAS=[{name:'Sprite',c:'teal',lo:1.6,hi:2.0,col:'rgba(220,240,228,.55)'},{name:'Mountain Dew',c:'yellow',lo:2.0,hi:2.5,col:'rgba(214,232,70,.6)'},{name:'Lemonade',c:'pink',lo:2.6,hi:3.2,col:'rgba(246,244,226,.6)'}];
const M_CIT=192.12;
QUIZ.ta=[{t:'Drink A, because saliva has to neutralise twice as much acid before the mouth gets back above pH 5.5',ok:true,fb:'Yes. pH is how acidic it is right now. Titratable acidity is the size of the acid "reservoir" your saliva has to fight.'},{t:'They\'re equally bad, because the pH is the same',ok:false,fb:'pH alone doesn\'t tell the whole story. How much acid is there matters too.'},{t:'Drink B, because it has less acid to wash away',ok:false,fb:'Less acid means less for saliva to neutralise, so B is gentler.'}];
QUIZ.tri=[{t:'1',ok:false,fb:'Count the acidic H atoms on citric acid: there are three.'},{t:'3',ok:true,fb:'Yes. Citric acid is triprotic: H₃C₆H₅O₇ + 3NaOH → Na₃C₆H₅O₇ + 3H₂O. So n(citric acid) = n(NaOH) ÷ 3.'},{t:'⅓',ok:false,fb:'Other way round: each citric acid needs MORE NaOH, not less.'}];
QUIZ.co2=[{t:'Dissolved CO₂ forms carbonic acid, which would also react with the NaOH and make the titre too high',ok:true,fb:'Yes. We only want to measure the citric acid, so the CO₂ has to go first.'},{t:'Bubbles make the soda overflow',ok:false,fb:'Annoying, but not the real reason. Think about what CO₂ does in water.'},{t:'CO₂ stops the indicator working',ok:false,fb:'Not quite. CO₂ in water is an acid. What would that do to the titre?'}];
QUIZ.erode=[{t:'Lemonade, because its higher titratable acidity keeps the mouth below pH 5.5 for longer',ok:true,fb:'Yes. More acid in reserve = more work for saliva = more time for enamel to dissolve.'},{t:'They\'re the same, because their pH is similar',ok:false,fb:'Similar pH, but different amounts of acid. Look at the titratable acidity.'},{t:'Sprite, because it\'s clear',ok:false,fb:'Colour has nothing to do with it. Compare the titratable acidity.'}];
QUIZ.small=[{t:'Use a bigger soda sample (e.g. 25.00 mL) or 0.0500 mol/L NaOH, so the titre is bigger',ok:true,fb:'Yes. ±0.10 mL is a much smaller percentage of a 7 mL titre than a 3 mL one. A 10 mL burette or a drop counter also helps.'},{t:'Read the burette faster',ok:false,fb:'Speed doesn\'t shrink the ±0.05 mL reading uncertainty.'},{t:'Add more phenolphthalein',ok:false,fb:'More indicator doesn\'t change the titre size, and indicators are weak acids themselves.'}];
function v55(r){const p=r.pts.filter(x=>x[1]!=null); for(let i=1;i<p.length;i++){if(p[i][1]>=5.5&&p[i-1][1]<5.5){const [x0,y0]=p[i-1],[x1,y1]=p[i]; return x0+(5.5-y0)*(x1-x0)/(y1-y0);}} return null;}
function setSoda(j){S.j=j; S.runSet='s'+j; S.Ca=S.sodas[j].ta/M_CIT; S.cit=0.12*S.Ca; S.sodaCol=SODAS[j].col; S.rated={}; S.co2=1;}
function prepSoda(j){setSoda(j); benchPos(); S.runs=[]; S.cur=-1; S.R=null; S.setup.aliquot=true; S.setup.indAdded=false; S.vprep=0; S.anim.fill=performance.now();}
function sCalc1(){const m=S.sres[0].mean,nN=0.1*m/1000,nC=nN/3,c=nC/0.01000,ta=c*M_CIT;
  return [{id:'s_mean',f:'Average titre',q:'Average titre',sub:`Concordant titres: ${concordantOf(S.sres[0].runs).map(r=>titre(r).toFixed(2)).join(', ')} mL`,unit:'mL',target:m,abs:0.011,hint:'Add them, divide by how many.',why:'Concordant titres agree, so their average is the best value. The rough run is left out.'},
    {id:'s_nN',f:'mol NaOH',q:'Moles of NaOH',sub:'n = c × V   (0.1000 mol/L, V in L)',unit:'mol',target:nN,rel:0.01,hint:'0.1000 × (average ÷ 1000)',why:'We know the concentration and volume of NaOH, so c × V counts the moles that reacted.'},
    {id:'s_nC',f:'÷ 3 (triprotic)',q:'Moles of citric acid',sub:'H₃C₆H₅O₇ + 3NaOH → Na₃C₆H₅O₇ + 3H₂O',unit:'mol',target:nC,rel:0.01,hint:'Divide by 3.',why:'Citric acid has THREE acidic H atoms. Phenolphthalein only turns pink once all three have reacted, so each citric acid used 3 NaOH. Forget this and your answer is 3 times too big.'},
    {id:'s_c',f:'mol/L',q:'Concentration of citric acid',sub:'c = n ÷ V   (10.00 mL soda = 0.01000 L)',unit:'mol/L',target:c,rel:0.01,hint:'moles ÷ 0.01000',why:'All the acid came from the 10.00 mL of soda. The 20 mL of water added spreads it out but doesn\'t change the moles, so divide by 0.01000 L only.'},
    {id:'s_ta',f:'g/L',q:'Titratable acidity (g/L as citric acid)',sub:'mass concentration = c × M   (M = 192.12 g/mol)',unit:'g/L',target:ta,rel:0.01,hint:'mol/L × 192.12',why:'Food labs report titratable acidity in grams of citric acid per litre, so drinks can be compared.'}
  ].concat(uncSteps('su_',m,10.00,null,ta,'g/L',0.02));}
function sCalc23(){return [1,2].map(j=>({id:'s_j'+j,f:SODAS[j].name,q:`${SODAS[j].name}: titratable acidity`,sub:`Average titre ${S.sres[j].mean.toFixed(2)} mL`,unit:'g/L',target:0.1*S.sres[j].mean/1000/3/0.01*M_CIT,rel:0.01,hint:`0.1000 × (${S.sres[j].mean.toFixed(2)} ÷ 1000) ÷ 3 ÷ 0.01000 × 192.12`,why:'Same chain as soda 1: titre → mol NaOH → ÷ 3 → ÷ 0.01000 L → × 192.12.'}));}
const taOf=m=>0.1*m/1000/3/0.01*M_CIT;

const SODA_COL=['--teal','--orange','--pink'],SODA_HEX=['#008f79','#d86b00','#d61f73'];
function sodaFigs(ta,pct){const ser=[],marks=[]; let xm=0;
  S.sres.forEach((r,i)=>{const c=concordantOf(r.runs),run=(c.length?c[c.length-1]:r.runs[r.runs.length-1]); if(!run||!run.pts) return; const pts=run.pts.filter(p=>p[1]!=null); if(!pts.length) return;
    xm=Math.max(xm,pts[pts.length-1][0]); ser.push({pts,color:SODA_COL[i],width:2.5}); if(r.v55!=null) marks.push({x:r.v55,y:5.5,color:SODA_COL[i]});});
  xm=Math.max(4,Math.ceil(xm+0.5));
  const curve=ser.length?chartImg({xmax:xm,xstep:1,ymin:2,ymax:12,ystep:2,ylab:'pH',xlab:'mL NaOH added',series:ser,marks,hlines:[{y:5.5,color:'--red',label:'pH 5.5: enamel starts to dissolve below this'}],legend:SODAS.map((J,i)=>({label:J.name,color:SODA_COL[i]}))},
    'pH logged during one concordant run of each soda (10.00 mL soda). Dots: volume of NaOH needed to lift the soda above the critical pH 5.5. The steep rise near the end is where all three H⁺ of citric acid have reacted.'):'';
  return curve+barsHTML(SODAS.map((J,i)=>({label:J.name,v:ta[i],txt:ta[i].toFixed(2)+' ± '+(ta[i]*pct[i]/100).toFixed(2),color:SODA_HEX[i]})),'g/L','Titratable acidity (g/L as citric acid). A longer bar means more acid for saliva to neutralise.');}
function finishSoda(){

  const html=reportShell('Titratable acidity of citric acid sodas','To compare the titratable acidity of three citric acid–based soft drinks by titration with 0.1000 mol/L NaOH, and relate it to the risk of dental erosion.',
   `<h4>Hypothesis</h4><p>If ${SODAS[S.pred].name} contains the most citric acid, then it will need the largest volume of NaOH and have the highest titratable acidity.</p>
    <h4>Method</h4><ul><li>Each soda was degassed by stirring until it stopped fizzing.</li><li>10.00 mL was pipetted into a conical flask with about 20 mL distilled water and 3 drops of phenolphthalein. A pH probe logged pH throughout.</li><li>Titrated with 0.1000 mol/L NaOH: rough run, then accurate runs until two titres agreed within 0.10 mL.</li><li>The volume to reach pH 5.5 was read from the pH data for each concordant run.</li></ul>
    <h4>Equation</h4><p class="mono">H₃C₆H₅O₇ + 3NaOH → Na₃C₆H₅O₇ + 3H₂O</p><p>Citric acid is triprotic (pKa 3.13, 4.76, 6.40). The pKa values are close, so there is one end point (phenolphthalein, about pH 8.3) after all three H⁺ have reacted: n(citric acid) = n(NaOH) ÷ 3.</p>
    <h4>Results</h4>${SODAS.map((J,i)=>`<p><b>${J.name}</b></p>${tableRuns(S.sres[i].runs,concordantOf(S.sres[i].runs))}`).join('')}
    <div class="tw"><table><thead><tr><th>Soda</th><th class="num">Start pH</th><th class="num">Avg titre (mL)</th><th class="num">V to pH 5.5 (mL)</th><th class="num">TA (g/L)</th><th class="num">± (g/L)</th></tr></thead><tbody>${SODAS.map((J,i)=>`<tr><td>${J.name}</td><td class="num mono">${S.sres[i].ph0.toFixed(2)}</td><td class="num mono">${S.sres[i].mean.toFixed(2)}</td><td class="num mono">${S.sres[i].v55!=null?S.sres[i].v55.toFixed(2):'–'}</td><td class="num mono">${ta[i].toFixed(2)}</td><td class="num mono">${(ta[i]*pct[i]/100).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>${sodaFigs(ta,pct)}
    <h4>Sample calculation (${SODAS[0].name})</h4><div class="work">n(NaOH) = 0.1000 × ${(m/1000).toFixed(5)} = ${sci(nN)} mol<br>n(citric acid) = ${sci(nN)} ÷ 3 = ${sci(nN/3)} mol   (triprotic)<br>c = ${sci(nN/3)} ÷ 0.01000 = ${(nN/3/0.01).toFixed(5)} mol/L<br>TA = ${(nN/3/0.01).toFixed(5)} × 192.12 = ${ta[0].toFixed(2)} g/L as citric acid<br>Instrumental % uncertainty = (0.10 ÷ ${m.toFixed(2)} + 0.02 ÷ 10.00) × 100 = ${pct[0].toFixed(1)} %</div>
    <h4>Conclusion</h4><p>${SODAS[top].name} had the highest titratable acidity (${ta[top].toFixed(2)} g/L) and ${SODAS[low].name} the lowest (${ta[low].toFixed(2)} g/L). The hypothesis is ${top===S.pred?'supported':'not supported'}. A higher titratable acidity means more acid for saliva to neutralise before the mouth rises above the critical pH of about 5.5, so the enamel is exposed to dissolving conditions for longer.</p>
    <h4>Evaluation</h4><ul><li>The titres are small (about ${m.toFixed(1)} mL), so the instrumental uncertainty is about ${pct[0].toFixed(0)}%. Using 25.00 mL of soda, 0.0500 mol/L NaOH, a 10 mL burette or a drop counter would reduce this.</li><li>Any CO₂ left after degassing would react with NaOH and make the results too high (systematic error).</li><li>Sodas also contain sodium citrate, which is citrate that has already lost its H⁺. Titratable acidity is reported "as citric acid", not as total citrate.</li><li>pH and titratable acidity don't fully predict erosion: calcium content, chelation by citrate, sipping habits and saliva also matter.</li><li>Values in this simulation are illustrative. Real brands differ by country and recipe, so measure your own.</li></ul>`);
  S.report=html; saveReport('soda','Soda vs teeth',html); PROG.soda.done=true; S.finished=true; delete RESUME.soda; save(true); badge('soda'); confetti();
}

QUIZ.vsee=[{t:'Yes, clearly',ok:false,fb:'Look again: the brown hides the faint pink almost completely. That\'s the problem.'},{t:'Not really. The brown hides it',ok:true,fb:'Exactly. Dark vinegar hides the indicator, so we need a method that doesn\'t rely on colour: conductivity.'}];
QUIZ.vdil=[{t:'Multiply by 10',ok:true,fb:'Yes. 10.00 mL made up to 100.0 mL is a 1 in 10 dilution, so the original is 10 times as concentrated.'},{t:'Divide by 10',ok:false,fb:'Other way: the original vinegar is stronger than the diluted one.'},{t:'Nothing, the moles are the same',ok:false,fb:'The moles in the 10.00 mL are the same, but you titrate only part of the diluted solution. Scale back up.'}];
QUIZ.vrel=[{t:'Conductivity: it doesn\'t need to see a colour, and the end point comes from many points on two straight lines',ok:true,fb:'Yes. The pH end point is a good check, but for dark samples conductivity is the method of choice.'},{t:'Phenolphthalein, because it\'s the usual indicator',ok:false,fb:'In brown malt vinegar you can barely see the pink, so it\'s unreliable here.'},{t:'They can\'t be compared',ok:false,fb:'They can: both find the same equivalence volume, so they should agree.'}];
function vinX(){return Math.floor(vb()/S.trueDrop)*S.dropV;}
function logDrops(){const r=run(); if(!r||!S.logging) return; const dr=Math.floor(vb()/S.trueDrop); while(S.lastDrop<dr){S.lastDrop++; const v=S.lastDrop*S.trueDrop,x=+(S.lastDrop*S.dropV).toFixed(3); r.rec.push([x,+(kappa(v)*(1+rand(-0.003,0.003))).toFixed(3)]); (r.phrec=r.phrec||[]).push([x,+pHat(v).toFixed(3)]);}}
const vVeqX=()=>veq()*S.dropV/S.trueDrop;
function vinCalc(){const V=S.fit.x,nN=0.1*V/1000,cD=nN/0.025,cO=cD*10,pw=cO*60.05/10,pct=(0.10/S.calV+0.03/25+0.02/10+0.10/100)*100;
  return [{id:'vn_n',f:'mol NaOH',q:'Moles of NaOH',sub:`Equivalence volume from your conductivity graph: ${V.toFixed(2)} mL. n = c × V (0.1000 mol/L)`,unit:'mol',target:nN,rel:0.01,hint:'0.1000 × (V ÷ 1000)',why:'At the corner of the graph the NaOH has exactly reacted with the acid. c × V counts the moles added.'},
    {id:'vn_d',f:'[diluted]',q:'Concentration of the diluted vinegar',sub:'CH₃COOH + NaOH (1 : 1). The sample was 25.00 mL of diluted vinegar.',unit:'mol/L',target:cD,rel:0.01,hint:'moles ÷ 0.02500',why:'1 : 1 means moles of acid = moles of NaOH. Those moles were in 25.00 mL of the DILUTED vinegar (the 75 mL of water only covers the probe).'},
    {id:'vn_o',f:'× 10',q:'Concentration of the original vinegar',sub:'10.00 mL was made up to 100.0 mL',unit:'mol/L',target:cO,rel:0.01,hint:'Multiply by 10.',why:'We diluted 1 in 10, so the vinegar from the bottle is 10 times more concentrated.'},
    {id:'vn_p',f:'% w/v',q:'Acidity as % w/v (g per 100 mL)',sub:'g/L = mol/L × 60.05 g/mol, then ÷ 10 for g per 100 mL',unit:'%',target:pw,rel:0.01,hint:'mol/L × 60.05 ÷ 10',why:'Vinegar labels show acidity as % (grams of ethanoic acid per 100 mL), so this lets you check the label.'},
    {id:'vn_u',unc:true,f:'± %',q:'Instrumental % uncertainty',sub:`Add the % uncertainties: drop-counter calibration ±0.10 mL out of ${S.calV.toFixed(2)} mL, 25 mL pipette ±0.03, 10 mL pipette ±0.02, 100 mL flask ±0.10.`,unit:'%',target:pct,abs:0.06,hint:`(0.10 ÷ ${S.calV.toFixed(2)} + 0.03 ÷ 25.00 + 0.02 ÷ 10.00 + 0.10 ÷ 100.0) × 100`,why:'The drop counter turns drops into mL using your calibration, so the calibration\'s uncertainty carries into every volume. This is instrumental uncertainty only.'}];}

   bind:()=>{bindReading(); const h=$('calRun'); if(h) holdButton(h,dt=>{add(1.0*dt,false); const e=$('dcount'); if(e) e.textContent=Math.floor(vb()/S.trueDrop); const s=$('calStop'); if(s) s.disabled=vb()<2;},()=>{S.pouring=true;},()=>{S.pouring=false; renderScene();});
     const st=$('calStop'); if(st) st.addEventListener('click',()=>{const r=run(); r.final=S.R; r.state='readFinal'; S.readMsg=null; S.lastRaw=''; S.readTries=0; renderAll();});

  {id:'vn_fit',w:3,solo:true,title:'Find the corner',strip:true,

function finishVin(){

   `<h4>Method</h4><ul><li>10.00 mL of malt vinegar was diluted to 100.0 mL in a volumetric flask (1 in 10).</li><li>The drop counter was calibrated by running NaOH from the burette: ${S.calV.toFixed(2)} mL gave ${S.calDrops} drops, so 1 drop = ${S.dropV.toFixed(4)} mL.</li><li>25.00 mL of diluted vinegar plus about 75 mL water was stirred with conductivity and pH probes in place.</li><li>0.1000 mol/L NaOH was added through the drop counter, logging conductivity and pH for every drop.</li><li>Lines of best fit either side of the turn on the conductivity graph gave the equivalence volume.</li></ul>
    <h4>Equation</h4><p class="mono">CH₃COOH + NaOH → CH₃COONa + H₂O</p>
    <h4>Results</h4><div class="tw"><table><thead><tr><th>Measurement</th><th class="num">Value</th></tr></thead><tbody><tr><td>Drop volume (calibration)</td><td class="num mono">${S.dropV.toFixed(4)} mL</td></tr><tr><td>Equivalence volume (conductivity)</td><td class="num mono">${V.toFixed(2)} mL</td></tr><tr><td>Equivalence volume (pH curve)</td><td class="num mono">${S.vPh.toFixed(2)} mL</td></tr><tr><td>Points logged</td><td class="num mono">${run().rec.length}</td></tr></tbody></table></div>${vinFigs()}
    <h4>Calculations</h4><div class="work">n(NaOH) = 0.1000 × ${(V/1000).toFixed(5)} = ${sci(nN)} mol = n(CH₃COOH) in 25.00 mL<br>c(diluted) = ${sci(nN)} ÷ 0.02500 = ${cD.toFixed(4)} mol/L<br>c(original) = 10 × ${cD.toFixed(4)} = ${cO.toFixed(3)} mol/L<br>acidity = ${cO.toFixed(3)} × 60.05 ÷ 10 = ${pw.toFixed(2)} g per 100 mL (% w/v)<br>Instrumental % uncertainty = (0.10 ÷ ${S.calV.toFixed(2)} + 0.03 ÷ 25.00 + 0.02 ÷ 10.00 + 0.10 ÷ 100.0) × 100 = ${pct.toFixed(2)} %  →  ± ${(pw*pct/100).toFixed(2)} %</div>
    <h4>Result</h4><p>The malt vinegar contained <b>${pw.toFixed(2)} ± ${(pw*pct/100).toFixed(2)} % w/v</b> ethanoic acid (label: 4%). The accepted value for this sample was ${(S.Ca*10*60.05/10).toFixed(2)}%.</p>
    <h4>Evaluation</h4><ul><li>The conductivity and pH end points agreed to within ${Math.abs(V-S.vPh).toFixed(2)} mL, so the method is consistent.</li><li>Phenolphthalein would be unreliable here: the brown colour hides the pink.</li><li>Every volume depends on the drop calibration. Your drop volume was ${Math.abs(dropErr).toFixed(1)}% ${dropErr>=0?'larger':'smaller'} than the true value, which shifts every volume by the same proportion (a systematic error). Calibrating with a larger volume reduces this.</li><li>Drop size can change if the tap setting changes during the run, so keep the flow rate steady.</li><li>The early points curve because ethanoic acid is weak; only the straight parts should be used for the lines of best fit.</li></ul>`);
  S.report=html; saveReport('vin','Conductivity Real Lab · vinegar',html); PROG.vin.done=true; S.finished=true; delete RESUME.vin; save(true); badge('vin'); confetti();

const pKaOf=k=>+((IND[k].lo+IND[k].hi)/2).toFixed(1);
const fracB=(pH,pKa)=>1/(1+Math.pow(10,pKa-pH));
const solidRGB=c=>{const a=Math.min(1,c[3]*1.3); return c.slice(0,3).map(v=>v*a+255*(1-a));};
const mixRGB=(a,b,f)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*f)).join(',')})`;
function indRGB(k,pH){const I=IND[k]; return mixRGB(solidRGB(I.acid),solidRGB(I.base),fracB(pH,pKaOf(k)));}
const BOH_COL={acid:[214,50,38,.8],base:[242,186,36,.8]};
function withKey(k,fn){const ok=S.key,oc=S.Ca; setKey(k); try{return fn();}finally{S.key=ok; S.Ca=oc;}}
function endV(pKa){const f=v=>pHat(v)-pKa,a=f(0),b=f(50); if(a*b>0) return null; let lo=0,hi=50; for(let i=0;i<50;i++){const m=(lo+hi)/2; if(f(m)*a>0) lo=m; else hi=m;} return (lo+hi)/2;}

function dotsHTML(id,f,ca,cb){const n=Math.round(20*f); return `<div class="idots" id="${id}">${ORDER20.map((o,i)=>`<i style="background:${o<n?cb:ca}"></i>`).join('')}</div>`;}
function paintDots(id,f,ca,cb){const el=$(id); if(!el) return; const n=Math.round(20*f); [...el.children].forEach((d,i)=>{d.style.background=ORDER20[i]<n?cb:ca;});}
function sbarHTML(id,f,ca,cb,la,lb){return `<div class="sbar" id="${id}"><span style="width:${(100-100*f).toFixed(1)}%;background:${ca}">${la} ${Math.round(100-100*f)}%</span><span style="width:${(100*f).toFixed(1)}%;background:${cb}">${lb} ${Math.round(100*f)}%</span></div>`;}
function paintBar(id,f,la,lb){const el=$(id); if(!el) return; const [a,b]=el.children; a.style.width=(100-100*f).toFixed(1)+'%'; b.style.width=(100*f).toFixed(1)+'%'; a.textContent=`${la} ${Math.round(100-100*f)}%`; b.textContent=`${lb} ${Math.round(100*f)}%`;}

QUIZ.iwhat=[{t:'The indicator gains or loses an H⁺, and its two forms are different colours',ok:true,fb:'Exactly. HIn and In⁻ are a conjugate acid–base pair with different colours.'},{t:'The dye gets destroyed by the acid',ok:false,fb:'Nope. Add base again and the colour comes back, so nothing is destroyed. It\'s reversible.'},{t:'The water changes colour',ok:false,fb:'Water is colourless at every pH. It\'s the indicator molecules that change.'}];
QUIZ.ishift=[{t:'More B⁺: shifts right',ok:true,fb:'Yes. H⁺ reacts with OH⁻ to make water, removing OH⁻. The equilibrium shifts right to replace it, making more B⁺.'},{t:'More BOH: shifts left',ok:false,fb:'Think about what H⁺ does to OH⁻. It removes it, so the system shifts to make more OH⁻.'},{t:'No change',ok:false,fb:'Removing a product always shifts an equilibrium. Which product does H⁺ remove?'}];
QUIZ.ipka=[{t:'pH 9.3',ok:true,fb:'Yes. Half changed means [HIn] = [In⁻], and that happens when pH = pKa.'},{t:'pH 7',ok:false,fb:'pH 7 is only the middle for an indicator with pKa 7. Which pH equals this pKa?'},{t:'pH 4.7',ok:false,fb:'That\'s 14 − 9.3. You don\'t need to subtract here: halfway is where pH = pKa.'}];
QUIZ.irange=[{t:'pH 4.3 to 6.3',ok:true,fb:'Yes. pKa ± 1 = 5.3 ± 1.'},{t:'pH 5.3 to 7.3',ok:false,fb:'The range is centred on the pKa, so it goes 1 below and 1 above.'},{t:'pH 3.3 to 5.3',ok:false,fb:'The range is centred on the pKa, so it goes 1 below and 1 above.'}];
QUIZ.iend=[{t:'Close to the pH at the equivalence point',ok:true,fb:'Yes. The indicator changes at pH ≈ pKa. If that pH is reached at the equivalence point, the end point and equivalence point match.'},{t:'Always 7',ok:false,fb:'Only strong + strong titrations have equivalence at pH 7. Look at where this curve\'s jump is.'},{t:'As low as possible',ok:false,fb:'Look at methyl orange on this graph: it changed way too early.'}];
const ITRY=['bromothymol','methylred','phenolphthalein'];

function xQuiz(){const pk=-Math.log10(S.xKa),T=[['c_wasb','Ethanoic acid + NaOH (equivalence pH 8.7)'],['cb_wbsa','Ammonia + HCl (equivalence pH 5.3)'],['c_sasb','HCl + NaOH (equivalence pH 7.0)']];
  QUIZ.ixuse=T.map(([k,t])=>{const e=k==='c_wasb'?8.7:k==='cb_wbsa'?5.3:7.0,inr=e>=pk-1&&e<=pk+1; return {t,ok:k===S.xBest,fb:k===S.xBest?`Yes. Its range (${(pk-1).toFixed(1)}–${(pk+1).toFixed(1)}) contains the equivalence pH ${e.toFixed(1)}, so it changes colour right at equivalence.`:`pH ${e.toFixed(1)} is ${inr?'inside':e<pk-1?'below':'above'} the range ${(pk-1).toFixed(1)}–${(pk+1).toFixed(1)}. ${inr?'':'It would change colour at the wrong time.'}`};});}
function xCalc(){const ka=S.xKa,pk=-Math.log10(ka),kt=ka.toExponential(1).replace('e',' EXP ').replace('+','');
  return [{id:'x_pk',f:'pKa',q:'pKa of indicator X',sub:`pKa = −log(Ka)   Ka = ${sci(ka,1)}`,unit:'',target:pk,abs:0.05,hint:`Calculator: − log( ${kt} ) =`,why:'pKa puts Ka on the pH scale. It is the pH where the indicator is half one colour, half the other: the middle of its colour change.'},
    {id:'x_lo',f:'pKa − 1',q:'Bottom of the colour-change range',sub:'range ≈ pKa ± 1',unit:'pH',target:pk-1,abs:0.06,hint:'Your pKa minus 1.',why:'At pH = pKa − 1 there is 10 times more HIn than In⁻. Below that, your eye only sees the acid colour.'},
    {id:'x_hi',f:'pKa + 1',q:'Top of the colour-change range',sub:'range ≈ pKa ± 1',unit:'pH',target:pk+1,abs:0.06,hint:'Your pKa plus 1.',why:'At pH = pKa + 1 there is 10 times more In⁻ than HIn. Above that, you only see the base colour.'}];}
function roundVerdict(k){return withKey(k,()=>{const ve=veq(),e=pHat(ve),a=pHat(ve-0.1),b=pHat(ve+0.1),lo=Math.min(a,b),hi=Math.max(a,b),v={};
  Object.entries(IND).forEach(([x,I])=>{const pk=pKaOf(x); v[x]=(I.lo<=e&&e<=I.hi)?'yes':(pk>=lo&&pk<=hi)?'ok':'no';}); return {v,e,lo,hi,ve};});}
function roundReason(x,vd){const I=IND[x],r=vd.v[x];
  if(r==='yes') return `Range ${I.lo}–${I.hi} contains the equivalence pH (${vd.e.toFixed(1)}). Best choice. ✓`;
  if(r==='ok') return `Range ${I.lo}–${I.hi} misses ${vd.e.toFixed(1)}, but its pKa (${pKaOf(x)}) is still inside the steep jump, so it changes within a drop or two. Acceptable.`;
  return `Changes around pH ${pKaOf(x)}, ${pKaOf(x)<vd.lo?'below':'above'} the steep jump (pH ${vd.lo.toFixed(1)}–${vd.hi.toFixed(1)}). It would change colour at the wrong time, so the end point would miss the equivalence point.`;}
function dataTable(k){const rows=withKey(k,()=>DVOLS.map(v=>[v,pHat(v)])),h=9,t=r=>`<table><thead><tr><th class="num">V (mL)</th><th class="num">pH</th></tr></thead><tbody>${r.map(([v,p])=>`<tr><td class="num mono">${v.toFixed(2)}</td><td class="num mono">${p.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="dtab"><div class="tw">${t(rows.slice(0,h))}</div><div class="tw">${t(rows.slice(h))}</div></div>`;}
function speciesPts(pk){const a=[]; for(let p=0;p<=14.001;p+=0.1) a.push([+p.toFixed(1),100*fracB(p,pk)]); return a;}

  const html=reportShell('Indicator Lab: how acid–base indicators work','To explain how acid–base indicators change colour, relate their pH range and pKa to the end point, and choose a suitable indicator for a titration from data.',
   `<h4>Theory</h4><p>An acid–base indicator is a weak acid or weak base whose conjugate acid–base pair have different colours:</p>
    <p class="mono">HIn(aq) ⇌ H⁺(aq) + In⁻(aq)<br>BOH(aq) ⇌ B⁺(aq) + OH⁻(aq)</p>

    <h4>End point vs equivalence point (ethanoic acid + NaOH)</h4><div class="tw"><table><thead><tr><th>Indicator</th><th class="num">pKa</th><th class="num">End point (mL)</th><th class="num">Equivalence (mL)</th><th class="num">Difference (mL)</th></tr></thead><tbody>${ep.rows.map(r=>`<tr><td>${IND[r.x].name}</td><td class="num mono">${pKaOf(r.x)}</td><td class="num mono">${r.V==null?'–':r.V.toFixed(2)}</td><td class="num mono">${ep.ve.toFixed(2)}</td><td class="num mono">${r.V==null?'–':(r.V-ep.ve>=0?'+':'')+(r.V-ep.ve).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>
    ${epFig}
    <h4>Data analysis: choosing indicators</h4><div class="tw"><table><thead><tr><th>Titration</th><th class="num">V equiv. (mL)</th><th class="num">pH equiv.</th><th>You chose</th><th>Range contains equiv. pH</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${rFig}
    <h4>Conclusion</h4><ul><li>Indicators are weak acids (HIn) or weak bases (BOH) whose conjugate pair have different colours. Changing [H⁺] shifts the equilibrium, changing the colour.</li><li>An indicator is half-changed when pH = pKa, and changes over about pKa ± 1.</li><li>The end point is when the indicator changes colour; the equivalence point is when the reactants have exactly reacted. They match only if the indicator's pKa is close to the equivalence pH, so its range sits in the steep jump.</li><li>Strong acid + strong base: equivalence pH 7 (bromothymol blue, phenol red; most others also change within the large jump). Weak acid + strong base: above 7 (phenolphthalein). Strong acid + weak base: below 7 (methyl red, bromocresol green).</li></ul>
    <h4>Evaluation</h4><ul><li>The pKa ± 1 rule is a model. Data-book ranges are not exactly 2 pH units wide, because our eyes notice some colours more easily than others.</li><li>Indicators are weak acids themselves, so only 2–3 drops are added; more would react with the titrant and shift the end point.</li></ul>`);
  S.report=html; saveReport('ind','Indicator Lab',html); PROG.ind.done=true; S.finished=true; delete RESUME.ind; save(true); badge('indy'); confetti();
}
