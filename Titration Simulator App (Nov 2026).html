/* ================= shared skill widgets (for drill modules) ================= */
const WDEF={};
const wst=(id,init)=>{S.w=S.w||{}; return S.w[id]||(S.w[id]=Object.assign({tries:0,ok:false},init||{}));};
function wDone(id,ok){const st=wst(id); st.tries++; if(ok&&!st.ok){st.ok=true; right(st.tries===1?15:5,'nailed it');} else if(!ok) wrong();}
const wOk=id=>!!(S.w&&S.w[id]&&S.w[id].ok);

/* sorter: each item gets one bin */
function sorter(id,prompt,bins,items){WDEF[id]={type:'sort',bins,items}; const st=wst(id,{a:{}}),all=items.every((_,i)=>st.a[i]!=null);
  return `${prompt?doLine('Sort',prompt):''}<div class="sorter">${items.map((it,i)=>{const a=st.a[i],cls=st.checked?(a===it.b?'good':'bad'):'';
    return `<div class="srow ${cls}"><span class="sitem">${it.t}</span><div class="sbins">${bins.map((b,j)=>`<button type="button" class="sbin" data-sw="${id}" data-i="${i}" data-j="${j}" aria-pressed="${a===j}" ${st.ok?'disabled':''}>${b}</button>`).join('')}</div>${cls==='bad'&&it.why?`<small class="sfb">${it.why}</small>`:''}</div>`;}).join('')}</div>
  ${st.ok?'<p class="toastline good">All correct.</p>':`<div class="row"><button class="btn go" type="button" data-swchk="${id}" ${all?'':'disabled'}>Check</button>${st.checked?'<span class="muted" style="font-weight:700;font-size:.85rem">Fix the red ones, then check again.</span>':''}</div>`}`;}

/* role tapper: tap the acid, base, conjugate base, conjugate acid */
const ROLE={A:['acid','gives away H⁺'],B:['base','takes H⁺'],CB:['conjugate base','the acid, minus one H⁺'],CA:['conjugate acid','the base, plus one H⁺']};
const ROLEHINT={A:'The acid is on the LEFT. It is the one that loses an H⁺.',B:'The base is on the LEFT. It is the one that gains an H⁺.',CB:'Look on the RIGHT for the acid with one H⁺ fewer.',CA:'Look on the RIGHT for the base with one H⁺ more.'};
function roles(id,eq,seq){WDEF[id]={type:'roles',eq,seq}; const st=wst(id,{k:0,got:{},miss:0,msg:null}),done=st.k>=seq.length,sp=eq.l.concat(eq.r);
  const chip=(s,i)=>{const r=st.got[i]; return `<button type="button" class="rchip ${r?'r-'+r:''}" data-rw="${id}" data-i="${i}" ${done?'disabled':''}><span>${s.t}</span>${r?`<small>${ROLE[r][0]}</small>`:''}</button>`;};
  const L=eq.l.map((s,i)=>chip(s,i)).join('<span class="plus">+</span>'),R=eq.r.map((s,i)=>chip(s,i+eq.l.length)).join('<span class="plus">+</span>');
  const f=r=>(sp.find(s=>s.r===r)||{}).t;
  return `<div class="rolebox"><div class="req">${L}<span class="rarrow">${eq.arrow}</span>${R}</div>
    ${done?`<p class="toastline good">${seq.length>2?`Pairs: <b>${f('A')} / ${f('CB')}</b> and <b>${f('B')} / ${f('CA')}</b>. Each pair differs by one H⁺.`:`${f('A')} gave an H⁺ to ${f('B')}.`}</p>`
      :`<div class="rask">Tap the <b class="rtag r-${seq[st.k]}">${ROLE[seq[st.k]][0]}</b><small>${ROLE[seq[st.k]][1]}</small></div>`}
    ${st.msg&&!done?`<p class="toastline bad">${st.msg}</p>`:''}</div>`;}

/* proton machine: add or remove H⁺ to build a conjugate */
const LADDERS=[['H₂SO₄','HSO₄⁻','SO₄²⁻'],['H₃PO₄','H₂PO₄⁻','HPO₄²⁻','PO₄³⁻'],['H₃O⁺','H₂O','OH⁻'],['NH₄⁺','NH₃'],['H₂CO₃','HCO₃⁻','CO₃²⁻'],['CH₃COOH','CH₃COO⁻'],['HNO₃','NO₃⁻'],['CH₃NH₃⁺','CH₃NH₂'],['HCl','Cl⁻'],['HCOOH','HCOO⁻'],['HNO₂','NO₂⁻'],['HF','F⁻']];
const ladderOf=s=>LADDERS.find(L=>L.includes(s));
function machine(id,tasks){WDEF[id]={type:'mach',tasks}; const st=wst(id,{t:0,cur:null,miss:0,log:[],msg:null});
  const log=st.log.length?`<div class="mlog">${st.log.map(l=>`<span>${l}</span>`).join('')}</div>`:'';
  if(st.t>=tasks.length) return `${log}<p class="toastline good">All ${tasks.length} built.</p>`;
  const T=tasks[st.t],L=ladderOf(T.s),i0=L.indexOf(T.s); if(st.cur==null) st.cur=i0; const cur=L[st.cur];
  return `${doLine('Build',`the conjugate <b>${T.want==='b'?'BASE':'ACID'}</b> of <b>${T.s}</b>`)}
   <div class="mach"><button class="btn big" type="button" data-mw="${id}" data-d="1" ${st.cur>=L.length-1?'disabled':''}>− H⁺</button><div class="mform" id="mf_${id}">${cur}</div><button class="btn big" type="button" data-mw="${id}" data-d="-1" ${st.cur<=0?'disabled':''}>+ H⁺</button></div>
   <div class="row"><button class="btn go" type="button" data-mlock="${id}">Lock it in</button><span class="muted" style="font-weight:800">${st.t+1} / ${tasks.length}</span></div>
   ${st.msg?`<p class="toastline bad">${st.msg}</p>`:''}${log}`;}

/* ranking */
function orderW(id,prompt,items,fixMsg){WDEF[id]={type:'ord',items}; const st=wst(id,{seq:[]}),n=items.length,correct=items.map((_,i)=>i).sort((a,b)=>items[b].v-items[a].v);
  return `${doLine('Rank',prompt)}<div class="ordl">${items.map((it,i)=>{const p=st.seq.indexOf(i),cls=st.checked?(p===correct.indexOf(i)?'good':'bad'):'';
    return `<button type="button" class="ordi ${cls}" data-ow="${id}" data-i="${i}" ${st.ok?'disabled':''}><span class="on">${p>=0?p+1:''}</span><span class="ot"><b>${it.t}</b><small>${it.d}</small>${st.ok&&it.after?`<small class="oa">${it.after}</small>`:''}</span></button>`;}).join('')}</div>
   ${st.ok?'<p class="toastline good">Correct order.</p>':`<div class="row"><button class="btn" type="button" data-oclr="${id}">Clear</button><button class="btn go" type="button" data-ochk="${id}" ${st.seq.length<n?'disabled':''}>Check</button></div>${st.checked?`<p class="toastline bad">${fixMsg||'Not quite.'}</p>`:''}`}`;}

/* K expression builder: tap each species to put it on top, bottom, or leave it out */
function exprW(id,K,eq){WDEF[id]={type:'expr',eq}; const st=wst(id,{p:{}}),sp=eq.l.concat(eq.r);
  const part=w=>sp.map((s,i)=>st.p[i]===w?`[${s.t}]`:'').filter(Boolean).join('');
  const lab={top:'top ↑',bot:'bottom ↓',out:'leave out ✕'};
  const chip=(s,i)=>`<button type="button" class="xchip x-${st.p[i]||'none'}" data-xw="${id}" data-i="${i}" ${st.ok?'disabled':''}><span>${s.t}</span><small>${lab[st.p[i]]||'tap me'}</small></button>`;
  const all=sp.every((_,i)=>st.p[i]);
  return `<div class="xbox"><div class="req">${eq.l.map((s,i)=>chip(s,i)).join('<span class="plus">+</span>')}<span class="rarrow">${eq.arrow}</span>${eq.r.map((s,i)=>chip(s,i+eq.l.length)).join('<span class="plus">+</span>')}</div>
   <div class="frac"><span class="K">${K} =</span><span class="fr"><span>${part('top')||'?'}</span><span>${part('bot')||'?'}</span></span></div>
   ${st.ok?'<p class="toastline good">Correct expression.</p>':`<div class="row"><button class="btn go" type="button" data-xchk="${id}" ${all?'':'disabled'}>Check</button></div>${st.msg?`<p class="toastline bad">${st.msg}</p>`:''}`}</div>`;}

/* equation builder: pick the products */
function buildW(id,label,lhs,arrow,opts,ans){WDEF[id]={type:'build',opts,ans}; const st=wst(id,{sel:[]});
  return `<div class="build">${label?`<div class="blabel">${label}</div>`:''}<div class="req"><span class="bl">${lhs}</span><span class="rarrow">${arrow}</span>${ans.map((_,k)=>`<span class="slot ${st.sel[k]!=null?'full':''}">${st.sel[k]!=null?opts[st.sel[k]]:'?'}</span>`).join('<span class="plus">+</span>')}</div>
   ${st.ok?'<p class="toastline good">Balanced and correct.</p>':`<div class="bopts">${opts.map((o,i)=>`<button type="button" class="bchip" data-bw="${id}" data-i="${i}" aria-pressed="${st.sel.includes(i)}">${o}</button>`).join('')}</div>
   <div class="row"><button class="btn go" type="button" data-bchk="${id}" ${st.sel.length<ans.length?'disabled':''}>Check</button></div>${st.msg?`<p class="toastline bad">${st.msg}</p>`:''}`}</div>`;}

/* pick-all-that-apply */
function pickW(id,prompt,opts,ans){WDEF[id]={type:'pick',opts,ans}; const st=wst(id,{sel:[]});
  return `${doLine('Tap',prompt)}<div class="bopts">${opts.map((o,i)=>{const p=st.sel.includes(i),cls=st.checked?(ans.includes(i)===p?(p?'good':''):'bad'):''; return `<button type="button" class="bchip ${cls}" data-pw="${id}" data-i="${i}" aria-pressed="${p}" ${st.ok?'disabled':''}>${o}</button>`;}).join('')}</div>
   ${st.ok?'<p class="toastline good">Correct.</p>':`<div class="row"><button class="btn go" type="button" data-pchk="${id}" ${st.sel.length?'':'disabled'}>Check</button></div>${st.checked?'<p class="toastline bad">Not quite. Red = wrong pick or a missed one.</p>':''}`}`;}

function bindW(){
  bindPred();
  const q=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>fn(b)));
  q('[data-sw]',b=>{const st=wst(b.dataset.sw); st.a[+b.dataset.i]=+b.dataset.j; blip('tap'); renderCard(true);});
  q('[data-swchk]',b=>{const id=b.dataset.swchk,d=WDEF[id],st=wst(id); st.checked=true; wDone(id,d.items.every((it,i)=>st.a[i]===it.b)); renderCard(true);});
  q('[data-rw]',b=>{const id=b.dataset.rw,d=WDEF[id],st=wst(id),i=+b.dataset.i,sp=d.eq.l.concat(d.eq.r),want=d.seq[st.k]; if(st.got[i]) return;
    if(sp[i].r===want){st.got[i]=want; st.k++; st.msg=null; blip('ok'); if(st.k>=d.seq.length){st.tries=st.miss?2:1; st.ok=true; st.miss?award(5,'sorted'):right(15,'no misses');}}
    else {st.miss++; st.msg=ROLEHINT[want]; wrong();} renderCard(true);});
  q('[data-mw]',b=>{const st=wst(b.dataset.mw); st.cur+= +b.dataset.d; st.msg=null; blip('tap'); renderCard(true); const f=$('mf_'+b.dataset.mw); if(f){f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump');}});
  q('[data-mlock]',b=>{const id=b.dataset.mlock,d=WDEF[id],st=wst(id),T=d.tasks[st.t],L=ladderOf(T.s),i0=L.indexOf(T.s),tgt=i0+(T.want==='b'?1:-1);
    if(st.cur===tgt){st.log.push(`${T.s} → ${L[st.cur]} ✓`); st.t++; st.cur=null; st.msg=null; award(4); blip('ok'); if(st.t>=d.tasks.length){st.ok=true; st.tries=st.miss?2:1; st.miss?award(5,'built'):right(15,'no misses');}}
    else {st.miss++; st.msg=st.cur===i0?'You haven\'t changed it yet. Use − H⁺ or + H⁺.':T.want==='b'?'Conjugate BASE = take away ONE H⁺. The charge drops by 1.':'Conjugate ACID = add ONE H⁺. The charge goes up by 1.'; wrong();}
    renderCard(true);});
  q('[data-ow]',b=>{const st=wst(b.dataset.ow),i=+b.dataset.i,p=st.seq.indexOf(i); st.checked=false; if(p>=0) st.seq.splice(p,1); else st.seq.push(i); blip('tap'); renderCard(true);});
  q('[data-oclr]',b=>{const st=wst(b.dataset.oclr); st.seq=[]; st.checked=false; renderCard(true);});
  q('[data-ochk]',b=>{const id=b.dataset.ochk,d=WDEF[id],st=wst(id),c=d.items.map((_,i)=>i).sort((a,x)=>d.items[x].v-d.items[a].v); st.checked=true; wDone(id,c.every((v,k)=>st.seq[k]===v)); renderCard(true);});
  q('[data-xw]',b=>{const st=wst(b.dataset.xw),i=+b.dataset.i,nx={undefined:'top',top:'bot',bot:'out',out:'top'}; st.p[i]=nx[st.p[i]]; st.msg=null; blip('tap'); renderCard(true);});
  q('[data-xchk]',b=>{const id=b.dataset.xchk,d=WDEF[id],st=wst(id),sp=d.eq.l.concat(d.eq.r),bad=sp.findIndex((s,i)=>st.p[i]!==s.pos);
    st.msg=bad<0?null:sp[bad].pos==='out'?`${sp[bad].t} is a pure liquid (or solvent): leave it out.`:sp[bad].pos==='top'?`${sp[bad].t} is a product: products go on top.`:`${sp[bad].t} is a reactant: reactants go on the bottom.`; wDone(id,bad<0); renderCard(true);});
  q('[data-bw]',b=>{const id=b.dataset.bw,d=WDEF[id],st=wst(id),i=+b.dataset.i,p=st.sel.indexOf(i); st.msg=null; if(p>=0) st.sel.splice(p,1); else if(st.sel.length<d.ans.length) st.sel.push(i); blip('tap'); renderCard(true);});
  q('[data-bchk]',b=>{const id=b.dataset.bchk,d=WDEF[id],st=wst(id),got=st.sel.map(i=>d.opts[i]).sort().join('|'),ok=got===d.ans.slice().sort().join('|');
    st.msg=ok?null:'Not quite. The acid loses one H⁺ (H₂O becomes H₃O⁺); the base gains one H⁺ (H₂O becomes OH⁻).'; if(!ok) st.sel=[]; wDone(id,ok); renderCard(true);});
  q('[data-pw]',b=>{const st=wst(b.dataset.pw),i=+b.dataset.i,p=st.sel.indexOf(i); st.checked=false; if(p>=0) st.sel.splice(p,1); else st.sel.push(i); blip('tap'); renderCard(true);});
  q('[data-pchk]',b=>{const id=b.dataset.pchk,d=WDEF[id],st=wst(id); st.checked=true; wDone(id,st.sel.slice().sort().join()===d.ans.slice().sort().join()); renderCard(true);});
}

/* ================= picker modules: a menu of short missions ================= */
function scoreOf(k){let n=0,first=0; const p=k+'_';
  Object.keys(S.qtries||{}).filter(i=>i.startsWith(p)).forEach(i=>{if(quizOk(i)){n++; if(S.qtries[i]===1) first++;}});
  Object.keys(S.ctries||{}).filter(i=>i.startsWith(p)).forEach(i=>{if(S.calc[i]&&S.calc[i].ok){n++; if(S.ctries[i]===1) first++;}});
  Object.keys(S.w||{}).filter(i=>i.startsWith(p)).forEach(i=>{if(S.w[i].ok){n++; if(S.w[i].tries===1) first++;}});
  return {n,first};}
function pickerModule(o){
  const worlds=[{n:'Missions',c:o.c}].concat(o.subs.map(s=>({n:s.n,c:s.c})));
  const steps=[{id:o.key+'_pick',w:0,solo:true,title:'Pick a mission',purpose:o.purpose,hint:'Tap a mission card. If you\'re not sure, go in order: each one builds on the last.',
    html:()=>{const nd=o.subs.filter(s=>S.done[s.k]).length;
      return `<p class="lead">${o.lead}</p><div class="missions">${o.subs.map((s,i)=>{const d=S.done[s.k],before=!d&&PROG[o.key].subs[s.k];
        return `<button type="button" class="mcard ${d?'done':''}" data-mi="${i}" style="--c:${cv(s.c)}"><span class="mcn">${d?'✓':i+1}</span><span class="mct"><b>${s.n}</b><small>${s.d}</small></span><span class="mcl">${s.steps.length} step${s.steps.length>1?'s':''}${before?'<br>done before':''}</span></button>`;}).join('')}</div>
        <p class="muted" style="font-size:.85rem;font-weight:700">${nd} of ${o.subs.length} missions done. ${nd?'You can get your report any time.':''}</p>`;},
    bind:()=>document.querySelectorAll('[data-mi]').forEach(b=>b.addEventListener('click',()=>{HIST.push((()=>{const sn=S.snap; S.snap=null; const j=JSON.stringify(S); S.snap=sn; return j;})()); S.step=sid(o.subs[+b.dataset.mi].steps[0].id); S.finished=false; blip('tap'); snap(); renderAll(); $('mbody').scrollTop=0;})),
    can:()=>o.subs.some(s=>S.done[s.k]),gate:'Finish a mission first',next:()=>o.subs.every(s=>S.done[s.k])?'Get my report':'Report so far',onNext:()=>finishPicker(o),goto:()=>o.key+'_report'}];
  o.subs.forEach((s,si)=>s.steps.forEach((st,j)=>{st.w=si+1; if(j===s.steps.length-1){const pn=st.onNext; st.onNext=()=>{pn&&pn(); if(!S.done[s.k]){S.done[s.k]=true; award(25,s.n+' done'); confetti();} PROG[o.key].subs[s.k]=true; save();}; st.goto=()=>o.key+'_pick'; if(!st.next) st.next='Mission complete';} steps.push(st);}));
  steps.push({id:o.key+'_report',w:0,solo:true,title:o.title+' report',last:true,html:()=>`<p class="lead">Here's your summary. Tap Back to keep practising.</p>${reportActions()}${S.report||''}`,bind:()=>bindReportActions(S.report,o.title+' report')});
  MODULES[o.key]={title:o.title,blurb:o.blurb,c:o.c,defKey:'strong',subs:o.subs,worlds,init:()=>{S.done={}; S.w={}; o.init&&o.init();},steps};}
function finishPicker(o){
  const rows=o.subs.map(s=>{const sc=scoreOf(s.k); return `<tr><td>${s.n}</td><td>${S.done[s.k]?'✓ done':'not yet'}</td><td class="num mono">${sc.n?`${sc.first} / ${sc.n}`:'–'}</td></tr>`;}).join('');
  const work=o.subs.map(s=>{if(!s.calcs) return ''; const lines=s.calcs().filter(st=>S.calc[st.id]&&S.calc[st.id].ok).map(st=>`${st.q}: ${st.sub.replace(/<[^>]+>/g,'')} → ${S.calc[st.id].val} ${st.unit||''}`); return lines.length?`<p><b>${s.n}</b></p><div class="work">${lines.join('<br>')}</div>`:'';}).join('');
  const html=reportShell(o.reportTitle,o.aim,`<h4>Missions</h4><div class="tw"><table><thead><tr><th>Mission</th><th>Status</th><th class="num">Right first try</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${o.cheat?`<h4>Cheat sheet</h4>${o.cheat()}`:''}${work?`<h4>Your working</h4>${work}`:''}<h4>Next</h4><p>${o.nextTxt}</p>`);
  S.report=html; saveReport(o.key,o.title,html); if(o.subs.every(s=>S.done[s.k])){PROG[o.key].done=true; badge(o.badge);} save(true); confetti();}

/* ================= module: Acids & Bases (3.1.04.1) ================= */
Object.assign(QUIZ,{
  a1_proton:[{t:'Because it is positive',ok:false,fb:'Lots of ions are positive. Think about what is left of the atom.'},{t:'A hydrogen atom is 1 proton + 1 electron. Lose the electron and only the proton is left',ok:true,fb:'Yes. H⁺ is literally a bare proton.'},{t:'Because it lives in the nucleus',ok:false,fb:'H⁺ isn\'t inside another nucleus. What is left when H loses its electron?'}],
  a1_def:[{t:'A proton (H⁺) acceptor',ok:false,fb:'That\'s a base. The acid is the one that gives.'},{t:'Something that makes OH⁻',ok:false,fb:'That\'s an old definition of a base. Brønsted–Lowry is all about H⁺ moving.'},{t:'A proton (H⁺) donor',ok:true,fb:'Yes. Acid = H⁺ donor, base = H⁺ acceptor.'}],
  a1_w:[{t:'Neutral, so it doesn\'t react',ok:false,fb:'It reacted in both equations. Look again at what it did.'},{t:'Amphiprotic: it can donate or accept H⁺',ok:true,fb:'Yes. Water was a base with HNO₃ and an acid with NH₃.'},{t:'A strong acid',ok:false,fb:'Water barely ionises on its own. It can act both ways, though.'}],
  a2_q:[{t:'One electron',ok:false,fb:'Electrons don\'t move in acid–base reactions. Protons do.'},{t:'One OH⁻',ok:false,fb:'Look at your pairs: what is the only difference?'},{t:'One H⁺',ok:true,fb:'Yes. A conjugate pair differs by exactly one H⁺.'}],
  a3_amq:[{t:'H₂PO₄⁻ can give an H⁺ or take one, so it is amphiprotic',ok:true,fb:'Yes. It has an H⁺ to give AND it can accept one.'},{t:'PO₄³⁻ is amphiprotic because it has the biggest charge',ok:false,fb:'PO₄³⁻ has no H left to give, so it can only be a base.'},{t:'H₃PO₄ is amphiprotic because it has the most H',ok:false,fb:'H₃PO₄ can\'t accept another H⁺ here, so it can only act as an acid.'}],
  a4_why:[{t:'It reacts slowly',ok:false,fb:'Speed isn\'t the point. Think about how much of it splits into ions.'},{t:'It is dilute',ok:false,fb:'Dilute means little acid in the water. Weak is about how much splits up.'},{t:'It only partly ionises, so molecules and ions sit in equilibrium',ok:true,fb:'Yes. → means all ionised; ⇌ means only some, with most left as molecules.'}],
  a5_q:[{t:'1.0 mol/L CH₃COOH (weak, concentrated)',ok:false,fb:'It has more acid, but only about 0.4% of it ionises. Compare the [H⁺] readings.'},{t:'0.010 mol/L HCl (strong, dilute)',ok:true,fb:'Yes! 0.010 mol/L H⁺ beats 0.004 mol/L. Strong does not mean concentrated, and weak does not mean dilute.'},{t:'They have exactly the same [H⁺]',ok:false,fb:'Close, but compare the readings: 0.010 vs 0.0042 mol/L.'}],
  a5_conc:[{t:'R (the HCl)',ok:false,fb:'Concentration = how much acid is dissolved. Which has more mol/L?'},{t:'P (the weak acid)',ok:true,fb:'Yes. P has far more acid per litre. It just doesn\'t ionise much.'},{t:'They are equally concentrated',ok:false,fb:'Check the mol/L of each.'}],
  a5_str:[{t:'P, because it is more concentrated',ok:false,fb:'Strength is about the % that ionises, not how much is dissolved.'},{t:'R (HCl), because it ionises completely',ok:true,fb:'Yes. Strong = 100% ionised. P only managed a small %.'},{t:'Neither: they have the same pH',ok:false,fb:'Same pH, different reasons. Which one ionises fully?'}],
  a6_mg:[{t:'They are too dilute',ok:false,fb:'All four are 0.10 mol/L. Look at their pH.'},{t:'They are bases, so there is almost no H⁺ to react with Mg',ok:true,fb:'Yes. Mg + 2H⁺ → Mg²⁺ + H₂. No H⁺, no fizz.'},{t:'Magnesium only reacts with weak acids',ok:false,fb:'X (HCl) reacted vigorously, and HCl is strong.'}],
  a6_cond:[{t:'Y (NaOH) is a strong base: fully ionised, so it has far more ions',ok:true,fb:'Yes. Same concentration, but NH₃ (W) barely ionises.'},{t:'Y is more concentrated',ok:false,fb:'Both are 0.10 mol/L. It\'s about strength.'},{t:'W has no ions at all',ok:false,fb:'W conducts a little (400 µS/cm), so it has a few ions.'}],
  a6_dil:[{t:'Go down by 1 and conductivity goes up',ok:false,fb:'Fewer H⁺ means a HIGHER pH and fewer ions to carry charge.'},{t:'Stay the same, because HCl is strong',ok:false,fb:'Strong means fully ionised, but there are still fewer H⁺ per litre after diluting.'},{t:'Go up by 1, and conductivity drops about 10×',ok:true,fb:'Yes. 10× fewer H⁺ = pH up 1 and about 10× fewer ions.'}],
  a6_same:[{t:'HCl is strong but very dilute; CH₃COOH is weak but 100× more concentrated, so their [H⁺] ends up similar',ok:true,fb:'Yes. Strength and concentration can cancel each other out.'},{t:'They are both weak acids',ok:false,fb:'HCl is one of the 3 strong acids.'},{t:'Conductivity and pH are always the same for acids',ok:false,fb:'Look at the 0.10 mol/L HCl row: totally different.'}]
});
const PLAB={strong:{conc:{H:1.0,pH:0.0,k:100,mg:4,n:20,ion:20},dil:{H:0.010,pH:2.0,k:10,mg:2,n:5,ion:5}},weak:{conc:{H:0.0042,pH:2.4,k:3.5,mg:1.5,n:20,ion:3},dil:{H:0.00042,pH:3.4,k:0.4,mg:0.5,n:5,ion:1}}};
function seeded(n,seed){let s=seed; const r=()=>{s=(s*9301+49297)%233280; return s/233280;}; return Array.from({length:n},()=>[r(),r()]);}
function plabSVG(s,c){const P=PLAB[s][c],pos=seeded(P.n,c==='conc'?17:5); let g='';
  pos.forEach(([x,y],i)=>{const X=30+x*140,Y=60+y*95; if(i<P.ion){g+=`<circle cx="${X-7}" cy="${Y}" r="5" fill="var(--pink)" stroke="var(--edge)" stroke-width="1.5"/><circle cx="${X+9}" cy="${Y+5}" r="8" fill="var(--blue)" stroke="var(--edge)" stroke-width="1.5"/>`;}
    else g+=`<g><circle cx="${X}" cy="${Y}" r="9" fill="var(--surface-2)" stroke="var(--edge)" stroke-width="1.5"/><circle cx="${X-8}" cy="${Y-5}" r="5" fill="#fff" stroke="var(--edge)" stroke-width="1.5"/></g>`;});
  return `<svg viewBox="0 0 200 180" class="plab" aria-hidden="true"><path d="M18 30v128a12 12 0 0 0 12 12h140a12 12 0 0 0 12-12V30" fill="var(--blue-soft)" stroke="var(--edge)" stroke-width="3"/><path d="M18 46h164" stroke="var(--blue)" stroke-opacity=".4"/>${g}</svg>`;}
const meter=(lab,val,f,c)=>`<div class="meter"><span>${lab}</span><span class="mt2"><i style="width:${Math.max(3,Math.min(100,f*100)).toFixed(0)}%;background:var(--${c})"></i></span><b>${val}</b></div>`;

pickerModule({key:'ab',title:'Acids & Bases',c:'teal',badge:'abase',blurb:'Proton passing, conjugate pairs, strong vs weak, and reading acid data. Six short missions.',

  nextTxt:'Try Exercise 3.1.04.1. Every question there uses one of these missions.',
  cheat:()=>`<ul><li>Acid = H⁺ donor. Base = H⁺ acceptor (Brønsted–Lowry).</li><li>Conjugate pair = two species that differ by one H⁺. Conjugate base: remove H⁺ (charge −1). Conjugate acid: add H⁺ (charge +1).</li><li>Amphiprotic = can donate or accept H⁺ (H₂O, HCO₃⁻, HSO₄⁻, H₂PO₄⁻, HPO₄²⁻).</li><li>Strong acids: HCl, HNO₃, H₂SO₄. Strong bases: group 1 hydroxides and Ba(OH)₂. Weak acids: carboxylic (–COOH) and carbonic. Weak bases: NH₃ and amines (–NH₂).</li><li>Strong/weak = how much ionises (→ or ⇌). Concentrated/dilute = how much is dissolved (mol/L).</li><li>Same concentration: strong → lower pH, higher conductivity, faster reaction with Mg.</li></ul>`,
  subs:[

function a5List(){const v=S.v.a5,hP=v.c*v.p/100;
  return [{id:'a5_P',f:'[H₃O⁺] in P',q:'[H₃O⁺] in P',sub:`[H₃O⁺] = c × (% ionised ÷ 100) = ${v.c.toFixed(2)} × (${v.p.toFixed(1)} ÷ 100)`,unit:'mol/L',target:hP,rel:0.02,hint:`${v.c.toFixed(2)} × ${v.p.toFixed(1)} ÷ 100`,why:'A weak acid only partly ionises. Only that % of the HA molecules give their H⁺ to water.'},
    {id:'a5_R',f:'[H₃O⁺] in R',q:'[H₃O⁺] in R',sub:'HCl is strong: it ionises completely',unit:'mol/L',target:0.010,rel:0.02,hint:'Strong acid: [H₃O⁺] = the concentration of the acid.',why:'Every HCl gives away its H⁺, so [H₃O⁺] equals the HCl concentration.'},
    {id:'a5_pH',f:'pH',q:'pH of each solution',sub:'pH = −log[H₃O⁺]',unit:'',target:2.00,abs:0.02,hint:'Calculator: − log( 0.010 ) =',why:'Both have the same [H₃O⁺], so both have the same pH, even though they are completely different acids.'}];}
/* ================= module: pH & K Lab (3.1.05 + 3.1.07) ================= */
const cf=v=>(Math.abs(v)<0.001||Math.abs(v)>=1000)?sci(v,2):String(+v.toPrecision(3));
const keyT=v=>{if(Math.abs(v)>=0.001&&Math.abs(v)<1000) return String(+v.toPrecision(3)); const e=Math.floor(Math.log10(Math.abs(v))),m=v/Math.pow(10,e); return `${+m.toPrecision(3)} EXP ${e<0?'−'+(-e):e}`;};
const p2=v=>v.toFixed(2);
const SQ={
  ph:{nodes:{H:['[H⁺]',150,34],pH:['pH',340,34],OH:['[OH⁻]',150,176],pOH:['pOH',340,176],ca:['c (acid)',40,34],cb:['c (base)',40,176]},
    edges:[['H','pH','pH = −log[H⁺]','Right: pH = −log[H⁺]. Left: [H⁺] = 10^−pH.'],['OH','pOH','pOH = −log[OH⁻]','Right: pOH = −log[OH⁻]. Left: [OH⁻] = 10^−pOH.'],['H','OH','[H⁺][OH⁻] = 10⁻¹⁴','Kw = [H⁺] × [OH⁻] = 1.0 × 10⁻¹⁴. Divide 10⁻¹⁴ by the one you know.'],['pH','pOH','pH + pOH = 14','pH + pOH = 14.00. Subtract the one you know from 14.'],['ca','H','× H⁺ each','Strong acid: [H⁺] = concentration × H⁺ per formula.'],['cb','OH','× OH⁻ each','Strong base: [OH⁻] = concentration × OH⁻ per formula (×2 for Ba(OH)₂).']]},
  k:{nodes:{Ka:['Ka',150,34],pKa:['pKa',340,34],Kb:['Kb',150,176],pKb:['pKb',340,176]},
    edges:[['Ka','pKa','pKa = −log Ka','Right: pKa = −log Ka. Left: Ka = 10^−pKa.'],['Kb','pKb','pKb = −log Kb','Right: pKb = −log Kb. Left: Kb = 10^−pKb.'],['Ka','Kb','Ka × Kb = 10⁻¹⁴','For a conjugate pair: Ka × Kb = Kw = 1.0 × 10⁻¹⁴. Divide 10⁻¹⁴ by the one you know.'],['pKa','pKb','pKa + pKb = 14','pKa + pKb = 14.00. Subtract from 14.']]}};
function sqAdj(kind,a,b){return SQ[kind].edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));}
function sqDist(kind,a,b,allowed){const seen={[a]:0},Q=[a]; while(Q.length){const x=Q.shift(); if(x===b) return seen[x]; SQ[kind].edges.forEach(e=>{[[e[0],e[1]],[e[1],e[0]]].forEach(([p,q])=>{if(p===x&&allowed.includes(q)&&seen[q]==null){seen[q]=seen[x]+1; Q.push(q);}});});} return 99;}
function squareSVG(kind,opt){const K=SQ[kind],nodes=opt.nodes,path=opt.path||[],P=n=>K.nodes[n];

  p9_ka:[{t:'% ionisation changes with concentration, but Ka doesn\'t',ok:true,fb:'Yes. Ka is a fair test: same for any concentration (at one temperature).'},{t:'Ka is easier to measure',ok:false,fb:'Not really: you often get Ka FROM % ionisation. Look at the table: what changes the %?'},{t:'They are the same thing',ok:false,fb:'They\'re linked, but % ionised changes when you dilute.'}]

const UIC=['#e3242b','#ee4f2a','#f47b20','#f9a01b','#fbc319','#e8d81d','#b6d433','#6abd45','#35a852','#1c9a75','#1d8ba4','#2266b0','#3a4ca0','#4b3a92','#5a2d82'];
function ionPct(Ka,c){if(Ka==null) return 100; const x=(-Ka+Math.sqrt(Ka*Ka+4*Ka*c))/2; return x/c*100;}
const IONA=[{t:'HCl',Ka:null,d:'strong'},{t:'HF',Ka:6.8e-4},{t:'CH₃COOH',Ka:1.8e-5},{t:'HOCl',Ka:3.0e-8}];

pickerModule({key:'ph',title:'pH & K Lab',c:'violet',badge:'phk',blurb:'Kw, pH, pOH, Ka, Kb, pKa and pKb, one small step at a time. Nine short missions with a route map so you always know which equation.',
  lead:'Nine short missions. The secret weapon: two "squares" that tell you which equation to use. Go in order.',

  nextTxt:'Try Exercises 3.1.05.1 and 3.1.07.1. For each calculation, sketch the square, circle what you have and what you want, then follow the lines.',
  cheat:()=>`<div class="tw"><table><thead><tr><th>Line on the square</th><th>pH square</th><th>K square</th></tr></thead><tbody><tr><td>top: −log / 10^−</td><td class="mono">pH = −log[H⁺] ; [H⁺] = 10^−pH</td><td class="mono">pKa = −log Ka ; Ka = 10^−pKa</td></tr><tr><td>bottom: −log / 10^−</td><td class="mono">pOH = −log[OH⁻] ; [OH⁻] = 10^−pOH</td><td class="mono">pKb = −log Kb ; Kb = 10^−pKb</td></tr><tr><td>left: multiply to 10⁻¹⁴</td><td class="mono">[H⁺][OH⁻] = 1.0 × 10⁻¹⁴</td><td class="mono">Ka × Kb = 1.0 × 10⁻¹⁴</td></tr><tr><td>right: add to 14</td><td class="mono">pH + pOH = 14.00</td><td class="mono">pKa + pKb = 14.00</td></tr></tbody></table></div>
    <ul><li>Strong acid: [H⁺] = c. Strong base: [OH⁻] = c × (OH⁻ per formula), so Ba(OH)₂ is ×2.</li><li>Ka = [H₃O⁺][A⁻] ÷ [HA] ; Kb = [BH⁺][OH⁻] ÷ [B]. Water is left out.</li><li>Bigger Ka / smaller pKa = stronger acid = weaker conjugate base.</li><li>Ka from pH: x = 10^−pH, [HA]eq = c − x, Ka = x² ÷ (c − x), % ionised = x ÷ c × 100.</li></ul>`,
  subs:[
  {k:'p1',n:'Water splits',short:'Kw',c:'teal',d:'Kw and why [H⁺] × [OH⁻] is always 10⁻¹⁴.',steps:[

     html:()=>{const st=wst('p1_s',{e:-4,seen:{}}); const e=st.e;

         <div class="kwrow"><span>[OH⁻]</span><span class="mt2"><i id="kwO" style="width:${((-e)/14*100).toFixed(0)}%;background:var(--blue)"></i></span><b id="kwOt">1 × 10<sup>${-14-e}</sup></b></div>
         <input type="range" class="islider" id="kwSl" min="-14" max="0" step="1" value="${e}" aria-label="[H⁺] power of ten">

        ${st.seen[-7]&&st.seen[-3]?quiz('p1_oh','When [H⁺] = 1 × 10⁻³ mol/L, [OH⁻] is…'):''}
        ${newWord('Kw','the ionic product of water: [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 25 °C.')}`;},
     bind:()=>{const sl=$('kwSl'),st=wst('p1_s'),upd=()=>{const e=+sl.value; st.e=e; $('kwH').style.width=((e+14)/14*100).toFixed(0)+'%'; $('kwO').style.width=((-e)/14*100).toFixed(0)+'%'; $('kwHt').innerHTML=`1 × 10<sup>${e}</sup>`; $('kwOt').innerHTML=`1 × 10<sup>${-14-e}</sup>`; const l=$('kwLab'); l.textContent=`${e>-7?'ACIDIC':e<-7?'BASIC':'NEUTRAL'} · pH ${-e}`; l.style.background=UIC[-e];};
       sl.addEventListener('input',upd); sl.addEventListener('change',()=>{upd(); if((st.e===-7||st.e===-3)&&!st.seen[st.e]){st.seen[st.e]=1; award(3); renderCard(true);}});},
     can:()=>quizOk('p1_oh'),gate:'Do both, then answer'},
    {id:'p1_temp',solo:true,title:'Heat it up',purpose:'Kw is only 1.0 × 10⁻¹⁴ at 25 °C. Knowing WHY it changes with temperature shows you really get equilibrium, and it\'s a favourite exam trick.',hint:'Drag the temperature up to at least 60 °C and watch Kw and the neutral pH. Then answer.',
     html:()=>{const st=wst('p1_t',{i:3,max:3});
       return `<div class="eqn" style="font-size:1rem">2H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq) &nbsp;&nbsp; ΔH > 0 (endothermic)</div>
        ${doLine('Drag','the temperature. Watch Kw and the pH of PURE water.')}
        <div class="kw"><input type="range" class="islider" id="ktSl" min="0" max="${KWT.length-1}" step="1" value="${st.i}" aria-label="Temperature">

        <canvas class="chart" id="ktC" style="height:170px"></canvas>
        ${st.max>=7?quiz('p1_t1','As the temperature rises, Kw…')+(quizOk('p1_t1')?quiz('p1_t2','Why does Kw go up?'):'')+(quizOk('p1_t2')?quiz('p1_t3','Pure water at 60 °C has pH 6.51. It is…'):''):''}`;},
     bind:()=>{const st=wst('p1_t'),sl=$('ktSl'),draw=()=>drawChart($('ktC'),{xmax:100,xstep:20,ymin:6,ymax:7.6,ystep:0.4,ylab:'pH of pure water',xlab:'°C',series:[{pts:KWT.map(r=>[r[0],r[1]/2]),color:'--violet'}],marks:[{x:KWT[st.i][0],y:KWT[st.i][1]/2,color:'--pink',label:(KWT[st.i][1]/2).toFixed(2)}],hlines:[{y:7,color:'--muted',label:'pH 7'}]});
       draw(); sl.addEventListener('input',()=>{st.i=+sl.value; $('ktOut').innerHTML=ktOut(st.i); draw();}); sl.addEventListener('change',()=>{st.i=+sl.value; if(st.i>st.max){const was=st.max; st.max=st.i; if(was<7&&st.max>=7) renderCard(true);}});},
     can:()=>quizOk('p1_t3'),gate:'Heat to 60 °C, then answer'},
    {id:'p1_q',solo:true,title:'Water questions',purpose:'These are the three "explain" questions examiners love about water and Kw.',hint:'Pure water has only 1 × 10⁻⁷ mol/L of each ion. Pure liquids never go in K expressions. Kw must always equal 10⁻¹⁴.',

     can:()=>quizOk('p1_hcl'),gate:'Answer all 3'}]},

  {k:'pc',n:'What pKa & pKb mean',short:'pKa meaning',c:'yellow',d:'pKa is a pH. Why you care, pKb, and strong acids.',steps:[

function p9rList(){const A=S.v.p9r,x=Math.sqrt(A.ka*A.c);
  return [{id:'p9r_x2',f:'x²',q:'x² (assume [HA]eq ≈ c)',sub:`Ka = x² ÷ c, so x² = Ka × c = ${sci(A.ka,1)} × ${A.c}`,unit:'',target:A.ka*A.c,rel:0.03,hint:`${keyT(A.ka)} × ${A.c} =`,why:'Ka is tiny, so hardly any acid ionises and c − x ≈ c. State this assumption in your answer.'},

const KA_AC=1.75e-5;
/* pH of a mixture: weak acid HA + its salt NaA, plus added HCl and NaOH (mol), total volume V (L) */
function bufPH(nHA,nA,nHCl,nNaOH,V){const CT=(nHA+nA)/V,Na=(nA+nNaOH)/V,Cl=nHCl/V,f=h=>h+Na-Kw/h-Cl-CT*KA_AC/(h+KA_AC);
  let lo=-1,hi=15; for(let i=0;i<60;i++){const m=(lo+hi)/2; if(f(Math.pow(10,-m))>0) lo=m; else hi=m;} return (lo+hi)/2;}
const phCol=p=>UIC[Math.max(0,Math.min(14,Math.round(p)))];

function mohrCalc(){const c=concordant(),m=meanOf(c),nAg=0.0500*m/1000,cD=nAg/0.02000,cO=cD*10,g=cO*35.45;
  return [{id:'m_mean',f:'Average titre',q:'Average titre',sub:`Concordant titres: ${c.map(r=>titre(r).toFixed(2)).join(', ')} mL`,unit:'mL',target:m,abs:0.011,hint:'Add them, divide by how many.',why:'Concordant titres agree, so their average is the best value. The rough run is left out.'},
    {id:'m_nAg',f:'mol Ag⁺',q:'Moles of Ag⁺',sub:'n = c × V   (c = 0.0500 mol/L, V in L)',unit:'mol',target:nAg,rel:0.01,hint:'0.0500 × (average ÷ 1000)',why:'We know the silver nitrate concentration and the volume used, so c × V counts the Ag⁺ added.'},
    {id:'m_nCl',f:'mol Cl⁻',q:'Moles of Cl⁻ in 20.00 mL',sub:'Ag⁺ + Cl⁻ → AgCl(s) is 1 : 1',unit:'mol',target:nAg,rel:0.01,hint:'Same as moles of Ag⁺.',why:'One Ag⁺ grabs one Cl⁻ to make AgCl.'},
    {id:'m_cD',f:'[Cl⁻] diluted',q:'[Cl⁻] in the diluted seawater',sub:'c = n ÷ V   (20.00 mL = 0.02000 L)',unit:'mol/L',target:cD,rel:0.01,hint:'moles ÷ 0.02000',why:'Those moles were in the 20.00 mL aliquot.'},
    {id:'m_cO',f:'× 10',q:'[Cl⁻] in the original seawater',sub:'10.00 mL was diluted to 100.0 mL (a 1 in 10 dilution)',unit:'mol/L',target:cO,rel:0.01,hint:'Multiply by 10.',why:'We diluted the seawater 10 times so the titre would fit the burette. Undo it.'},
    {id:'m_g',f:'g/L',q:'Chloride in grams per litre',sub:'g/L = mol/L × M(Cl) = × 35.45',unit:'g/L',target:g,rel:0.01,hint:'× 35.45',why:'Oceanographers report chloride in g/L. Moles × molar mass = grams.'}].concat(uncSteps('mu_',m,20.00,{v:0.02/10+0.10/100,t:'the 10.00 mL pipette (±0.02) and 100.0 mL flask (±0.10)',h:'0.02 ÷ 10.00 + 0.10 ÷ 100.0'},cO,'mol/L'));}
function mohrCurvePts(){const ve=veq(),pts=[]; for(let v=0;v<=Math.ceil(ve*1.6);v+=2){const n=Math.min(v,ve)*0.0500/1000; pts.push([v,+(n*143.32*1000*(1+(((v*37)%7)-3)/600)).toFixed(1)]);} return pts;}
function finishMohr(){const c=concordant(),m=meanOf(c),nAg=0.0500*m/1000,cO=nAg/0.02000*10,g=cO*35.45,pct=(0.10/m+0.03/20+0.02/10+0.10/100)*100;
  const fig=chartImg({xmax:Math.ceil(veq()*1.6/5)*5,xstep:5,ymin:0,ymax:Math.ceil(veq()*0.05*143.32/1000*1000/25+1)*25,ylab:'mg AgCl',xlab:'mL AgNO₃ added',series:[{pts:mohrCurvePts(),color:'--blue',dots:true,r:4}],vlines:[{x:veq(),color:'--pink',label:'equivalence'}]},'Mass of AgCl precipitate against volume of AgNO₃ added. The mass rises while Cl⁻ is left, then levels off: the break is the equivalence point.');
  const html=titrationReport({title:'Precipitation titration: chloride in seawater (Mohr method)',aim:'To determine the chloride ion concentration of seawater by titration with 0.0500 mol/L silver nitrate, using potassium chromate as the indicator.',
    method:['Pipetted 10.00 mL of seawater into a 100.0 mL volumetric flask and made it up to the mark with distilled water (1 in 10 dilution).','Pipetted 20.00 mL of the diluted seawater into a conical flask and added 1 mL of 5% potassium chromate (yellow).','Titrated with 0.0500 mol/L AgNO₃ (stored in a brown bottle) until the first permanent red-brown tinge.','Rough titration, then accurate titrations until two titres agreed within 0.10 mL.'],
    eq:'Ag⁺(aq) + Cl⁻(aq) → AgCl(s)   white<br>2Ag⁺(aq) + CrO₄²⁻(aq) → Ag₂CrO₄(s)   red-brown (end point)',runs:S.runs,graph:fig,
    calc:[`Average titre = ${m.toFixed(2)} mL`,`n(Ag⁺) = 0.0500 × ${(m/1000).toFixed(5)} = ${sci(nAg)} mol = n(Cl⁻) in 20.00 mL`,`[Cl⁻] diluted = ${sci(nAg)} ÷ 0.02000 = ${(nAg/0.02).toFixed(4)} mol/L`,`[Cl⁻] seawater = 10 × ${(nAg/0.02).toFixed(4)} = ${cO.toFixed(3)} mol/L`,`Chloride = ${cO.toFixed(3)} × 35.45 = ${g.toFixed(1)} g/L`,`Instrumental % uncertainty = (0.10 ÷ ${m.toFixed(2)} + 0.03 ÷ 20.00 + 0.02 ÷ 10.00 + 0.10 ÷ 100.0) × 100 = ${pct.toFixed(2)} %`],
    result:`The seawater contained <b>${cO.toFixed(3)} ± ${(cO*pct/100).toFixed(3)} mol/L</b> chloride (${g.toFixed(1)} g/L). Typical seawater is about 19 g/L.`,
    trueLine:`The accepted value for this sample was ${(S.Ca*10).toFixed(3)} mol/L, so the result was ${((cO-S.Ca*10)/(S.Ca*10)*100).toFixed(1)}% from it.`,
    evalu:techniqueNotes(S.runs).concat(['Why the indicator works: AgCl needs far less Ag⁺ to precipitate (Ksp ÷ [Cl⁻] ≈ 3.6 × 10⁻⁹ mol/L) than Ag₂CrO₄ (√(Ksp ÷ [CrO₄²⁻]) ≈ 1.5 × 10⁻⁵ mol/L), so red-brown Ag₂CrO₄ only appears once almost all Cl⁻ has precipitated.','A small excess of Ag⁺ is needed to see the red-brown colour, so titres are slightly high (systematic). A blank titration corrects this.','The solution must be near neutral: chromate converts to dichromate in acid, and silver oxide precipitates in base.','AgNO₃ is light-sensitive, so it is stored in a brown bottle.'])});
  S.report=html; saveReport('mohr','Salt Detective · seawater',html); PROG.mohr.done=true; S.finished=true; delete RESUME.mohr; save(true); badge('salt'); confetti();}
const MPREP=[['Pipette 10.00 mL of seawater into a 100.0 mL volumetric flask','Seawater is too salty to titrate directly. Diluting 1 in 10 keeps the titre on the burette scale.'],['Make it up to the mark with distilled water, then invert to mix','The bottom of the meniscus sits on the line. Mixing makes it the same all through.'],['Pipette 20.00 mL of the diluted seawater into the conical flask','The aliquot: an exactly known volume of the sample.'],['Add 1 mL of 5% potassium chromate (K₂CrO₄)','The indicator. It\'s yellow now, and goes red-brown at the end point.'],['Fill the burette with 0.0500 mol/L AgNO₃','The titrant. It\'s kept in a brown bottle because light breaks it down.']];

  worlds:[{n:'Learn',c:'blue'},{n:'Prepare',c:'teal'},{n:'Titrate',c:'orange'},{n:'Analyse',c:'violet'}],

  steps:[
  {id:'m_intro',w:0,solo:true,title:'A titration that makes a solid',purpose:'Not every titration is acid–base. Precipitation titrations use an insoluble product to count ions, like salt in seawater, food or drinking water.',hint:'Tap "Add Ag⁺" a few times and watch the white solid form. Then answer.',
   html:()=>{const n=Math.min(S.mtap,6); let dots=''; for(let i=0;i<n*4;i++){const x=32+((i*47)%136),y=150-((i*29)%(14+n*14)); dots+=`<circle cx="${x}" cy="${y}" r="4.5" fill="#f4f4f4" stroke="var(--edge)" stroke-width="1"/>`;}

      <div class="ilab"><div class="tubewrap"><svg viewBox="0 0 200 180" class="plab" aria-hidden="true"><path d="M18 30v128a12 12 0 0 0 12 12h140a12 12 0 0 0 12-12V30" fill="rgba(250,215,60,.35)" stroke="var(--edge)" stroke-width="3"/>${dots}</svg></div>
       <div class="side"><div class="eqn" style="font-size:1rem">Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</div><div class="row"><button class="btn go" id="mAdd" type="button">Add Ag⁺</button><span class="muted" style="font-weight:700">${S.mtap?`${S.mtap} squirt${S.mtap>1?'s':''}`:''}</span></div></div></div>
      ${S.mtap>=3?quiz('m_ppt','What is the white solid?'):''}
      ${newWord('Precipitation titration','a titration where the titrant forms an insoluble solid with the substance being measured. Also called a solubility titration.')}
      ${why('mwhy','Each Ag⁺ removes exactly one Cl⁻. So counting the Ag⁺ needed tells you how much Cl⁻ was there, just like counting OH⁻ in an acid–base titration.')}`;},
   bind:()=>$('mAdd').addEventListener('click',()=>{S.mtap++; blip('tap'); renderCard(true);}),can:()=>quizOk('m_ppt'),gate:'Add Ag⁺, then answer'},
  {id:'m_ksp',w:0,calc:true,title:'How does the indicator know?',purpose:'The indicator works because of Ksp. Two solids compete for the Ag⁺, and the one that needs less Ag⁺ forms first.',hint:'For AgCl: [Ag⁺] = Ksp ÷ [Cl⁻]. For Ag₂CrO₄: [Ag⁺]² × [CrO₄²⁻] = Ksp, so [Ag⁺] = (Ksp ÷ [CrO₄²⁻]) ^ 0.5.',
   html:()=>`<div class="info-card" style="--c:var(--blue);--c-soft:var(--blue-soft)"><b>Two solids compete for Ag⁺</b><span class="mono">AgCl: Ksp = [Ag⁺][Cl⁻] = 1.8 × 10⁻¹⁰ (white)</span><span class="mono">Ag₂CrO₄: Ksp = [Ag⁺]²[CrO₄²⁻] = 1.1 × 10⁻¹² (red-brown)</span><span>In the flask: [Cl⁻] ≈ 0.050 mol/L, [CrO₄²⁻] ≈ 0.0050 mol/L. A solid starts to form when Q goes above Ksp.</span></div>
    ${calcHTML(mkCalc(),doLine('Solve','the [Ag⁺] needed to start each precipitate.'))}${calcDone(mkCalc())?quiz('m_first','So which solid forms first as Ag⁺ is added?'):''}`,
   bind:()=>bindCalc(mkCalc()),can:()=>calcDone(mkCalc())&&quizOk('m_first'),gate:'Solve, then answer'},
  {id:'m_prep',w:1,title:'Prepare the sample',strip:true,purpose:'Dilution, aliquot, indicator, titrant: every step sets up an accurate count of Cl⁻.',hint:'Press "Do it" for each step in order.',
   html:()=>{const n=S.mprep||0; return `${checks(MPREP.map((x,i)=>({t:['Pipette','Make up','Aliquot','Indicator','Burette'][i],done:n>i})))}
     ${n<5?`${doLine('Tap',MPREP[n][0])}<p class="muted" style="font-size:.88rem">${MPREP[n][1]}</p><div class="row"><button class="btn go big" id="mPrep" type="button">Do it</button></div>`:'<p class="toastline good">Flask ready: diluted seawater + yellow chromate. Burette full of silver nitrate.</p>'}
     ${n>=5?quiz('m_ph','The Mohr method only works near neutral pH. Why?'):''}`;},
   bind:()=>{const b=$('mPrep'); if(b) b.addEventListener('click',()=>{S.mprep=(S.mprep||0)+1; if(S.mprep===3){S.setup.aliquot=true; S.setup.flaskOn=true; S.anim.fill=performance.now();} if(S.mprep===5){autoBench(null,'Rough','readInitial');} award(3); renderAll();});},
   can:()=>(S.mprep||0)>=5&&quizOk('m_ph'),gate:'Prepare, then answer'},
  stepRead({id:'m_read',w:2,title:'Read the burette'}),
  stepRough({id:'m_rough',w:2,title:'Rough run'}),
  stepPrecise({id:'m_prec',w:2,title:'Accurate runs',roughId:'m_rough'}),
  {id:'m_calc',w:3,calc:true,title:'How salty?',html:()=>calcHTML(mohrCalc(),doLine('Solve','Titre → moles → concentration → undo the dilution.')),bind:()=>bindCalc(mohrCalc()),can:()=>calcDone(mohrCalc()),gate:'Solve them all'},
  {id:'m_curve',w:3,solo:true,title:'Solubility titration curve',purpose:'Some questions give a graph of precipitate mass against volume instead of a colour change. The break in the graph is the equivalence point.',hint:'Tap where the rising line meets the flat line. Then use n = m ÷ M with the plateau mass.',
   html:()=>{const st=wst('m_cv',{x:null}),ok=st.ok,L=mPlList();
     return `${doLine('Tap','the equivalence point: where the mass of AgCl stops rising.')}<canvas class="chart" id="mcC" style="height:200px"></canvas>
      ${st.x!=null?`<p class="toastline ${ok?'good':'bad'}">${ok?`Equivalence at about ${st.x.toFixed(1)} mL. Your titre was ${meanOf(concordant()).toFixed(2)} mL.`:'Look for the corner where the line goes flat.'}</p>`:''}
      ${ok?quiz('m_plat','Why does the mass stop increasing?')+(quizOk('m_plat')?calcHTML(L,' '):''):''}`;},
   bind:()=>{const st=wst('m_cv'),pts=mohrCurvePts(),ve=veq(),xm=Math.ceil(ve*1.6/5)*5,ym=Math.ceil(ve*0.05*143.32/25+1)*25;
     const m=drawChart($('mcC'),{xmax:xm,xstep:5,ymin:0,ymax:ym,ystep:ym/5,ylab:'mg AgCl',xlab:'mL AgNO₃',series:[{pts,color:'--blue',dots:true,r:4}],marks:st.ok?[{x:st.x,y:Math.min(st.x,ve)*0.05*143.32,color:'--pink'}]:[]});
     $('mcC').addEventListener('pointerdown',e=>{if(!m||st.ok) return; st.x=m.xFromClient(e.clientX); wDone('m_cv',Math.abs(st.x-ve)<=1.5); renderCard(true);});
     bindCalc(mPlList());},
   can:()=>wOk('m_cv')&&quizOk('m_plat')&&S.calc.m_pl&&S.calc.m_pl.ok,gate:'Tap it, answer, solve'},
  {id:'m_eval',w:3,solo:true,title:'Evaluate',purpose:'Every method has built-in errors. Spotting them is what turns a result into a good evaluation.',hint:'Think: extra Ag⁺ needed to see red-brown; what light does to silver salts.',
   html:()=>`${quiz('m_blank','You need a small EXCESS of Ag⁺ to see the red-brown. So the titre is…')}${quizOk('m_blank')?quiz('m_light','Why is silver nitrate kept in a brown bottle?'):''}`,
   can:()=>quizOk('m_light'),gate:'Answer both',next:'Finish',onNext:()=>finishMohr()},
  {id:'m_report',w:3,solo:true,title:'Salt Detective complete',last:true,html:()=>`<p class="lead">Case closed.</p>${reportActions()}${S.report}`,bind:()=>bindReportActions(S.report,'Salt Detective report')}
]};
function mkCalc(){return [{id:'mk_cl',f:'AgCl',q:'[Ag⁺] needed to start AgCl',sub:'[Ag⁺] = Ksp ÷ [Cl⁻] = 1.8 × 10⁻¹⁰ ÷ 0.050',unit:'mol/L',target:1.8e-10/0.050,rel:0.03,hint:'Calculator: 1.8 EXP −10 ÷ 0.050 =',why:'Rearrange Ksp = [Ag⁺][Cl⁻] to find the [Ag⁺] where Q reaches Ksp.'},
  {id:'mk_cr',f:'Ag₂CrO₄',q:'[Ag⁺] needed to start Ag₂CrO₄',sub:'[Ag⁺]² = Ksp ÷ [CrO₄²⁻], so [Ag⁺] = (1.1 × 10⁻¹² ÷ 0.0050)^0.5',unit:'mol/L',target:Math.sqrt(1.1e-12/0.0050),rel:0.03,hint:'Calculator: ( 1.1 EXP −12 ÷ 0.0050 ) ^ 0.5 =',why:'Ag₂CrO₄ has TWO Ag⁺, so [Ag⁺] is squared in its Ksp. Square root (^0.5) undoes the square.'}];}
function mPlList(){const pl=mohrCurvePts().slice(-1)[0][1]; return [{id:'m_pl',f:'mol Cl⁻',q:'Moles of Cl⁻ from the plateau',sub:`n = m ÷ M = ${(pl/1000).toFixed(4)} g ÷ 143.32 g/mol`,unit:'mol',target:pl/1000/143.32,rel:0.02,hint:`${(pl/1000).toFixed(4)} ÷ 143.32`,why:'Every Cl⁻ ended up in AgCl, so the maximum mass of AgCl tells you how many Cl⁻ there were.'}];}
/* ================= module: Practical 3.1.6 — ethanoic acid in vinegar ================= */
const VBRANDS=[{n:'Home-brand white vinegar',lab:4,c:'teal'},{n:'Premium white vinegar',lab:5,c:'violet'},{n:'Cleaning vinegar',lab:6,c:'orange'}];
const V6PREP=[['Pipette 25.00 mL of vinegar into the 250.0 mL standard flask','Vinegar is too concentrated to titrate directly. Diluting 1 in 10 keeps the titre a sensible size.'],['Half fill with deionised water and shake to mix','Mixing early stops a dense layer of vinegar sitting at the bottom.'],['Add water until the bottom of the meniscus is on the line, then mix thoroughly','Now the flask holds exactly 250.0 mL, so the dilution factor is exactly 10.'],['Using the funnel, fill the burette with the standard NaOH','Then remove the funnel: drips from it would change your reading.'],['Pipette a 20.00 mL aliquot of DILUTED vinegar into a conical flask','An exact, known amount of the diluted vinegar.'],['Add 3 drops of phenolphthalein and put the flask on the white tile','Colourless in acid, pink once all the acid is used. The tile makes the first pink easy to see.']];
Object.assign(QUIZ,{
  v6_what:[{t:'The concentration of NaOH',ok:false,fb:'NaOH is the standard solution: we already know its concentration.'},{t:'The concentration of ethanoic acid in the vinegar',ok:true,fb:'Yes. The NaOH is our measuring tool.'},{t:'The pH of vinegar',ok:false,fb:'We use pH (via the indicator) to spot the end point, but the target is the acid concentration.'}],
  v6_std:[{t:'A solution whose concentration is known accurately',ok:true,fb:'Yes. That is what lets us count the moles of NaOH from its volume.'},{t:'Any solution of 0.1 mol/L',ok:false,fb:'It\'s not about the value. It\'s about knowing it accurately.'},{t:'A solution made with deionised water',ok:false,fb:'Lots of solutions use deionised water. What matters is knowing the concentration precisely.'}],
  v6_wine:[{t:'Vinegar is made by adding acid to wine',ok:false,fb:'No acid is added. Something IN wine turns into the acid.'},{t:'Bacteria oxidise the ethanol in wine to ethanoic acid, turning it into vinegar',ok:true,fb:'Yes. Acetobacter bacteria + oxygen: CH₃CH₂OH + O₂ → CH₃COOH + H₂O. Leave wine open and it sours.'},{t:'Both use grapes, so they are the same thing',ok:false,fb:'The link is chemical: what happens to the ethanol?'}],
  v6_clean:[{t:'NaOH left in the burette can make the tap "freeze" in place',ok:true,fb:'Yes. That\'s step 8: rinse with water, then a little diluted vinegar, then water.'},{t:'It makes the burette pink',ok:false,fb:'Only with indicator. Step 8 gives the real reason.'},{t:'NaOH evaporates and leaves a smell',ok:false,fb:'NaOH isn\'t volatile. Re-read step 8 of the method.'}],
  v6_rel:[{t:'Accuracy: they are close to the true value',ok:false,fb:'Agreeing with EACH OTHER says nothing about the true value. A systematic error would shift them all.'},{t:'Reliability (precision): random errors are small',ok:true,fb:'Yes. Accuracy is judged by comparing with an accepted value, like the label.'},{t:'There were no errors at all',ok:false,fb:'Systematic errors can hide in perfectly concordant results.'}],
  v6_co2:[{t:'Too high',ok:true,fb:'Yes. Weaker NaOH than we assumed → bigger titre → we calculate more moles than really reacted → acid concentration too high.'},{t:'Too low',ok:false,fb:'Follow it through: weaker NaOH means you need MORE of it. What does that do to n = c × V when you use the label concentration?'},{t:'No effect',ok:false,fb:'The calculation uses the labelled concentration, which is now wrong.'}],
  v6_sys:[{t:'Overshooting the end point (dark pink instead of the first faint pink)',ok:true,fb:'Yes. Overshooting every time makes every titre too big: a systematic error that concordance can\'t reveal.'},{t:'Reading the burette to ±0.05 mL',ok:false,fb:'That is random error, reduced by repeating.'},{t:'Doing the rough titration',ok:false,fb:'The rough is left out of the average, so it doesn\'t affect the result.'}]
});
function v6Calc(){const c=concordant(),m=meanOf(c),nN=0.1000*m/1000,cD=nN/0.02000,cU=cD*10,pw=cU*60.05/10;
  return [{id:'v6_mean',f:'Average titre',q:'Q2 · Average titre',sub:`Your three concordant titres: ${c.map(r=>titre(r).toFixed(2)).join(', ')} mL (leave out the rough)`,unit:'mL',target:m,abs:0.011,hint:'Add the concordant titres, divide by how many.',why:'Concordant titres agree, so their average is the best estimate. The rough run overshot, so it stays out.'},
    {id:'v6_nN',f:'mol NaOH',q:'Q3 · Moles of NaOH in the average titre',sub:'n = c × V   (0.1000 mol/L, V in L = mL ÷ 1000)',unit:'mol',target:nN,rel:0.01,hint:'0.1000 × (average ÷ 1000)',why:'We know the concentration (standard solution) and the volume, so c × V counts the moles of NaOH.'},
    {id:'v6_nA',f:'mol CH₃COOH',q:'Q4 · Moles of ethanoic acid in each 20.00 mL aliquot',sub:'CH₃COOH + NaOH → CH₃COONa + H₂O is 1 : 1',unit:'mol',target:nN,rel:0.01,hint:'Same as moles of NaOH.',why:'Ethanoic acid is monoprotic: one CH₃COOH reacts with one NaOH.'},
    {id:'v6_cD',f:'[diluted]',q:'Concentration of the DILUTED vinegar',sub:'c = n ÷ V   (20.00 mL = 0.02000 L)',unit:'mol/L',target:cD,rel:0.01,hint:'moles ÷ 0.02000',why:'Those moles were in the 20.00 mL aliquot of diluted vinegar.'},
    {id:'v6_cU',f:'× 10',q:'Q5 · Concentration of the UNDILUTED vinegar',sub:'25.00 mL was made up to 250.0 mL: dilution factor = 250.0 ÷ 25.00 = 10',unit:'mol/L',target:cU,rel:0.01,hint:'Multiply by 10.',why:'We diluted the vinegar 10 times so we could titrate it. Undo the dilution to get the bottle\'s concentration.'},
    {id:'v6_pw',f:'% w/v',q:'Bonus · Compare with the label (% acidity = g per 100 mL)',sub:'g/L = mol/L × 60.05, then ÷ 10 for g per 100 mL',unit:'%',target:pw,rel:0.01,hint:'× 60.05 ÷ 10',why:'Labels give acidity as grams of ethanoic acid per 100 mL. This lets you judge accuracy against the label.'}]
   .concat(uncSteps('v6u_',m,20.00,{v:0.03/25+0.15/250,t:'the 25.00 mL pipette (±0.03) and 250.0 mL flask (±0.15)',h:'0.03 ÷ 25.00 + 0.15 ÷ 250.0'},cU,'mol/L'));}
function finishV6(){const B=VBRANDS[S.brand],c=concordant(),m=meanOf(c),nN=0.1*m/1000,cD=nN/0.02,cU=cD*10,pw=cU*60.05/10,pct=(0.10/m+0.03/20+0.03/25+0.15/250)*100,qa=id=>{const o=QUIZ[id],a=S.quiz[id]; return a!=null&&o[a].ok?o[a].t:'–';};
  const rinse=[['standard flask','deionised water'],['burette','the standard NaOH solution'],['pipette for the concentrated vinegar','undiluted vinegar'],['pipette for the diluted vinegar','diluted vinegar'],['conical flasks','deionised water']];
  const html=reportShell('Practical 3.1.6: Determination of the ethanoic acid concentration of vinegar','To determine the concentration of ethanoic acid in a sample of white vinegar using a standard solution of sodium hydroxide.',
   `<h4>Variables</h4><ul><li><b>Independent:</b> the vinegar sample (brand).</li><li><b>Dependent:</b> the titre of NaOH (used to calculate the ethanoic acid concentration).</li><li><b>Controlled:</b> NaOH concentration, aliquot volume (20.00 mL), dilution (25.00 mL to 250.0 mL), indicator (3 drops phenolphthalein), end point colour (first permanent pink), temperature.</li></ul>
    <h4>Table 1: Vinegar information</h4><div class="tw"><table><tbody><tr><td>Brand name of vinegar</td><td>${B.n} (label: ${B.lab}% acidity)</td></tr><tr><td>Concentration of NaOH (mol/L)</td><td class="mono">0.1000</td></tr></tbody></table></div>
    <h4>Table 2: Titration results</h4>${tableRuns(S.runs,c)}<p>Concordant titres: ${c.map(r=>titre(r).toFixed(2)).join(', ')} mL.</p>
    ${titrCurveFig(m,'phenolphthalein','Phenolphthalein (8.3–10.0) sits in the steep jump, so it suits a weak acid + strong base titration.')}
    <h4>Analysis</h4><div class="work">1. CH₃COOH(aq) + NaOH(aq) → CH₃COONa(aq) + H₂O(l)
2. Average titre = (${c.map(r=>titre(r).toFixed(2)).join(' + ')}) ÷ ${c.length} = ${m.toFixed(2)} mL
3. n(NaOH) = c × V = 0.1000 × ${(m/1000).toFixed(5)} = ${sci(nN)} mol
4. n(CH₃COOH) = n(NaOH) = ${sci(nN)} mol in each 20.00 mL aliquot
5. c(diluted) = ${sci(nN)} ÷ 0.02000 = ${cD.toFixed(4)} mol/L
   c(undiluted) = ${cD.toFixed(4)} × 10 = ${cU.toFixed(3)} mol/L

function applyQfix(id){const F=QFIX[id],Q=QUIZ[id]; if(!F||!Q||Q._fx||F.length!==Q.length) return; Q.forEach((o,i)=>{o.t=F[i][0]; if(F[i][1]) o.fb=F[i][1];}); Q._fx=1;}

/* ================= drag the proton (H⁺) from the acid to the base ================= */
/* cfg: {atoms:[{x,y,r,t,col,h?:'ok'|'no'}], target:{x,y}, before, after, labels:{acid:[x,y,t], base:[x,y,t]}, charges:[[x,y,t],...], wrong} */
function dragH(id,cfg){const st=wst(id,{done:false,msg:null,tries:0});
  const atom=(a,i)=>{const H=a.t==='H',moved=st.done&&a.h==='ok'&&i===st.mi;
    const x=moved?cfg.target.x:a.x,y=moved?cfg.target.y:a.y;
    return `<g class="atom2 ${a.h&&!st.done?'dragH':''} ${moved?'movedH':''}" ${a.h&&!st.done?`data-dh="${id}" data-i="${i}" role="button" aria-label="hydrogen atom" tabindex="0"`:''} transform="translate(${x} ${y})"><circle r="${a.r}" fill="${a.col}" stroke="var(--edge)" stroke-width="2.5"/><text y="${a.r>18?6:5}">${a.t}</text>${moved?'<text class="plus2" x="13" y="-11">+</text>':''}</g>`;};
  const bonds=(cfg.bonds||[]).map(([a,b])=>{const A=cfg.atoms[a],B=cfg.atoms[b]; if(st.done&&((A.h==='ok'&&a===st.mi)||(B.h==='ok'&&b===st.mi))) return ''; return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" class="bond2"/>`;}).join('')+(st.done?`<line x1="${cfg.target.x}" y1="${cfg.target.y}" x2="${cfg.target.bx}" y2="${cfg.target.by}" class="bond2 newb"/>`:'');
  const lp=st.done?'':`<g class="lpair"><circle cx="${cfg.target.x-6}" cy="${cfg.target.y}" r="3.5"/><circle cx="${cfg.target.x+6}" cy="${cfg.target.y}" r="3.5"/><circle cx="${cfg.target.x}" cy="${cfg.target.y}" r="20" class="tz"/></g>`;
  const ch=st.done?(cfg.charges||[]).map(([x,y,t])=>`<text class="chg" x="${x}" y="${y}">${t}</text>`).join(''):'';
  const lab=st.done?Object.values(cfg.labels).map(([x,y,t,c])=>`<text class="lab2" x="${x}" y="${y}" fill="var(--${c})">${t}</text>`).join(''):'';
  return `<div class="dragbox"><svg viewBox="0 0 360 190" class="dragsvg" id="dsv_${id}">${bonds}${lp}${cfg.atoms.map(atom).join('')}${ch}${lab}</svg>
   <div class="eqn" style="font-size:1rem">${st.done?cfg.after:cfg.before}</div>
   ${st.done?'':`<div class="do dragzone" data-dz="${id}"><span class="verb">Drag</span><span>${cfg.ask}</span></div>`}
   ${st.msg?`<p class="toastline ${st.done?'good':'bad'}">${st.msg}</p>`:''}</div>`;}
function bindDragH(id,cfg){const svg=$('dsv_'+id); if(!svg) return; const st=wst(id);
  svg.querySelectorAll(`[data-dh="${id}"]`).forEach(g=>{
    const i=+g.dataset.i,a=cfg.atoms[i]; let dragging=false;
    const pt=e=>{const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());};
    g.addEventListener('pointerdown',e=>{dragging=true; g.setPointerCapture&&g.setPointerCapture(e.pointerId); g.classList.add('grab'); e.preventDefault();});
    g.addEventListener('pointermove',e=>{if(!dragging) return; const p=pt(e); g.setAttribute('transform',`translate(${p.x} ${p.y})`);});
    const end=e=>{if(!dragging) return; dragging=false; g.classList.remove('grab'); let p; try{p=pt(e);}catch(_){p={x:a.x,y:a.y};}
      const d=Math.hypot(p.x-cfg.target.x,p.y-cfg.target.y); st.tries++;
      if(d<34&&a.h==='ok'){st.done=true; st.ok=true; st.mi=i; st.msg=cfg.win; st.tries===1?right(15,'proton moved'):award(5,'proton moved');}
      else if(d<34){st.msg=cfg.wrong; wrong();}

      renderCard(true);};
    g.addEventListener('pointerup',end); g.addEventListener('pointercancel',()=>{dragging=false; renderCard(true);});

/* ================= worked example with self-explanation prompts ================= */
/* lines: [{s:'the step', o:[[reason,true],[reason,false],...]}] — the student explains each step before the next appears */
function weW(id,title,lines){const st=wst(id,{k:0,miss:0,msg:null}),k=st.k;
  const shown=lines.slice(0,Math.min(k+1,lines.length)).map((L,i)=>{const done=i<k,ord=quizOrder(id+i,L.o);
    return `<div class="wl ${done?'done':'now'}"><div class="ws"><span class="wn">${i+1}</span><span>${L.s}</span></div>${done?`<div class="wr">✓ ${L.o.find(x=>x[1])[0]}</div>`:`<div class="wq">Why this step?</div><div class="wopts">${ord.map(j=>`<button type="button" class="opt" data-we="${id}" data-j="${j}">${L.o[j][0]}</button>`).join('')}</div>`}</div>`;}).join('');
  return `<div class="wex"><div class="wt"><span class="verb">Worked example</span><b>${title}</b></div>${shown}${st.msg?`<p class="toastline bad">${st.msg}</p>`:''}${k>=lines.length?'<p class="toastline good">You explained every step. That\'s how experts read a solution.</p>':''}</div>`;}
function bindWe(id,lines){document.querySelectorAll(`[data-we="${id}"]`).forEach(b=>b.addEventListener('click',()=>{const st=wst(id),L=lines[st.k],ok=L.o[+b.dataset.j][1];
  if(ok){st.k++; st.msg=null; blip('ok'); award(3); if(st.k>=lines.length){st.ok=true; st.tries=st.miss?2:1; st.miss?award(5,'explained'):right(15,'explained it all');}}
  else {st.miss++; st.msg='Not that one. Look at what the line actually DOES.'; wrong();} renderCard(true);}));}

/* ================= predict first (predict–observe–explain) ================= */
function predW(id,q,opts){const st=wst(id,{p:null}); if(st.p!=null) return `<div class="predchip">You predicted: <b>${opts[st.p]}</b></div>`;
  return `<div class="pred" data-pred="${id}"><div class="wt"><span class="verb">Predict</span><b>${q}</b></div><p class="muted" style="margin:0;font-size:.82rem">No marks for this. A guess makes your brain notice the answer.</p><div class="wopts">${opts.map((o,i)=>`<button type="button" class="opt" data-pr2="${id}" data-i="${i}">${o}</button>`).join('')}</div></div>`;}
const predDone=id=>S.w&&S.w[id]&&S.w[id].p!=null;
function predVerdict(id,good,opts){const st=S.w&&S.w[id]; if(!st||st.p==null) return ''; return st.p===good?`<p class="toastline good">Your prediction was right.</p>`:`<p class="toastline info">You predicted "${opts[st.p]}". The result surprised you, which is exactly when learning sticks. Notice WHY it happened.</p>`;}
function bindPred(){document.querySelectorAll('[data-pr2]').forEach(b=>b.addEventListener('click',()=>{const st=wst(b.dataset.pr2); st.p=+b.dataset.i; st.ok=true; award(2); blip('tap'); renderCard(true);}));}

function mixState(){PROG.mix=PROG.mix||{items:{},days:[],sessions:0}; return PROG.mix;}
function mixDue(){const M=mixState(),now=Date.now(); return MIXB.filter(b=>M.items[b.id]&&M.items[b.id].due<=now).length;}
function buildMix(){const M=mixState(),now=Date.now(),score=b=>{const r=M.items[b.id]; if(!r) return 1e12+Math.random()*1e6; return (r.due<=now?0:r.due-now)+Math.random()*1e3;};
  const pool=MIXB.slice().sort((a,b)=>score(a)-score(b)),out=[]; let last='';
  while(out.length<8&&pool.length){let k=pool.findIndex(b=>b.t!==last); if(k<0) k=0; const b=pool.splice(k,1)[0]; out.push({id:b.id,p:Math.random()}); last=b.t;}
  return out;}
const mixItem=it=>MIXB.find(b=>b.id===it.id);
function mixRecord(it,ok){const M=mixState(),r=M.items[it.id]||{box:0,n:0,right:0}; r.n++; if(ok){r.right++; r.box=Math.min(5,r.box+1);} else r.box=0; r.due=Date.now()+MIX_DAYS[r.box]*DAY+(ok?0:10*60e3); M.items[it.id]=r; save();}

    {id:'dC2',f:'Kb',q:'Kb of CH₃COO⁻',sub:'Kb = Kw ÷ Ka = 1.0 × 10⁻¹⁴ ÷ 1.8 × 10⁻⁵',unit:'',target:Kb,rel:0.04,hint:'1 EXP −14 ÷ 1.8 EXP −5 =',why:'CH₃COO⁻ is the conjugate base, so Ka × Kb = Kw.'},
    {id:'dC3',f:'[OH⁻]',q:'[OH⁻] (same RICE trick, for a base)',sub:'[OH⁻] = √(Kb × [A⁻])',unit:'mol/L',target:oh,rel:0.04,hint:'( your Kb × 0.0500 ) ^ 0.5 =',why:'CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻ is just a weak base reacting. Kb is tiny, so [A⁻]eq ≈ 0.0500.'},

const GLOSS=[['Titrant','The solution of known concentration. Goes in the burette.'],['Analyte','The solution you\'re finding the concentration of. Goes in the flask.'],['Standard solution','A solution whose concentration is known accurately.'],['Aliquot','An exactly measured portion, delivered by a pipette.'],['Indicator','A dye that changes colour over a small pH range.'],['End point','When the indicator changes colour.'],['Equivalence point','When reactants have been mixed in exactly the ratio in the equation.'],['Titre','Volume of titrant added: end reading − start reading.'],['Concordant titres','Titres within 0.10 mL of each other.'],['Meniscus','The curved liquid surface. Read the bottom of it.'],['Titration curve','A graph of pH against volume of titrant added.'],['pKa','A measure of weak acid strength; equals the pH at half-equivalence.'],['Buffer region','The flat part of a weak acid curve where pH barely changes.'],['Conductivity','How easily a solution carries electric current, due to its ions.'],['Back titration','Add a known excess, react, then titrate what\'s left over.'],['Redox titration','A titration based on electron transfer, like iodine and vitamin C.'],['% uncertainty','Absolute uncertainty ÷ measured value × 100. Add them when multiplying or dividing.'],['Systematic error','An error that pushes every result the same way.'],['Random error','Unpredictable scatter in results; reduced by repeating.']];

function modProgress(m){

  if(m==='curve') return ['c_sasb','c_wasb','c_sawb'].map(k=>`<span class="ck ${PROG.curve.combos[k]?'done':''}">${PROG.curve.combos[k]?'✓ ':''}${CHEM[k].short}</span>`).join('');

let ANS=0,lastCalcInput=null;
function cparse(str){const s=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,''); let i=0;
  const num=()=>{const m=/^(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?/.exec(s.slice(i)); if(!m) throw new Error('syntax'); i+=m[0].length; return parseFloat(m[0]);};
  const prim=()=>{if(s[i]==='('){i++; const v=expr(); if(s[i]!==')') throw new Error('syntax'); i++; return v;} if(s.slice(i,i+3)==='Ans'){i+=3; return ANS;} if(s.slice(i,i+4)==='log('){i+=4; const v=expr(); if(s[i]!==')') throw new Error('syntax'); i++; return Math.log10(v);} return num();};
  const pow=()=>{const b=prim(); if(s[i]==='^'){i++; return Math.pow(b,unary());} return b;};
  const unary=()=>{if(s[i]==='-'){i++; return -unary();} if(s[i]==='+'){i++; return unary();} return pow();};
  const term=()=>{let v=unary(); while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=unary(); v=o==='*'?v*r:v/r;} return v;};
  const expr=()=>{let v=term(); while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=term(); v=o==='+'?v+r:v-r;} return v;};
  const v=expr(); if(i!==s.length||!isFinite(v)) throw new Error('syntax'); return v;}
const fmtC=v=>{const a=Math.abs(v); if(v===0) return '0'; return (a<1e-3||a>=1e6)?v.toExponential(4).replace('e',' × 10^'):String(+v.toPrecision(6));};
const plainC=v=>{const a=Math.abs(v); return (a<1e-3||a>=1e6)?v.toExponential(5):String(+v.toPrecision(7));};
function renderCalcPanel(){const p=$('calcPanel'); if(p.dataset.ready) return; p.dataset.ready='1';
  const keys=['7','8','9','÷','(','4','5','6','×',')','1','2','3','−','^','0','.','EXP','+','⌫','C','Ans','log','='];
  p.innerHTML=`<div class="row chead" style="justify-content:space-between"><h3>Calculator</h3><span class="muted cexp" style="font-size:.78rem;font-weight:700">EXP = × 10^</span><button class="btn small ctog" type="button" id="cTog"></button></div>
   <div class="cdisp"><input id="cExpr" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1000 × 19.70 ÷ 1000" aria-label="Calculation"><div class="res mono" id="cRes">0</div></div>
   <div class="ckeys">${keys.map(k=>`<button type="button" data-k="${k}" class="${'÷×−+^()'.includes(k)&&k.length===1?'op':''}${k==='='?' eq':''}">${k}</button>`).join('')}</div>
   <div class="row"><button class="btn go small" id="cUse" type="button">Put answer in the box ↓</button></div>
   <p class="muted" style="font-size:.78rem;font-weight:600">2.5 × 10⁻³ is typed 2.5 EXP −3. Ans reuses your last result. log( is log base 10: pKa = −log(Ka).</p>`;
  $('cTog').textContent=G.calcOpen?'Hide ▴':'Show ▾'; $('cTog').addEventListener('click',()=>{G.calcOpen=!G.calcOpen; $('main').classList.toggle('calcmin',!G.calcOpen); $('cTog').textContent=G.calcOpen?'Hide ▴':'Show ▾'; save();});
  const ex=$('cExpr'),res=$('cRes'),calc=()=>{try{ANS=cparse(ex.value.replace(/E/g,'e')); res.textContent=fmtC(ANS);}catch(_){res.textContent='Check the sum';}};
  p.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k; if(k==='C'){ex.value=''; res.textContent='0';} else if(k==='⌫') ex.value=ex.value.slice(0,-1); else if(k==='=') calc(); else if(k==='EXP') ex.value+='E'; else if(k==='log') ex.value+='log('; else ex.value+=k; blip('tap');}));
  ex.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); calc();}});
  $('cUse').addEventListener('click',()=>{const t=(lastCalcInput&&lastCalcInput.isConnected&&!lastCalcInput.readOnly)?lastCalcInput:document.querySelector('#mbody .step:not(.ok) input'); if(!t){floatMsg('No answer box open'); return;} t.value=plainC(ANS); t.dispatchEvent(new Event('input',{bubbles:true})); t.focus();});}

/* ================= layout mode with hysteresis ================= */
/* layout follows the window SHAPE: landscape = wide two-column layout, portrait = phone layout */
function layoutMode(){const w=innerWidth,h=innerHeight,app=document.querySelector('.app'),n=app.classList.contains('narrow');
  let to=n; if(!n&&h>w*1.02) to=true; else if(n&&w>h*1.02) to=false; if(to===n) return;
  app.classList.toggle('narrow',to); try{if(S&&S.mod) renderAll();}catch(_){}}
addEventListener('resize',layoutMode); layoutMode();

/* ================= boot ================= */
function overlay(title,html){$('ovTitle').textContent=title; $('ovBody').innerHTML=html; $('shelf').hidden=false;}
$('badgeBtn').addEventListener('click',()=>overlay('Badges',badgesHTML()));
$('wordsBtn').addEventListener('click',()=>overlay('Word list',`<div class="terms">${GLOSS.map(([t,d])=>`<div class="term"><b>${t}</b><span>${d}</span></div>`).join('')}</div>`));
$('ovClose').addEventListener('click',()=>$('shelf').hidden=true);
$('shelf').addEventListener('click',e=>{if(e.target.id==='shelf') $('shelf').hidden=true;});
$('soundBtn').addEventListener('click',()=>{G.sound=!G.sound; renderHUD(); save(); blip('ok');});
$('homeBtn').addEventListener('click',goHub);
const stageRect=()=>$('stage').getBoundingClientRect();
$('zIn').addEventListener('click',()=>{const r=stageRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1.35);});
$('zOut').addEventListener('click',()=>{const r=stageRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.35);});
$('zFit').addEventListener('click',()=>{V={...VB0}; applyV();});
addEventListener('resize',()=>{if(S&&S.mod!=='hub'){const st=STEP(); if(st.live) st.live();}});
loadSave(); freshState('hub'); applyV(); renderAll();
})();
