<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Titration Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen app. HUD on top, then the lab bench (an interactive SVG scene you drag things around in) and the mission card. Phones: bench above, card below, both visible at once; the card scrolls on its own and keeps Continue pinned. Palette = indicator colour spectrum. */
:root{
  --bg:#f5f2ff; --surface:#ffffff; --surface-2:#f0ecfb; --ink:#1d1636; --muted:#6b6489; --line:#e2dbf5; --edge:#1d1636;
  --pink:#ff2e88; --pink-soft:#ffe0ee; --orange:#ff8a1f; --orange-soft:#ffe9d4; --yellow:#ffcf2e; --yellow-soft:#fff4c9;
  --blue:#2f74ff; --blue-soft:#dde8ff; --teal:#00b89c; --teal-soft:#d6f6ef; --violet:#7a4cff; --violet-soft:#e9e0ff; --red:#ff4561; --red-soft:#ffe1e6;
  --glass:#8e86b3; --glass-fill:rgba(220,212,250,.35); --liquid:rgba(150,195,245,.55); --tile:#ffffff; --tile-edge:#cfc7ea; --steel:#a9a2c6; --bench:#e7e0fb; --wood:#d9cff6;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#130f22; --surface:#1d1733; --surface-2:#271f42; --ink:#f4f0ff; --muted:#a79fc9; --line:#352b57; --edge:#5b4c93;
  --pink:#ff4b9b; --pink-soft:#3d1830; --orange:#ff9a3d; --orange-soft:#3a2513; --yellow:#ffd84d; --yellow-soft:#37301a;
  --blue:#5b92ff; --blue-soft:#18264a; --teal:#2ed3b6; --teal-soft:#0f342e; --violet:#9b78ff; --violet-soft:#2a1f4f; --red:#ff6b80; --red-soft:#3d1820;
  --glass:#a59cd0; --glass-fill:rgba(160,150,210,.12); --liquid:rgba(120,170,240,.38); --tile:#ece8f8; --tile-edge:#a69ccc; --steel:#6a6191; --bench:#221a3c; --wood:#3a2f60;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#130f22; --surface:#1d1733; --surface-2:#271f42; --ink:#f4f0ff; --muted:#a79fc9; --line:#352b57; --edge:#5b4c93;
  --pink:#ff4b9b; --pink-soft:#3d1830; --orange:#ff9a3d; --orange-soft:#3a2513; --yellow:#ffd84d; --yellow-soft:#37301a;
  --blue:#5b92ff; --blue-soft:#18264a; --teal:#2ed3b6; --teal-soft:#0f342e; --violet:#9b78ff; --violet-soft:#2a1f4f; --red:#ff6b80; --red-soft:#3d1820;
  --glass:#a59cd0; --glass-fill:rgba(160,150,210,.12); --liquid:rgba(120,170,240,.38); --tile:#ece8f8; --tile-edge:#a69ccc; --steel:#6a6191; --bench:#221a3c; --wood:#3a2f60;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;font-weight:500;overflow:hidden;
  padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-block:0}
.app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;gap:8px;padding-bottom:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:clamp(1.15rem,3.6vw,1.6rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:600}
p{margin:0;max-width:60ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:8px;padding-block:8px 6px;border-bottom:2px solid var(--line)}
.logo{font-family:var(--f-display);font-weight:800;font-size:.95rem;letter-spacing:-.02em;white-space:nowrap}
.logo i{font-style:normal;color:var(--pink)}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvl .name{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .name b{color:var(--ink)}
.xpbar{height:11px;border-radius:99px;background:var(--surface-2);border:2px solid var(--edge);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow));transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.pill{display:flex;align-items:center;gap:4px;font-weight:800;font-family:var(--f-mono);font-size:.85rem;padding:4px 8px;border-radius:99px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.hot{background:var(--orange);color:#fff}
button.pill{cursor:pointer}
@media (max-width:600px){.logo{display:none}}

/* map (wide screens) */
.map{flex:none;overflow-x:auto;scrollbar-width:none}
.map-in{display:flex;align-items:center;gap:5px;min-width:max-content;padding:2px}
.node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.72rem;border:2px solid var(--line);background:var(--surface);color:var(--muted);flex:none}
.node.done{background:var(--c);border-color:var(--c);color:#fff}
.node.now{border:3px solid var(--c);color:var(--ink);animation:pulse 1.6s infinite}
.link{width:10px;height:3px;background:var(--line);border-radius:2px;flex:none}
.link.done{background:var(--c)}
.wlabel{font-family:var(--f-display);font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c);padding:0 3px 0 8px;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.app.narrow .map{display:none}
.mini-prog{display:none;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:none}
.mini-prog i{display:block;height:100%;background:var(--wc,var(--pink));transition:width .4s}
.app.narrow .mini-prog{display:block}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.main.solo{grid-template-columns:minmax(0,640px);justify-content:center}
.main.solo .stage{display:none}
.main.solo{grid-template-rows:minmax(0,1fr)}
.app.narrow .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr)}
.app.narrow .main.solo{grid-template-rows:minmax(0,1fr)}
.main.calcmode .stage{display:none}
#calcPanel{display:none;min-height:0;background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--edge);padding:12px;flex-direction:column;gap:8px;overflow:auto}
.main.calcmode #calcPanel{display:flex}
.cdisp{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:14px;padding:8px 10px}
.cdisp input{font-family:var(--f-mono);font-size:1rem;font-weight:700;border:0;background:transparent;color:var(--ink);width:100%;outline:none;text-align:right}
.cdisp .res{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;text-align:right;min-height:1.6em;overflow-x:auto;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ckeys button{border:2px solid var(--edge);border-radius:12px;padding:9px 0;font-family:var(--f-mono);font-weight:700;font-size:.95rem;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge);cursor:pointer}
.ckeys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.ckeys .op{background:var(--violet-soft)}
.ckeys .eq{background:var(--pink);color:#fff;grid-column:span 2}
.app.narrow .ckeys button{padding:6px 0;font-size:.85rem}
.app.narrow #calcPanel{padding:8px;gap:6px}
.ctog{display:none}
.app.narrow .ctog{display:inline-flex}
.app.narrow .main.calcmode.calcmin{grid-template-rows:auto minmax(0,1fr)}
.app.narrow .main.calcmode.calcmin #calcPanel > :not(.chead){display:none}
.app.narrow .main.calcmode.calcmin .cexp{display:none}
.app.narrow .main.calcmode #calcPanel .chead h3{font-size:1rem;margin:0}
.stage{min-height:0;background:var(--bench);border:2px solid var(--line);border-radius:22px;position:relative;overflow:hidden;touch-action:none}
.stage svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.item{cursor:default}
.item.can{cursor:grab}
.item.can > .hit{animation:glow 1.3s ease-in-out infinite}
.item.tap{cursor:pointer}
.item.tap > .hit{animation:glow 1.6s ease-in-out infinite}
.item .hit{fill:transparent;stroke:var(--yellow);stroke-width:0;rx:8}
@keyframes glow{50%{stroke-width:4}}
.zone{fill:color-mix(in srgb,var(--teal) 15%,transparent);stroke:var(--teal);stroke-width:2.5;stroke-dasharray:6 5;animation:march 1s linear infinite}
.zone.hot{fill:color-mix(in srgb,var(--teal) 35%,transparent);stroke-width:4}
@keyframes march{to{stroke-dashoffset:-22}}
.callout rect{fill:var(--ink)} .callout text{fill:var(--bg);font-family:Figtree, sans-serif;font-weight:800}

.zctl{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center;z-index:3}
.zctl button{width:32px;height:32px;border-radius:10px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:800;font-size:1rem;box-shadow:0 2px 0 var(--edge);cursor:pointer;padding:0}
#zoomPct{font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:var(--muted)}
.pop{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edge);padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;max-height:calc(100% - 56px);overflow:auto;animation:popin .28s cubic-bezier(.3,1.5,.5,1)}
.pop[hidden]{display:none}
.pop .art{width:76px;height:100px;background:var(--c-soft);border-radius:12px;display:grid;place-items:center}
.pop .art svg{width:66px;height:92px}
.pop .txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.pop h3{font-size:1.05rem}
.pop .lbl{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.pop p{font-size:.88rem;font-weight:600}
.pop .tip{background:var(--yellow-soft);border-radius:10px;padding:6px 8px;font-size:.84rem}
@keyframes popin{from{transform:translateY(24px) scale(.94);opacity:0}}
.tilt{display:flex;align-items:center;gap:10px;font-weight:800}
.tilt input{flex:1;accent-color:var(--pink);height:28px}
.use{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:var(--c-soft);border-radius:18px;padding:12px;border:2px solid var(--c);touch-action:pan-y;user-select:none}
.use-art svg{width:96px;height:96px;display:block}
.use b{font-family:var(--f-display);font-size:1.02rem;line-height:1.2}
.use .lbl{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.use p{font-size:.92rem;font-weight:600;margin-top:4px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--muted)}
.dots i.cur{background:var(--pink);transform:scale(1.35)}
.idea{display:flex;align-items:center;justify-content:center;gap:18px}
.idea svg{width:150px;height:auto}
.dropcount{display:flex;flex-direction:column;align-items:center}
.dropcount b{font-size:2.6rem;line-height:1;color:var(--pink)}
.dropcount span{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:.7rem;letter-spacing:.07em}
/* mission card */
.mission{min-height:0;background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--edge);display:flex;flex-direction:column;position:relative;overflow:hidden}
.mission::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--wc,var(--pink));z-index:2}
.mbody{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.mfoot{flex:none;padding:10px 16px 12px;border-top:2px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:10px;background:var(--surface)}
.mfoot:empty{display:none}
.kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagw{font-family:var(--f-display);font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:99px;background:var(--wc);color:#fff}
.xpchip{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--muted)}
.lead{font-size:1.05rem;font-weight:700}
.do{display:flex;gap:10px;align-items:center;background:var(--yellow-soft);border-radius:14px;padding:10px 12px;font-weight:800}
.do .verb{font-family:var(--f-display);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:#1d1636;border-radius:99px;padding:3px 8px;flex:none}
.btn{border:2px solid var(--edge);border-radius:14px;padding:10px 14px;font-weight:800;font-size:.92rem;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--edge);cursor:pointer;transition:transform .06s,box-shadow .06s;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--pink);color:#fff}
.btn.big{font-size:1rem;padding:12px 20px;border-radius:16px}
.btn.hold{background:var(--violet);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn.hold.on{background:var(--pink);transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gate{font-size:.85rem;color:var(--muted);font-weight:700;margin-right:auto}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--edge);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--edge);cursor:pointer;font-weight:700}
.opt.right{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.opt.locked{pointer-events:none}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.25}
.toastline{font-weight:700;padding:9px 12px;border-radius:14px}
.toastline.good{background:var(--teal-soft);color:var(--teal)}
.toastline.bad{background:var(--red-soft);color:var(--red)}
.toastline.info{background:var(--surface-2)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.whybtn{border:2px dashed var(--violet);color:var(--violet);background:transparent;border-radius:99px;padding:4px 12px;font-weight:800;font-size:.8rem;cursor:pointer;align-self:flex-start}
.whytxt{background:var(--violet-soft);border-radius:14px;padding:9px 12px;font-size:.92rem;border-left:5px solid var(--violet)}
.newword{display:flex;gap:8px;align-items:baseline;background:var(--blue-soft);border-radius:14px;padding:9px 12px;font-size:.92rem}
.newword b{font-family:var(--f-display);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;background:var(--blue);color:#fff;border-radius:99px;padding:3px 8px;flex:none}
.info-card{border-radius:16px;padding:12px;background:var(--c-soft,var(--surface-2));display:flex;flex-direction:column;gap:4px;border-left:6px solid var(--c,var(--violet))}
.info-card b{font-family:var(--f-display);font-size:1rem}
.counter{font-family:var(--f-mono);font-weight:700;font-size:.85rem;background:var(--surface-2);border-radius:99px;padding:3px 10px;align-self:flex-start}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.ck.done{background:var(--teal-soft);color:var(--teal)}
.ck.now{background:var(--yellow-soft);color:var(--ink)}

.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.match .colm{display:flex;flex-direction:column;gap:7px}
.mt{border:2px solid var(--edge);border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--ink);text-align:left;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--edge);min-height:46px;font-size:.84rem}
.mt.term{font-family:var(--f-display);font-size:.8rem;font-weight:600}
.mt.sel{background:var(--yellow);color:#1d1636}
.mt.ok{background:var(--c);color:#fff;border-color:var(--c);box-shadow:none;cursor:default}
.mt.bad{background:var(--red-soft);border-color:var(--red)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.choice{text-align:left;border:2px solid var(--edge);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 0 var(--edge)}
.choice .band{height:44px;background:var(--c);display:flex;align-items:flex-end;justify-content:space-between;padding:7px 10px;color:#fff;font-family:var(--f-display);font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.choice .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.choice b{font-family:var(--f-display);font-size:.86rem;font-weight:600;line-height:1.2}
.choice small{color:var(--muted);font-weight:600}
.choice[aria-pressed="true"]{outline:4px solid var(--c);outline-offset:2px}
.rdrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.rd{width:110px;font-family:var(--f-mono);font-size:1.1rem;font-weight:700;padding:9px 10px;border:2px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink);text-align:right}
.unit{font-size:.88rem;color:var(--muted);font-weight:700}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rule{border-radius:12px;padding:8px;font-weight:700;font-size:.82rem;display:flex;flex-direction:column;gap:2px;background:var(--c-soft)}
.rule b{font-family:var(--f-display);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ctrl{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);padding:10px;border-radius:16px}
.coach{font-weight:800;display:flex;gap:8px;align-items:center;font-size:.92rem}
.coach::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pink);flex:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.rating{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:3px;color:#fff;background:var(--c)}
.rating .r{font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.rating p{font-weight:600;color:#fff}
.pips{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.9rem}
.pip{width:24px;height:24px;border-radius:50%;border:3px solid var(--teal);display:grid;place-items:center;color:#fff;font-size:.75rem;flex:none}
.pip.on{background:var(--teal)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;cursor:pointer}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.86rem}
th,td{text-align:left;padding:5px 6px;border-bottom:2px solid var(--line)}
th{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
td.num,th.num{text-align:right}
td.mono{font-weight:700}
.chip{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:var(--teal);color:#fff;text-transform:uppercase}
.chip.rough{background:var(--surface-2);color:var(--muted)}
.chip.dim{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.step{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:10px;border:2px solid var(--line);border-radius:14px}
.step .q{font-family:var(--f-display);font-weight:600;font-size:.9rem}

.score{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:48px;height:48px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.stat div{border-radius:14px;padding:8px;background:var(--c-soft);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:1.1rem;color:var(--c)}
.stat span{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.badge{border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:2px solid var(--line);background:var(--surface)}
.badge .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800}
.badge b{font-family:var(--f-display);font-size:.66rem;font-weight:600;line-height:1.2}
.badge small{font-size:.68rem;color:var(--muted);font-weight:600;line-height:1.2}
.badge.locked{opacity:.45}
.badge.locked .ico{background:var(--line);color:var(--muted)}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:min(170px,45%);height:auto}
canvas.curve{width:100%;height:150px;display:block}

#floaters{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40}
.float{font-family:var(--f-display);font-weight:800;font-size:.95rem;padding:7px 13px;border-radius:99px;background:var(--ink);color:var(--bg);animation:pop 1.6s ease-out forwards}
.float.pink{background:var(--pink);color:#fff}
@keyframes pop{0%{transform:translateY(10px) scale(.8);opacity:0}15%{transform:translateY(0) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translateY(-24px);opacity:0}}
#unlock{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-180%);z-index:45;background:var(--surface);border:2px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:10px 14px;display:flex;align-items:center;gap:12px;width:min(400px,calc(100% - 24px));transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#unlock.show{transform:translate(-50%,0)}
#unlock .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;flex:none}
#unlock b{font-family:var(--f-display);display:block;font-size:.95rem}
#unlock small{color:var(--muted);font-weight:700}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,6,25,.55);display:grid;place-items:center;padding:16px}
.overlay .panel{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:16px;max-width:620px;width:100%;max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.term{border-radius:12px;padding:9px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.term b{font-family:var(--f-display);font-size:.82rem;font-weight:600}
.term span{font-size:.86rem;color:var(--muted);font-weight:600}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.drop{animation:fall .38s ease-in forwards}
@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--fall,40px));opacity:.6}}
.flash{animation:fade 1s ease-out forwards}
@keyframes fade{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}

.strip{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;font-weight:700}

.bars{display:flex;flex-direction:column;gap:8px}

.mbody{overflow-anchor:none}

.acid{display:flex;flex-direction:column;gap:6px}

.itube{width:64px;height:156px;display:block}

.idots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:260px}

.sbar{display:flex;height:30px;border-radius:15px;overflow:hidden;border:2px solid var(--edge)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.strip2{height:46px;border-radius:12px;border:2px solid var(--edge)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--muted);margin-top:-4px}
.slab{display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:.9rem}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.dtab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.missions{display:grid;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--edge);border-radius:16px;padding:10px 12px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--edge);cursor:pointer;border-left:10px solid var(--c)}

.mcard .mct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.mcard .mct b{font-family:var(--f-display);font-size:1rem}.mcard .mct small{color:var(--muted);font-weight:600}

.mcard.done{background:var(--surface-2)}
.sorter{display:grid;gap:8px}
.srow{border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--surface)}

.sitem{font-family:var(--f-display);font-weight:800;font-size:1rem;flex:1 1 7em;min-width:0}
.sbins{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 220px;justify-content:flex-end}
.sbin{border:2px solid var(--edge);border-radius:10px;padding:6px 9px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.82rem;cursor:pointer;touch-action:manipulation}

.sfb{flex-basis:100%;font-weight:700;color:var(--red);font-size:.82rem}
.req{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:10px 6px;border-radius:14px;background:var(--surface-2)}

.rolebox,.xbox,.build{display:grid;gap:8px}
.rchip,.xchip,.pchip{border:2px solid var(--edge);border-radius:12px;padding:6px 10px;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.02rem;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;box-shadow:0 3px 0 var(--edge);touch-action:manipulation}

.r-A{background:var(--pink)!important;color:#fff!important}.r-CB{background:var(--pink-soft)!important;color:var(--ink)!important;border-color:var(--pink)!important}
.r-B{background:var(--blue)!important;color:#fff!important}.r-CA{background:var(--blue-soft)!important;color:var(--ink)!important;border-color:var(--blue)!important}

.rask{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700}

.mlog{display:flex;flex-wrap:wrap;gap:6px}.mlog span{font-weight:800;font-size:.82rem;padding:3px 8px;border-radius:8px;background:var(--teal-soft)}
.ordl{display:grid;gap:8px}

.blabel{font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--violet)}

.bopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.bchip[aria-pressed="true"]{background:var(--violet);color:#fff}.bchip.good{background:var(--teal)!important;color:#fff}.bchip.bad{background:var(--red-soft)!important;color:var(--red);border-color:var(--red)}
.passer{display:grid;gap:10px}

.plabels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.plab{width:200px;max-width:100%;height:auto;display:block}

function pHat(vb){

  else if(t==='soda'){const Ct=(Ca+(S.cit||0))*AV()/Vt,Np=3*(S.cit||0)*AV()/Vt,Na=Cb*vb/Vt,Cc=(S.co2||0)*0.10*AV()/Vt,K1=7.41e-4,K2=1.74e-5,K3=3.98e-7,k1=4.47e-7,k2=4.68e-11;

  else if(t==='bw'){const N=Ca*AV()/Vt,Cl=Cb*vb/Vt,K=5.6e-10; f=h=>h+N*h/(h+K)-Kw/h-Cl;}
  else if(t==='bwa'){const Na=Ca*AV()/Vt,A=Cb*vb/Vt,Ka=1.75e-5; f=h=>h+Na-Kw/h-A*Ka/(h+Ka);}

function kappa(vb){

}
function colourAt(vb,k){

function bindReading(){const el=$('rdIn'); if(!el) return; el.addEventListener('keydown',e=>{if(e.key==='Enter') submitReading();}); $('rdBtn').addEventListener('click',submitReading);}
function submitReading(){
  const el=$('rdIn'),r=run(),isInit=el.dataset.which==='init',raw=el.value.trim(); if(!raw) return; S.lastRaw=raw;
  if(!/^\d{1,2}\.\d{2}$/.test(raw)){S.readMsg={ok:false,t:'Use 2 decimal places, like 0.85 or 23.40.'}; renderCard(true); shake($('rdIn')); return;}
  const val=parseFloat(raw),truth=isInit?r.init:r.final,d=val-truth; S.readTries++;
  if(Math.abs(d)<=0.0501){
    if(!isInit&&val<r.eInit){S.readMsg={ok:false,t:'End has to be bigger than start. The scale counts downwards.'}; renderCard(true); return;}
    const first=S.readTries===1; S.lastRaw=''; S.readTries=0; S.readMsg={ok:true};
    if(isInit){r.eInit=val; r.state='titrating';} else {r.eFinal=val; r.state='done'; S.runFb=endpointFeedback(r);}
    right(first?15:5,first?'sharp eye':'reading'); if(first) badge('eye'); if(r.state==='done') rateRun(r); renderAll(); return;}
  wrong(); let hint='Not quite. Bottom of the curve, and the numbers get bigger going down.';
  if(Math.abs(d)<0.16) hint='So close! Count the little 0.10 lines again.';
  else if(Math.abs(d)>=0.8&&Math.abs(d)<=1.2) hint='Off by about 1. Which big number is just above the curve?';
  else {const lo=Math.floor(truth),fr=truth-lo; if(Math.abs(val-(lo+1-fr))<0.06) hint='You counted the wrong way. Numbers get BIGGER going DOWN.';}
  S.readMsg={ok:false,t:hint}; renderCard(true); shake($('rdIn'));
}
function endpointFeedback(r){if(r.label==='Calibration'){const dr=Math.floor((r.final-r.init)/(S.trueDrop||0.05)); S.calDrops=dr; return {r:'MEASURED',c:'teal',t:`${dr} drops counted for ${titre(r).toFixed(2)} mL from the burette.`,xp:10};}
  const tt=r.final-r.init,exp=expectedTitre(r.ind),d=tt-exp,drops=Math.round(Math.abs(d)/0.05);
  if(r.label==='Rough') return {r:d>1?'ROUGH: WAY OVER':'SPEED RUN DONE',c:'orange',t:d>1?`Rough titre ${titre(r).toFixed(2)} mL, but you went well past the colour change. Treat it as a maximum.`:`Rough titre ${titre(r).toFixed(2)} mL.${d>0.3?' A bit over. Totally normal.':''}`,xp:20};
  if(Math.abs(d)<=0.06) return {r:'PERFECT',c:'pink',t:'Stopped on the exact drop.',xp:50,perfect:true};
  if(Math.abs(d)<=0.12) return {r:'GREAT',c:'teal',t:'Within a couple of drops. Solid.',xp:30};
  if(d>0) return {r:'OVERSHOT',c:'red',t:`About ${drops} drop${drops===1?'':'s'} too many. Slow down sooner.`,xp:10};
  return {r:'TOO EARLY',c:'red',t:'The colour faded when swirled. Wait till it stays.',xp:10};}
function rateRun(r){const key=(S.runSet||'')+r.label; if(S.rated[key]) return; S.rated[key]=1; const f=S.runFb;
  setTimeout(()=>{award(f.xp,f.r.toLowerCase()); if(f.perfect) badge('perfect'); if(concordant().length>=2&&!S.rated['sync'+(S.runSet||'')]){S.rated['sync'+(S.runSet||'')]=1; badge('sync');}},500);}

/* ================= titration controls ================= */
let tapCtl=null;
function add(v,flash){const r=run(); if(!r||r.state!=='titrating') return;
  if(S.R+v>MAXR){S.R=MAXR; if(tapCtl) tapCtl.stop(); setCoach('Burette empty!');} else S.R+=v;
  const p=pHat(vb()); if(p!==null) r.pts.push([vb(),p]);
  renderScene(flash); updateCoach(); const st=STEP(); if(st.live) st.live(); miniCurve(); renderFoot();}
function setCoach(t){const el=$('coach'); if(el) el.textContent=t;}
function updateCoach(){const r=run(); if(!r||r.state!=='titrating') return; const st=STEP(); if(st.coach){setCoach(st.coach()); return;}
  const rough=S.runs[0].state==='done'?titre(S.runs[0]):null,now=vb();
  if(S.cur===0||rough==null){setCoach(`${now.toFixed(2)} mL added. Stop at: ${changeText(r.ind)}.`); return;}
  const over=roughOver(), slowAt=over?Math.max(0,rough-over-2.5):rough-1.5;
  if(now<slowAt) setCoach(`Speed zone: pour to about ${(r.init+slowAt).toFixed(1)} on the burette.`);
  else if(now<rough+0.5) setCoach('Precision zone! Single drops now.'); else setCoach('Past your rough titre. Changed colour? Stop!');}
function titrateBox(r){
  if(r.state==='titrating') return `<div class="ctrl"><p class="coach" id="coach"></p>
    <div class="row"><button class="btn hold big" id="tap" type="button">Hold to pour</button><button class="btn" id="tapToggle" type="button">${S.tapOpen?'Close tap':'Open tap'}</button><button class="btn" id="drop" type="button">1 drop</button><button class="btn" id="half" type="button">½ drop</button><button class="btn go" id="endBtn" type="button">End point!</button></div>
    <p class="muted" style="font-size:.82rem">Tip: you can also tap the stopcock (the black handle under the burette) to open and close it.</p>
    ${pHat(0)!=null?`<label class="toggle"><input type="checkbox" id="phToggle" ${S.showPH?'checked':''}> pH meter + curve</label>`:''}
    ${S.showPH&&pHat(0)!=null?'<canvas class="chart" id="curve" style="height:140px"></canvas>':''}</div>`;
  if(r.state==='readFinal') return `<p class="lead">Tap shut. Now read the end.</p>${readingBox('final')}`;
  if(r.state==='done'&&S.runFb) return `<div class="rating" style="--c:${cv(S.runFb.c)}"><span class="r">${S.runFb.r}</span><p>${S.runFb.t}</p><p class="mono">Titre ${titre(r).toFixed(2)} mL · +${S.runFb.xp} XP</p></div>`;
  return '';}
function bindTitrate(rate){const tap=$('tap'); if(!tap) return;
  tapCtl=holdButton(tap,dt=>add((rate||1.1)*dt,true),()=>{S.pouring=true;tap.textContent='Pouring…';},()=>{S.pouring=false;tap.textContent='Hold to pour';renderScene();});
  const d=$('drop'); if(d) d.addEventListener('click',()=>{add(0.05,true); blip('drop');}); const h=$('half'); if(h) h.addEventListener('click',()=>add(0.025,true));
  const e=$('endBtn'); if(e) e.addEventListener('click',()=>{tapCtl&&tapCtl.stop(); closeTap(); const r=run(); r.final=S.R; r.state='readFinal'; S.readMsg=null; S.lastRaw=''; S.readTries=0; renderAll(); const i=$('rdIn'); if(i) i.focus();});
  const t=$('phToggle'); if(t) t.addEventListener('change',()=>{S.showPH=t.checked; renderCard(true); renderScene();});
  updateCoach(); miniCurve();}
function miniCurve(){const c=$('curve'); if(!c||S.cur<0) return; drawChart(c,{xmax:Math.max(30,Math.ceil((vb()+5)/10)*10),ymin:0,ymax:14,ystep:7,series:[{pts:run().pts.filter(p=>p[1]!=null),color:'--violet'}]});}
function tableRuns(runs,conc){return `<div class="tw"><table><thead><tr><th>Run</th><th class="num">End (mL)</th><th class="num">Start (mL)</th><th class="num">Titre (mL)</th><th></th></tr></thead><tbody>${runs.map((r,i)=>{const t=titre(r);
  const tag=i===0?'<span class="chip rough">Rough</span>':conc.includes(r)?'<span class="chip">Concordant</span>':(r.state==='done'?'<span class="chip dim">Not used</span>':'');
  return `<tr><td><b>${r.label}</b></td><td class="num mono">${r.eFinal!=null?r.eFinal.toFixed(2):''}</td><td class="num mono">${r.eInit!=null?r.eInit.toFixed(2):''}</td><td class="num mono">${t!=null?t.toFixed(2):''}</td><td>${tag}</td></tr>`;}).join('')}</tbody></table></div>`;}
const bookHTML=()=>S.runs.some(r=>r.eInit!=null)?tableRuns(S.runs,concordant()):'';

/* generic titration steps */
function stepRead(o){return {id:o.id,w:o.w,title:o.title||'Read the burette',strip:true,
  html:()=>{const r=run(); return `${o.rules?rulesHTML()+newWord('Meniscus','the curved surface of the liquid. Read its bottom.'):''}${r.eInit!=null?`<p class="toastline good">Locked in: ${r.eInit.toFixed(2)} mL.</p>`:readingBox('init')}`;},
  bind:()=>bindReading(),can:()=>run()&&run().eInit!=null,gate:'Read the start',onNext:o.onNext};}
function stepRough(o){return {id:o.id,w:o.w,title:o.title||'Speed run',strip:true,
  html:()=>{const r=S.runs[0]; return `${r.state==='readInitial'?'<p class="lead">New rough run. Read the start first.</p>'+readingBox('init'):titrateBox(r)}
   ${r.state==='titrating'?`<p><b>Rough go:</b> pour fast, swirl, stop when the colour changes and <b>stays</b>. Look for: <b>${changeText(r.ind)}</b>.</p>`:''}
   ${r.state==='done'&&o.quiz?newWord('Titre','how much you added: end reading − start reading.')+quiz('rough','What\'s this rough go for?'):''}${bookHTML()}`;},
  bind:()=>{bindReading(); bindTitrate();},can:()=>S.runs[0].state==='done'&&(!o.quiz||quizOk('rough')),gate:'Finish the speed run',onNext:o.onNext};}
function stepPrecise(o){const need=o.need||2; return {id:o.id,w:o.w,title:o.title||'Precision mode',strip:true,
  html:()=>{const r=run(),rough=titre(S.runs[0]),conc=concordant(),gap=closestGap(),nAcc=S.runs.length-1,over=roughOver();
   const pips=`<div class="pips">${Array.from({length:need},(_,i)=>`<span class="pip ${conc.length>i?'on':''}">${conc.length>i?'✓':''}</span>`).join('')}<span>${conc.length>=need?(need>2?'Three concordant titres locked!':'Concordant pair locked!'):(need>2?'Get 3 titres within 0.10 mL of each other':'Get 2 titres within 0.10 mL')}</span></div>`;
   const body=S.cur>0?(r.state==='readInitial'?`<h3>${r.label}: read the start</h3>`+readingBox('init'):titrateBox(r)):'';
   const prep=r.state==='done'?`<div class="row"><button class="btn go big" id="prepBtn" type="button" ${nAcc>=10?'disabled':''}>${nAcc===0?'Start run 1':'Start run '+(nAcc+1)}</button>${nAcc===0?'<button class="btn" id="redoRough" type="button">Redo rough</button>':''}</div>`:'';
   return `${body}${prep}${pips}
   ${nAcc===0&&over?`<p class="toastline bad">Heads up: your rough run went well past the colour change, so ${rough.toFixed(2)} mL is only a maximum. Redo the rough, or start single drops much earlier.</p>`:''}
   ${need>2&&conc.length===2?'<p class="toastline info">Two agree! Now get a third within 0.10 mL of both.</p>':''}
   ${!conc.length&&gap!==null?`<p class="toastline bad">Closest pair: ${gap.toFixed(2)} mL apart. Need 0.10 or less. Again!</p>`:''}
   ${nAcc===0&&o.teach?`<p>Rough titre: <b class="mono">${rough.toFixed(2)} mL</b>. This time pour fast until about 1.5 mL before that, then go drop by drop.</p>${newWord('Concordant','two results within 0.10 mL of each other.')}`:''}${bookHTML()}`;},
  bind:()=>{bindReading(); bindTitrate(); const p=$('prepBtn'); if(p) p.addEventListener('click',()=>{newRun(); blip('tap'); renderAll();});
   const rr=$('redoRough'); if(rr) rr.addEventListener('click',()=>{S.runs=[]; newRun(null,'Rough'); S.rated={}; S.step=sid(o.roughId); snap(); renderAll();});},
  can:()=>concordant().length>=need,gate:need>2?'Need 3 concordant titres':'Need a concordant pair',onNext:o.onNext};}

/* ================= charts ================= */
function drawChart(c,cfg){
  const dpr=cfg.dpr||devicePixelRatio||1,w=cfg.w||c.clientWidth||320,h=cfg.h||c.clientHeight||200; c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); if(!g||!g.scale) return null; g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),tok=n=>(cfg.pal&&cfg.pal[n])||((n&&n.startsWith('--'))?cs.getPropertyValue(n).trim():n);
  if(cfg.bg){g.fillStyle=cfg.bg; g.fillRect(0,0,w,h);}
  const L=cfg.L||34,R=10,T=cfg.legend?32:10,B=24,pw=w-L-R,ph=h-T-B,xmin=cfg.xmin||0,xmax=cfg.xmax,ymin=cfg.ymin,ymax=cfg.ymax;
  const X=v=>L+(v-xmin)/(xmax-xmin)*pw,Y=p=>T+(ymax-p)/(ymax-ymin)*ph;
  (cfg.bands||[]).forEach(b=>{g.fillStyle=b.color; g.globalAlpha=.28; g.fillRect(L,Y(b.hi),pw,Y(b.lo)-Y(b.hi)); g.globalAlpha=1;});
  g.font='600 10px JetBrains Mono, monospace'; g.fillStyle=tok('--muted'); g.strokeStyle=tok('--line'); g.lineWidth=1;
  if(cfg.minor){g.globalAlpha=.5; g.lineWidth=.6; for(let p=ymin;p<=ymax+1e-9;p+=cfg.minor){g.beginPath();g.moveTo(L,Y(p));g.lineTo(L+pw,Y(p));g.stroke();} if(cfg.xminor) for(let v=xmin;v<=xmax+1e-9;v+=cfg.xminor){g.beginPath();g.moveTo(X(v),T);g.lineTo(X(v),T+ph);g.stroke();} g.globalAlpha=1; g.lineWidth=1;}
  const ys=cfg.ystep||(ymax-ymin)/4; for(let p=ymin;p<=ymax+1e-9;p+=ys){g.beginPath();g.moveTo(L,Y(p));g.lineTo(L+pw,Y(p));g.stroke();g.textAlign='right';g.fillText(+p.toFixed(1),L-5,Y(p)+3);}
  const xs=cfg.xstep||10; for(let v=xmin;v<=xmax+1e-9;v+=xs){g.textAlign='center';g.fillText(+v.toFixed(1),X(v),h-7);}
  if(cfg.ylab){g.textAlign='left'; g.fillText(cfg.ylab,L+4,T+11);} g.textAlign='right'; g.fillText(cfg.xlab||'mL added',L+pw,T+ph-5);
  g.save&&g.save(); if(g.clip){g.beginPath(); g.rect(L-6,T-6,pw+12,ph+12); g.clip();}
  (cfg.lines||[]).forEach(l=>{g.strokeStyle=tok(l.color); g.lineWidth=l.width||2; g.setLineDash&&g.setLineDash(l.dash||[]); g.beginPath(); g.moveTo(X(l.x1),Y(l.y1)); g.lineTo(X(l.x2),Y(l.y2)); g.stroke(); g.setLineDash&&g.setLineDash([]);});
  (cfg.vlines||[]).forEach(l=>{g.strokeStyle=tok(l.color); g.lineWidth=2; g.setLineDash&&g.setLineDash([5,4]); g.beginPath(); g.moveTo(X(l.x),T); g.lineTo(X(l.x),T+ph); g.stroke(); g.setLineDash&&g.setLineDash([]); if(l.label){g.fillStyle=tok(l.color); g.textAlign='left'; g.fillText(l.label,X(l.x)+4,T+22);}});
  (cfg.hlines||[]).forEach(l=>{g.strokeStyle=tok(l.color); g.lineWidth=2; g.setLineDash&&g.setLineDash([5,4]); g.beginPath(); g.moveTo(L,Y(l.y)); g.lineTo(L+pw,Y(l.y)); g.stroke(); g.setLineDash&&g.setLineDash([]); if(l.label){g.fillStyle=tok(l.color); g.textAlign='left'; g.font='700 10px JetBrains Mono, monospace'; g.fillText(l.label,L+6,Y(l.y)-5);}});
  (cfg.series||[]).forEach(s=>{const pts=s.pts.filter(p=>p[0]>=xmin&&p[0]<=xmax); if(!pts.length) return; g.strokeStyle=tok(s.color); g.fillStyle=tok(s.color); g.lineWidth=s.width||3; g.lineJoin='round';
    if(s.dots){pts.forEach(([v,p])=>{g.beginPath(); g.arc(X(v),Y(p),s.r||4,0,7); g.fill();});}
    else{g.beginPath(); pts.forEach(([v,p],i)=>i?g.lineTo(X(v),Y(p)):g.moveTo(X(v),Y(p))); g.stroke(); if(s.end){const [lv,lp]=pts[pts.length-1]; g.fillStyle=tok('--pink'); g.beginPath(); g.arc(X(lv),Y(lp),4.5,0,7); g.fill();}}});
  g.restore&&g.restore();
  if(cfg.legend){g.font='700 11px Figtree, sans-serif'; let lx=L; const ly=16; cfg.legend.forEach(it=>{g.fillStyle=tok(it.color); g.fillRect(lx,ly-8,12,10); g.fillStyle=tok('--ink'); g.textAlign='left'; g.fillText(it.label,lx+16,ly+1); lx+=g.measureText(it.label).width+34;});}
  (cfg.marks||[]).forEach(m=>{g.fillStyle=tok(m.color); g.strokeStyle=tok('--edge'); g.lineWidth=2; g.beginPath(); g.arc(X(m.x),Y(m.y),6,0,7); g.fill(); g.stroke(); if(m.label){g.fillStyle=tok('--ink'); g.textAlign='left'; g.font='800 11px Figtree, sans-serif'; g.fillText(m.label,X(m.x)+9,Y(m.y)-8);}});
  return {xFromClient:(cx)=>{const r=c.getBoundingClientRect(); return xmin+((cx-r.left)-L)/pw*(xmax-xmin);}};
}

/* report graphs: drawn offscreen in light colours, embedded as PNG so PDF/PNG export and saved reports keep them */
const LIGHT={'--ink':'#1d1636','--muted':'#5b5478','--line':'#d9d2ee','--surface-2':'#f6f3fd','--edge':'#1d1636','--pink':'#d61f73','--orange':'#d86b00','--yellow':'#c99700','--blue':'#2f63e0','--teal':'#008f79','--violet':'#6236e0','--red':'#d6303f','--green':'#1f9d4c'};
function chartImg(cfg,caption){try{const c=document.createElement('canvas'); const r=drawChart(c,Object.assign({w:640,h:280,dpr:1.5,bg:'#ffffff',pal:LIGHT,L:40},cfg)); if(!r) return ''; const src=c.toDataURL('image/png'); if(!src||src.length<200) return '';
  return `<figure class="rfig"><img src="${src}" alt="${(caption||'Graph').replace(/"/g,'')}"><figcaption>${caption||''}</figcaption></figure>`;}catch(e){return '';}}
function curvePts(vmax,step){const out=[]; for(let v=0;v<=vmax+1e-9;v+=step||0.1){const p=pHat(v); if(p==null||!isFinite(p)) return null; out.push([+v.toFixed(3),p]);} return out;}
function barsHTML(rows,unit,caption){const mx=Math.max(...rows.map(r=>r.v),1e-9);
  return `<figure class="rfig"><div class="rbars">${rows.map(r=>`<div class="rb"><span class="rbl">${r.label}</span><span class="rbt"><i style="width:${Math.max(3,r.v/mx*100).toFixed(1)}%;background:${r.color||'#6236e0'}"></i></span><b>${r.txt!=null?r.txt:r.v} ${unit||''}</b></div>`).join('')}</div><figcaption>${caption||''}</figcaption></figure>`;}

/* ================= calculations ================= */
function num(s){s=String(s).trim().replace(/\s+/g,'').replace(/,/g,'').replace(/−/g,'-'); s=s.replace(/(?:×|x|\*)10\^?\(?(-?\d+)\)?$/i,'e$1'); if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN; return parseFloat(s);}
let LASTCALC=null;
function calcHTML(list,intro){LASTCALC=list;const first=list.findIndex(st=>!(S.calc[st.id]&&S.calc[st.id].ok));
  const flow=list.some(x=>x.f)?`<div class="flow" aria-label="Plan">${list.map((st,i)=>`${i?'<i>→</i>':''}<span class="${i<first||first===-1?'done':i===first?'on':''}">${st.f||st.q}</span>`).join('')}</div>`:'';
  return `${intro||doLine('Solve','Each answer unlocks the next.')}${flow}${list.map((st,i)=>{const c=S.calc[st.id]||{}; if(first!==-1&&i>first) return `<div class="step" style="opacity:.45"><div class="q">${i+1}. ${st.q}<small>Locked</small></div></div>`;
    if(c.ok&&S.clast!==st.id) return `<div class="step ok slim"><div class="q">✓ ${i+1}. ${st.q}: <b class="mono">${c.val} ${st.unit||''}</b></div><input id="c_${st.id}" value="${c.val}" readonly hidden></div>`;
    return `<div class="step${c.ok?' ok':''}"><div class="q">${i+1}. ${st.q}<small>${st.sub}</small></div>${st.why?`<div class="whyline"><b>Why this step?</b> ${st.why}</div>`:''}<div class="in"><input id="c_${st.id}" inputmode="decimal" value="${c.val||''}" aria-label="${st.q}" ${c.ok?'readonly':''}><span class="unit">${st.unit}</span>${c.ok?'':`<button class="btn go" type="button" data-chk="${st.id}">Check</button>`}</div>${c.fb?`<p class="toastline ${c.ok?'good':'bad'}">${c.fb}</p>`:''}</div>`;}).join('')}
  <p class="muted" style="font-size:.82rem">Tiny numbers: type 2.45e-3</p>`;}
function bindCalc(list){list.forEach(st=>{const el=$('c_'+st.id); if(!el) return; el.addEventListener('keydown',e=>{if(e.key==='Enter')checkCalc(st,list);}); el.addEventListener('input',()=>{(S.calc[st.id]=S.calc[st.id]||{}).val=el.value;});});
  document.querySelectorAll('[data-chk]').forEach(b=>b.addEventListener('click',()=>checkCalc(list.find(x=>x.id===b.dataset.chk),list)));}
function checkCalc(st,list){const raw=$('c_'+st.id).value,v=num(raw),c=S.calc[st.id]={val:raw}; S.ctries[st.id]=(S.ctries[st.id]||0)+1; S.clast=st.id;
  if(isNaN(v)){c.fb='Type a number.'; c.ok=false; renderCard(true); return;}
  const ok=st.abs!=null?Math.abs(v-st.target)<=st.abs:Math.abs(v-st.target)/Math.abs(st.target)<=st.rel; c.ok=ok;
  c.fb=ok?'Unlocked!':((st.abs==null&&(Math.abs(v*1000-st.target)/st.target<0.01||Math.abs(v/1000-st.target)/st.target<0.01))?'Out by ×1000. Check mL vs L, or g vs mg.':'Hint: '+st.hint);
  if(ok){right(S.ctries[st.id]===1?20:8,'solved'); if(st.unc&&S.ctries[st.id]===1) badge('unc'); if(list.every(k=>S.ctries[k.id]===1&&S.calc[k.id]&&S.calc[k.id].ok)) badge('mole');} else wrong();
  renderCard(true); if(!ok) shake($('c_'+st.id)); const n=document.querySelector('.step:not(.ok) input'); if(ok&&n) n.focus();}
const calcDone=list=>list.every(st=>S.calc[st.id]&&S.calc[st.id].ok);
function uncSteps(prefix,mean,aliquot,extra,final,finalUnit,pipU){pipU=pipU||0.03;
  const pct=(0.10/mean+pipU/aliquot+(extra?extra.v:0))*100;
  const list=[{id:prefix+'pct',unc:true,f:'± %',q:'Instrumental % uncertainty',why:'Every piece of glassware has a tolerance. Adding up their % uncertainties shows how much the equipment alone could shift your answer. This is instrumental uncertainty only: it doesn\'t include judging the end point or other random errors.',sub:`Add the % uncertainties: titre ±0.10 mL (two burette readings × ±0.05) out of ${mean.toFixed(2)} mL, plus pipette ±${pipU} mL out of ${aliquot.toFixed(2)} mL${extra?', plus '+extra.t:''}. Assume the titrant concentration is exact.`,unit:'%',target:pct,abs:0.06,hint:`(0.10 ÷ ${mean.toFixed(2)} + ${pipU} ÷ ${aliquot.toFixed(2)}${extra?' + '+extra.h:''}) × 100`}];

{id:'mission',skip:()=>!!PROG.first.introDone,w:0,solo:true,title:'Your mission',
 html:()=>`<div class="hero-art"><svg viewBox="0 0 200 200" class="bob"><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="var(--pink)"/><stop offset=".5" stop-color="var(--orange)"/><stop offset="1" stop-color="var(--yellow)"/></linearGradient></defs>
  <path d="M78 20 V70 L30 160 Q24 178 44 178 H156 Q176 178 170 160 L122 70 V20" fill="url(#hg)" stroke="var(--edge)" stroke-width="5" stroke-linejoin="round"/><path d="M70 20 H130" stroke="var(--edge)" stroke-width="6" stroke-linecap="round"/>
  <text x="100" y="152" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="64" fill="#fff">?</text></svg></div>
  <p class="lead">Someone made this solution and lost the label.</p><p>Your mission: find out <b>exactly how strong</b> it is, using a <b>titration</b>. Earn XP, unlock badges, aim for 3 stars.</p>`,
 can:()=>true,next:'Accept mission',onNext:()=>badge('rookie')},
{id:'why',skip:()=>!!PROG.first.introDone,w:0,solo:true,title:'Why should you care?',
 html:()=>{const i=S.why.i,c=USES[i]; return `${doLine('Swipe','through 5 places titrations quietly run your life.')}
  <div class="use" id="useCard" style="--c:var(--${c.c});--c-soft:var(--${c.c}-soft)"><div class="use-art">${c.art}</div><div><span class="lbl">${i+1} / ${USES.length}</span><br><b>${c.t}</b><p>${c.d}</p></div></div>
  <div class="row" style="justify-content:space-between"><button class="btn" type="button" id="uPrev" ${i===0?'disabled':''} aria-label="Previous">←</button><span class="dots">${USES.map((_,j)=>`<i class="${S.why.seen.includes(j)?'on':''} ${j===i?'cur':''}"></i>`).join('')}</span><button class="btn go" type="button" id="uNext" ${i===USES.length-1?'disabled':''} aria-label="Next">→</button></div>
  ${S.why.seen.length===USES.length?`<div class="whytxt"><b>The big picture:</b> any time someone needs to know exactly how much acid, base or other chemical is in a liquid, they titrate. It's cheap, fast and really accurate.</div>`:''}`;},
 bind:()=>{const go=d=>{const n=S.why.i+d; if(n<0||n>=USES.length) return; S.why.i=n; if(!S.why.seen.includes(n)){S.why.seen.push(n); award(3);} else blip('tap'); renderCard();};
   $('uPrev').addEventListener('click',()=>go(-1)); $('uNext').addEventListener('click',()=>go(1));
   const u=$('useCard'); let x0=null; u.addEventListener('pointerdown',e=>{x0=e.clientX;}); u.addEventListener('pointerup',e=>{if(x0==null) return; const dx=e.clientX-x0; x0=null; if(dx<-40) go(1); else if(dx>40) go(-1);});},
 can:()=>S.why.seen.length===USES.length,gate:'See all 5'},
{id:'idea',skip:()=>!!PROG.first.introDone,w:0,solo:true,title:'The big idea',
 html:()=>{const I=S.idea,done=I.n>=I.N;
  QUIZ.units=[{t:`${I.N} units`,ok:true,fb:'Yes! Count how much known stuff it takes, and you know how much mystery stuff was there.'},{t:'1 unit',ok:false,fb:'Each drop cancels 1 unit. How many drops did it take?'},{t:'Can\'t tell',ok:false,fb:'You can! Each drop cancels 1 unit, and you counted the drops.'}];
  return `${doLine('Tap','to add drops of a KNOWN base to a cup of mystery acid. The dye turns pink once all the acid is used up.')}
  <div class="idea"><svg viewBox="0 0 160 150" aria-label="Cup of acid with indicator">
    <path d="M30 20 L40 140 H120 L130 20" fill="none" stroke="var(--glass)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M34 60 L40 136 H120 L126 60 Z" fill="${done?'var(--pink)':'var(--liquid)'}" opacity="${done?.85:1}"/>
    <ellipse id="ideaFlash" cx="80" cy="66" rx="22" ry="6" fill="var(--pink)" opacity="0"/>
    <circle id="ideaDropC" cx="80" cy="6" r="5" fill="var(--blue)" opacity="0"/></svg>
    <div class="dropcount"><b class="mono">${I.n}</b><span>drops</span></div></div>
  ${done?`<p class="toastline good">PINK! It took ${I.N} drops.</p>${quiz('units','If 1 drop cancels 1 unit of acid, how much acid was in the cup?')}`:`<div class="row" style="justify-content:center"><button class="btn go big" type="button" id="ideaDrop">Add 1 drop</button></div>`}
  ${done&&quizOk('units')?`<div class="whytxt"><b>That's a titration.</b> Add a known solution, measure exactly how much it takes, work backwards to the mystery. In the lab you measure in millilitres, to the nearest 0.05 mL, instead of counting drops.</div>`:''}`;},
 bind:()=>{const b=$('ideaDrop'); if(!b) return; b.addEventListener('click',()=>{S.idea.n++; blip('drop');
   if(S.idea.n>=S.idea.N){right(10,'pink!'); renderCard(); return;}
   const d=$('ideaDropC'); d.setAttribute('opacity',1); d.style.setProperty('--fall','56px'); d.classList.remove('drop'); void d.getBoundingClientRect(); d.classList.add('drop');
   const f=$('ideaFlash'); f.classList.remove('flash'); void f.getBoundingClientRect(); f.classList.add('flash');
   document.querySelector('.dropcount b').textContent=S.idea.n;});},
 can:()=>quizOk('units'),gate:'Finish the experiment'},
{id:'pick',w:0,solo:true,title:'Pick a mission',
 html:()=>`<p>First time? Go <b>Mission 1</b>.</p><div class="choices">${['strong','weak','carb','redox'].map(k=>{const v=CHEM[k]; return `<button type="button" class="choice" data-k="${k}" aria-pressed="${k===S.key}" style="--c:${cv(v.c)}"><span class="band"><span>${v.tag}</span><span>${'●'.repeat(v.diff)}${'○'.repeat(3-v.diff)}</span></span><span class="body"><b>${v.tab}</b><small>Find: ${v.aName} (${v.aSym})</small><small>Titrant: ${v.ct.toFixed(4)} mol/L ${v.tSym}</small>${bestStars(k)}</span></button>`;}).join('')}</div>
  <p class="toastline info"><b>Safety:</b> ${sys().safety}</p>`,
 bind:()=>document.querySelectorAll('.choice[data-k]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.k===S.key) return; setKey(b.dataset.k); blip('tap'); snap(); renderAll();})),
 can:()=>true,next:'Go to the bench'},
{id:'meet',skip:()=>!!PROG.first.introDone,w:0,title:'Meet your bench',
 taps:()=>Object.keys(HOME).concat('stand'), tapsOnlyNew:true,
 onTap:id=>{showInfo(id,true); S.callout=null; openPop(id); if(S.seen.length===11) badge('explorer'); renderScene(); renderCard();},
 html:()=>`${doLine('Tap','each glowing thing on the bench. A card pops up telling you what it is and what it does.')}
  <span class="counter">${S.seen.length} / 11 found</span>
  ${S.seen.length>=11?'<p class="toastline good">You\'ve met all your kit.</p>':''}
  <p class="muted" style="font-size:.85rem">Pinch the bench (or use + and −) to zoom in.</p>`,
 can:()=>S.seen.length>=11,gate:'Tap all 11'},
{id:'hunt',skip:()=>!!PROG.first.introDone,w:0,title:'Gear hunt',
 taps:()=>Object.keys(HOME).concat('stand'),
 onTap:id=>{const R=HUNT[S.hunt.round]; if(!R) return; const k=infoKey(id); showInfo(id,false);
   if(k===R.a){S.hunt.round++; S.hunt.msg={ok:true,t:R.fact}; right(10,INFO()[k][0].split(' ·')[0]); if(S.hunt.round===HUNT.length&&S.hunt.miss===0) badge('gearhead');}
   else{S.hunt.miss++; S.hunt.msg={ok:false,t:`That's the ${INFO()[k][0].split(' ·')[0].toLowerCase()}. Try again.`}; wrong();}
   renderScene(); renderCard();},
 html:()=>{const R=HUNT[S.hunt.round]; return R?`${doLine(`${S.hunt.round+1}/${HUNT.length}`,`Tap the ${R.q}`)}${S.hunt.msg?`<p class="toastline ${S.hunt.msg.ok?'good':'bad'}">${S.hunt.msg.t}</p>`:''}`
   :`<p class="toastline good">All found! You know your kit.</p>`;},
 can:()=>S.hunt.round>=HUNT.length,gate:'Find them all'},
{id:'clamp',w:1,title:'Clamp the burette',
 drags:()=>S.setup.clamped?{}:{burette:{clamp:()=>{S.setup.clamped=true; S.pos.burette={...CLAMP,r:0}; award(10,'clamped');}}},
 zones:()=>S.setup.clamped?[]:[Z.clamp],
 html:()=>S.setup.clamped?`<p class="toastline good">Locked in, dead straight.</p>${why('clamp','A burette that leans gives wrong readings.')}`:doLine('Drag','the burette (long tube) into the clamp on the stand.'),
 can:()=>S.setup.clamped,gate:'Drag the burette'},
{id:'rinse',w:1,title:'Rinse it out',
 drags:()=>{const st=S.setup; if(S.anim.tip||S.tapOpen) return {}; if(!st.rinseW) return {wash:{btop:()=>startRinse('wash')}}; if(st.rinseW===3&&!st.rinseT) return {tbk:{btop:()=>startRinse('tbk')}}; return {};},
 zones:()=>{const st=S.setup; if(S.anim.tip||S.tapOpen) return []; return (!st.rinseW||(st.rinseW===3&&!st.rinseT))?[Z.btop]:[];},
 stopcock:()=>{const st=S.setup; return [1,2].includes(st.rinseW)||[1,2].includes(st.rinseT);},
 onFlow:dt=>{const st=S.setup,k=st.rinseW===1||st.rinseW===2?'rinseW':'rinseT'; if(S.R!=null) S.R=Math.min(51.5,S.R+5*dt); if(S.R>=51.5&&st[k]===1){st[k]=2; renderCard(true);} renderScene();},
 onTapClose:()=>{const st=S.setup; ['rinseW','rinseT'].forEach(k=>{if(st[k]===2){st[k]=3; S.R=null; if(k==='rinseW') award(5,'rinsed'); else badge('clean');}});},
 html:()=>{const st=S.setup,s=sys(),onW=(st.rinseW||0)<3,k=onW?(st.rinseW||0):(st.rinseT||0),nm=onW?'distilled water':`${s.tSym} solution`;
   const c=checks([{t:'Water in',done:st.rinseW>=1},{t:'Drain',done:st.rinseW>=2},{t:'Close',done:st.rinseW>=3},{t:`${s.tSym} in`,done:st.rinseT>=1},{t:'Drain',done:st.rinseT>=2},{t:'Close',done:st.rinseT>=3}]);
   if(S.anim.tip) return c+doLine('Watch',`A little ${nm} goes in. You'd tilt and turn the burette so it wets all the glass.`);
   if(st.rinseT===3) return c+quiz('rinse',`Why rinse with ${s.tSym} and not just water?`);
   const tb=`<div class="row"><button class="btn ${k===1?'go':''}" id="tapToggle" type="button">${S.tapOpen?'Close the tap':'Open the tap'}</button></div>`;
   if(k===0) return c+doLine('Drag',onW?'the wash bottle to the top of the burette to rinse it with water.':`the ${s.tSym} beaker (the known solution) to the top of the burette to rinse with that too.`);
   if(k===1) return c+doLine('Tap',S.tapOpen?'Draining into the waste beaker…':'the stopcock (black handle at the bottom of the burette) to open it and drain into the waste.')+tb+(S.tapOpen?'':why('stopcock','The tap is called a stopcock. Across the tube = closed. In line with the tube = open. It also rinses the tip below the tap.'));
   return c+doLine('Tap','the stopcock again to close it. Always close it before adding more liquid.')+tb;},
 can:()=>S.setup.rinseT===3&&quizOk('rinse'),gate:'Rinse twice'},
{id:'fill',w:1,title:'Fill the burette',
 stopcock:()=>S.setup.funnelOn&&!S.setup.funnelOff,
 onFlow:dt=>{if(S.R!=null&&S.R<51.5){S.R=Math.min(51.5,S.R+1.4*dt); const m=$('pourMsg'); if(m) m.innerHTML='<p class="toastline bad">The tap is open! Liquid is running out the bottom. Close it.</p>';} renderScene();},
 onTapClose:()=>{const m=$('pourMsg'); if(m) m.innerHTML='';},
 drags:()=>{const st=S.setup;
   if(!st.funnelOn) return {funnel:{btop:()=>{st.funnelOn=true; S.pos.funnel={x:230,y:80,r:0}; award(5);}}};
   if(!st.filled&&!st.pouringPos) return {tbk:{funnel:()=>{st.pouringPos=true; S.tilt=0; S.pos.tbk=pourPos(0);}}};
   if(st.filled&&!st.funnelOff) return {funnel:{shelf:()=>{st.funnelOff=true; S.pos.funnel={...HOME.funnel}; award(10,'funnel out');}}};
   return {};},
 taps:()=>tiltMode()?['tbk']:null,
 zones:()=>{const st=S.setup; if(!st.funnelOn) return [Z.btop]; if(!st.filled&&!st.pouringPos) return [Z.funnel]; if(st.filled&&!st.funnelOff) return [Z.shelf]; return [];},
 html:()=>{const st=S.setup,s=sys();
   const c=checks([{t:'Funnel in',done:st.funnelOn},{t:'Pour',done:st.filled},{t:'Funnel out',done:st.funnelOff}]);
   if(!st.funnelOn) return c+doLine('Drag','the funnel onto the top of the burette.');
   if(!st.pouringPos) return c+doLine('Drag',`the ${s.tSym} beaker onto the funnel.`);
   if(!st.filled) return c+doLine('Tilt','Drag the beaker sideways or use the slider to tip it. Tip it back when the liquid is just above the 0 line. Watch the zoom!')+`<label class="tilt"><span>Tilt</span><input type="range" id="tilt" min="0" max="90" step="1" value="${Math.round(S.tilt||0)}" aria-label="Tilt the beaker"></label><div id="pourMsg">${msgHTML()}</div>`;
   if(!st.funnelOff) return c+msgHTML()+doLine('Drag','the funnel back to the shelf.')+why('funnel','Drips from a funnel sneak extra liquid in and mess up your readings.');
   return c+`<p class="toastline good">Full and funnel-free.</p>`;},
 bind:()=>{const t=$('tilt'); if(t) t.addEventListener('input',()=>setTilt(+t.value));},
 can:()=>S.setup.funnelOff,gate:'Fill it and remove the funnel'},
{id:'bubble',w:1,title:'Bust the bubble',
 stopcock:()=>true,
 onFlow:dt=>{S.R+=1.4*dt; if(S.setup.bubble){S.setup.bubbleT+=dt; if(S.setup.bubbleT>0.35){S.setup.bubble=false; badge('bubble'); renderCard(true);}} renderScene(); renderFoot();},
 onTapClose:()=>{if(!S.setup.bubble&&S.R<0.05) setMsg(false,'Bubble gone! Open it again briefly so the level drops onto the scale (below 0.00).'); else S.msg=null;},
 html:()=>{const st=S.setup,ok=!st.bubble&&S.R>=0.05;
   return `${doLine('Spot','the orange circle under the tap? That\'s trapped air.')}
   ${ok&&!S.tapOpen?`<p class="toastline good">Bubble gone, level on the scale. Ready.</p>`:`${doLine('Tap',S.tapOpen?'Running into the waste… tap the stopcock again to close it.':'the stopcock to open it fully and blast the air out into the waste beaker. Tap again to close.')}<div class="row"><button class="btn ${S.tapOpen?'':'go'}" id="tapToggle" type="button">${S.tapOpen?'Close the tap':'Open the tap'}</button></div>${msgHTML()}`}
   ${why('bubble','If the bubble pops out mid-experiment, the reading changes but no liquid reaches the flask.')}`;},
 can:()=>!S.setup.bubble&&S.R>=0.05&&!S.tapOpen,gate:'Clear the bubble, then close the tap'},
{id:'tile',w:1,title:'Set the tile',
 drags:()=>S.setup.tile?{}:{tile:{under:()=>{S.setup.tile=true; S.pos.tile={x:230,y:412,r:0}; S.pos.waste={x:350,y:412,r:0}; award(10,'tile');}}},
 zones:()=>S.setup.tile?[]:[Z.under],
 html:()=>S.setup.tile?`<p class="toastline good">Tile in. Pale colours will pop on white.</p>`:doLine('Drag','the white tile under the burette. The waste beaker moves out of the way.'),
 can:()=>S.setup.tile,gate:'Drag the tile'},
{id:'pipette',w:1,title:'Pipette challenge',
 drags:()=>{const st=S.setup; if(!st.pipIn) return {pipette:{sample:()=>{st.pipIn=true; S.pos.pipette={x:98,y:406,r:0};}}};
   if(st.pipOk&&!st.aliquot) return {pipette:{flaskH:()=>{st.aliquot=true; S.pip.L=0; S.pos.pipette={...HOME.pipette}; animate('fill',700); award(10,'aliquot');}}}; return {};},
 zones:()=>{const st=S.setup; if(!st.pipIn) return [Z.sample]; if(st.pipOk&&!st.aliquot) return [Z.flaskHome]; return [];},
 html:()=>{const st=S.setup,p=S.pip;
   const c=checks([{t:'Dip',done:st.pipIn},{t:'Rinse',done:st.pRinse},{t:'Hit the line',done:st.pipOk},{t:'Into flask',done:st.aliquot}]);
   if(!st.pipIn) return c+doLine('Drag','the pipette into the mystery solution (the ? beaker).');
   if(!st.pRinse) return c+doLine('Tap','to rinse the pipette with a bit of the mystery solution first.')+`<div class="row"><button class="btn go big" id="pRinse" type="button">Rinse pipette</button></div>`;
   if(!st.pipOk) return c+doLine('Goal','Suck it up past the pink line. Then let it down until the bottom of the curve sits ON the line. Watch the zoom.')+
     `<div class="row"><button class="btn hold" id="pUp" type="button">Hold: suck up</button><button class="btn hold" id="pDown" type="button">Hold: let out</button><button class="btn" id="pDrop" type="button">1 drop</button><button class="btn go" id="pCheck" type="button">Lock in</button></div>${p.msg?`<p class="toastline ${p.msg.ok?'good':'bad'}">${p.msg.t}</p>`:''}`;
   if(!st.aliquot) return c+newWord('Aliquot','an exact measured portion. Yours is 25.00 mL.')+doLine('Drag','the pipette to the conical flask to empty it in.');
   return c+`<p class="toastline good">25.00 mL in the flask. <b>Don't blow out the last drop</b> in the tip: the pipette is made to leave it.</p>`+quiz('flask','Plot twist: the flask was wet with water. Problem?');},
 bind:()=>{const r=$('pRinse'); if(r) r.addEventListener('click',()=>{S.setup.pRinse=true; award(5,'rinsed'); renderAll();});
   if(!$('pUp')) return;
   holdButton($('pUp'),dt=>{S.pip.L=Math.max(-150,S.pip.L-90*dt); if(S.pip.L<-137) S.pip.above=true; renderScene();});
   holdButton($('pDown'),dt=>{S.pip.L=Math.min(0,S.pip.L+4*dt); renderScene();});
   $('pDrop').addEventListener('click',()=>{S.pip.L=Math.min(0,S.pip.L+0.6); renderScene();});
   $('pCheck').addEventListener('click',()=>{const d=S.pip.L+134; S.pip.tries++;
     if(!S.pip.above){wrong(); S.pip.msg={ok:false,t:'Suck it up ABOVE the line first.'}; renderCard(); return;}
     if(Math.abs(d)<=0.9){S.setup.pipOk=true; S.pip.msg=null; right(S.pip.tries===1?20:8,'on the line'); if(S.pip.tries===1) badge('pipette'); renderAll(); return;}
     wrong(); if(d<0) S.pip.msg={ok:false,t:'Still above the line. Let some out.'}; else {S.pip.msg={ok:false,t:'Below the line = not enough. Suck up again.'}; S.pip.above=false;}
     renderCard();});},
 can:()=>S.setup.aliquot&&quizOk('flask'),gate:'Get 25.00 mL in the flask'},
{id:'ind',w:1,title:'Pick an indicator',
 drags:()=>{if(S.setup.indAdded||S.key==='redox') return {}; const o={}; INTRO_IND.forEach(k=>o['d_'+k]={flaskH:()=>dropInd(k)}); return o;},
 zones:()=>(S.setup.indAdded||S.key==='redox')?[]:[Z.flaskHome],
 html:()=>{const st=S.setup;
   if(S.key==='redox') return `${newWord('Indicator','a dye that changes colour when the reaction is done.')}<p class="lead">Plot twist: this one needs NO indicator.</p><p>Purple permanganate loses its colour as it reacts. Once the iron runs out, the next drop turns the flask pink.</p>${st.indAdded?'':'<div class="row"><button class="btn go big" id="noInd" type="button">Nice</button></div>'}`;
   return `${newWord('Indicator','a dye that changes colour when the reaction is done.')}
   ${st.indAdded?`<p class="toastline good">${IND[st.ind].name} added. ${indFeedback(st.ind)}</p>`:doLine('Drag','one indicator bottle onto the flask. Pick the one that changes colour at the right moment.')}
   <div class="choices">${INTRO_IND.map(k=>[k,IND[k]]).map(([k,v])=>`<div class="choice" style="--c:${v.to};cursor:default"><span class="band" style="background:linear-gradient(90deg,${v.from},${v.to})"><span style="color:#1d1636">pH ${v.lo}–${v.hi}</span></span><span class="body"><b>${v.name}</b></span></div>`).join('')}</div>
   ${msgHTML()}`;},
 bind:()=>{const b=$('noInd'); if(b) b.addEventListener('click',()=>{S.setup.indAdded=true; award(10); renderAll();});},
 can:()=>S.setup.indAdded,gate:'Add an indicator'},
{id:'flaskOn',w:1,title:'Flask in position',
 drags:()=>S.setup.flaskOn?{}:{flask:{tileF:()=>{S.setup.flaskOn=true; S.pos.flask={x:230,y:404,r:0}; award(10,'in position');}}},
 zones:()=>S.setup.flaskOn?[]:[Z.tile],
 html:()=>S.setup.flaskOn?`<p class="toastline good">Ready. Tip just above the flask neck.</p><p>Pro move: one hand on the tap, the other swirling the flask.</p>`:doLine('Drag','the flask onto the white tile, under the burette tip.'),
 can:()=>S.setup.flaskOn,gate:'Drag the flask',onNext:()=>{if(!S.runs.length){newRun(+S.R.toFixed(3)); S.runs[0].pts=[[0,pHat(0)]];}}},
stepRead({id:'read',w:1,rules:true}),
stepRough({id:'rough',w:2,quiz:true}),
stepPrecise({id:'precise',w:2,roughId:'rough',teach:true}),
{id:'words',skip:()=>!!PROG.first.introDone,w:3,solo:true,title:'Word check',
 html:()=>{const m=S.match; if(!m.order) m.order=MATCH.map((_,i)=>i).sort(()=>Math.random()-.5);
   return `${doLine('Match','Tap a word, then what it means. You\'ve used all of these now.')}<div class="match">
   <div class="colm">${MATCH.map(([t],i)=>{const d=m.done.includes(i); return `<button type="button" class="mt term ${d?'ok':''} ${m.sel===i?'sel':''}" style="--c:${cv(MCOL[i])}" data-term="${i}" ${d?'disabled':''}>${t}</button>`;}).join('')}</div>
   <div class="colm">${m.order.map(i=>{const d=m.done.includes(i); return `<button type="button" class="mt def ${d?'ok':''} ${m.bad===i?'bad':''}" style="--c:${cv(MCOL[i])}" data-def="${i}" ${d?'disabled':''}>${MATCH[i][1]}</button>`;}).join('')}</div></div>
   ${m.done.length===MATCH.length?quiz('end','Bonus: equivalence point vs end point?'):''}`;},
 bind:()=>{document.querySelectorAll('[data-term]').forEach(b=>b.addEventListener('click',()=>{S.match.sel=+b.dataset.term; S.match.bad=null; blip('tap'); renderCard();}));
   document.querySelectorAll('[data-def]').forEach(b=>b.addEventListener('click',()=>{const m=S.match,d=+b.dataset.def; if(m.sel===null){shake(b); return;}
     if(d===m.sel){m.done.push(d); m.sel=null; m.bad=null; right(8,MATCH[d][0]); if(m.done.length===MATCH.length&&m.miss<=1) badge('wordsmith');} else {m.bad=d; m.miss++; wrong();}
     renderCard(); if(m.bad===d) shake(document.querySelector(`[data-def="${d}"]`));}));},
 can:()=>S.match.done.length===MATCH.length&&quizOk('end'),gate:'Match them all'},
{id:'calc',w:3,calc:true,title:'Crack the code',html:()=>calcHTML(firstCalcList()),bind:()=>bindCalc(firstCalcList()),can:()=>calcDone(firstCalcList()),gate:'Solve them all',next:'See my results',onNext:()=>finishFirst()},
{id:'result',w:3,solo:true,title:'Mission complete',last:true,

/* ================= module: Curve Lab ================= */
const COMBO_A=['c_sasb','c_wasb','c_sawb'],COMBO_B=['cb_sbsa','cb_wbsa','cb_sbwa'],COMBO_C=COMBO_A.concat(COMBO_B);
QUIZ.eqph_c_sasb=[{t:'Exactly 7',ok:true,fb:'Yes. NaCl is a neutral salt, so the solution is neutral at equivalence.'},{t:'Above 7',ok:false,fb:'Not here. Both are strong, so the salt (NaCl) is neutral.'},{t:'Below 7',ok:false,fb:'Not here. Both are strong, so the salt (NaCl) is neutral.'}];
QUIZ.eqph_c_wasb=[{t:'Exactly 7',ok:false,fb:'Look again at your curve. The salt here is CH₃COONa.'},{t:'Above 7',ok:true,fb:'Yes. Ethanoate ions (CH₃COO⁻) are a weak base, so the solution is basic at equivalence.'},{t:'Below 7',ok:false,fb:'Look again at your curve. The salt here is CH₃COONa.'}];
QUIZ.eqph_c_sawb=[{t:'Exactly 7',ok:false,fb:'Look again at your curve. The salt here is NH₄Cl.'},{t:'Above 7',ok:false,fb:'Look again at your curve. The salt here is NH₄Cl.'},{t:'Below 7',ok:true,fb:'Yes. Ammonium ions (NH₄⁺) are a weak acid, so the solution is acidic at equivalence.'}];
QUIZ.eqph_cb_sbsa=QUIZ.eqph_c_sasb.map(o=>({...o})); QUIZ.eqph_cb_wbsa=QUIZ.eqph_c_sawb.map(o=>({...o})); QUIZ.eqph_cb_sbwa=QUIZ.eqph_c_wasb.map(o=>({...o}));
QUIZ.cmp=[{t:'Strong acid with strong base',ok:false,fb:'Those sit at pH 7, whichever way round you titrate.'},{t:'Any pair with a weak acid',ok:true,fb:'Yes. The weak acid\'s salt is basic, so equivalence is above 7, whether the acid is in the flask or the burette.'},{t:'Any pair with a weak base',ok:false,fb:'Those are below 7: the weak base\'s salt is acidic.'}];
function indVerdicts(){const ve=veq(),p1=pHat(ve-0.05),q1=pHat(ve+0.05),p2=pHat(ve-0.10),q2=pHat(ve+0.10),a1=Math.min(p1,q1),b1=Math.max(p1,q1),a2=Math.min(p2,q2),b2=Math.max(p2,q2),out={};
  Object.entries(IND).forEach(([k,I])=>{const m=(I.lo+I.hi)/2; out[k]=(m>=a1&&m<=b1)?'yes':(m>=a2&&m<=b2)?'border':'no';}); return {v:out,lo:a1,hi:b1};}
function indReason(k,vd){const I=IND[k],v=vd.v[k],m=(I.lo+I.hi)/2;
  if(v==='yes') return `Changes at pH ${I.lo}–${I.hi}, right inside the jump. ✓`;
  if(v==='border') return `Changes at pH ${I.lo}–${I.hi}, at the very edge of the jump. It would work, but not crisply.`;
  return m<vd.lo?`Changes at pH ${I.lo}–${I.hi}, before the jump. It would change colour too early.`:`Changes at pH ${I.lo}–${I.hi}, after the jump. It would change colour too late.`;}
function curveCfg(extra){const pts=run().pts.filter(p=>p[1]!=null); return Object.assign({xmax:50,ymin:0,ymax:14,ystep:2,ylab:'pH',series:[{pts,color:'--violet',end:true}]},extra||{});}
function startCombo(k){setKey(k); autoBench(null,'Curve','titrating'); S.eqMark=null; S.picks=[]; S.picked=false; S.pka=null; delete S.quiz['eqph_'+k]; delete S.calc.pk;}
MODULES.curve={title:'Curve Lab',blurb:'Plot pH curves for 3 acid–base combos and learn to pick the right indicator.',c:'violet',defKey:'c_sasb',quickBench:true,probe:'ph',

   html:()=>`<p class="lead">Swap the indicator for a pH probe, and you can watch the whole titration happen.</p>

  {id:'c_eq',w:2,solo:true,title:'Find the equivalence point',strip:true,

   bind:()=>{const c=$('curveBig'); const m=drawChart(c,curveCfg({marks:S.eqMark!=null?[{x:S.eqMark,y:pHat(Math.min(S.eqMark,49)),color:'--yellow',label:S.eqMark.toFixed(1)+' mL'}]:[]}));
     c.addEventListener('pointerdown',e=>{if(!m) return; const x=Math.max(0,Math.min(50,m.xFromClient(e.clientX))); const was=S.eqMark!=null&&Math.abs(S.eqMark-veq())<=0.75; S.eqMark=x; const ok=Math.abs(x-veq())<=0.75; if(ok&&!was) right(15,'equivalence'); else if(!ok) wrong(); renderCard(true);});},
   can:()=>S.eqMark!=null&&Math.abs(S.eqMark-veq())<=0.75&&quizOk('eqph_'+S.key),gate:'Mark it and answer'},
  {id:'c_pk',w:2,solo:true,title:()=>S.key==='c_wasb'?'Read the pKa':'Read the pKb',strip:true,skip:()=>!['c_wasb','cb_wbsa'].includes(S.key),
   html:()=>{const c=S.calc.pk||{},acid=S.key==='c_wasb';
     return `${acid?`<p>At <b>half</b> the equivalence volume, half the ethanoic acid has become ethanoate, so [CH₃COOH] = [CH₃COO⁻]. At that point <b>pH = pKa</b>.</p>`:`<p>At <b>half</b> the equivalence volume, half the ammonia has become ammonium, so [NH₃] = [NH₄⁺]. At that point <b>pOH = pKb</b>, so <b>pKb = 14 − pH</b>.</p>`}
     ${doLine('Read',`the pH where the dashed line at ${(veq()/2).toFixed(2)} mL meets the curve. This graph is zoomed in, with a line every 0.1 pH.${acid?' Type it as the pKa.':' Then type 14 − that pH as the pKb.'}`)}
     <canvas class="chart" id="curveBig" style="height:240px"></canvas>
     <div class="step${c.ok?' ok':''}"><div class="q">${acid?'pKa of ethanoic acid':'pKb of ammonia'}<small>Half-equivalence volume = ${(veq()/2).toFixed(2)} mL</small></div><div class="in"><input id="c_pk" inputmode="decimal" value="${c.val||''}" aria-label="${acid?'pKa':'pKb'}"><button class="btn go" type="button" id="pkBtn" ${c.ok?'disabled':''}>Check</button></div>${c.fb?`<p class="toastline ${c.ok?'good':'bad'}">${c.fb}</p>`:''}</div>
     ${acid?newWord('pKa','how strong a weak acid is. Smaller pKa = stronger acid.'):newWord('pKb','how strong a weak base is. Smaller pKb = stronger base.')}`;},
   bind:()=>{const acid=S.key==='c_wasb',lo=acid?3.5:8.0,hi=acid?6.0:10.5;
     drawChart($('curveBig'),{xmin:5,xmax:20,xstep:2.5,xminor:0.5,ymin:lo,ymax:hi,ystep:0.5,minor:0.1,ylab:'pH',series:[{pts:run().pts.filter(p=>p[1]!=null),color:'--violet'}],vlines:[{x:veq()/2,color:'--pink',label:(veq()/2).toFixed(2)+' mL'}]});
     $('pkBtn').addEventListener('click',()=>{const v=num($('c_pk').value),target=acid?4.76:4.75,ok=Math.abs(v-target)<=0.15,ph=pHat(veq()/2);
       let fb=ok?(acid?'Spot on. The accepted pKa of ethanoic acid is 4.76.':'Spot on. The accepted pKb of ammonia is 4.75.'):(acid?'Find where the dashed line crosses the curve, then read across to the pH scale.':(Math.abs(v-ph)<0.3?'That\'s the pH. Now do 14 − pH to get the pKb.':'Read the pH where the dashed line crosses the curve, then subtract it from 14.'));
       S.calc.pk={val:$('c_pk').value,ok,fb}; ok?right(15,acid?'pKa':'pKb'):wrong(); renderCard(true);});},
   can:()=>S.calc.pk&&S.calc.pk.ok,gate:'Read it off the graph'},
  {id:'c_ind',w:2,solo:true,title:'Pick the indicators',strip:true,
   html:()=>{const vd=indVerdicts();
    return `${doLine('Tap',`every indicator that would work for ${CHEM[S.key].short}. The coloured bands show where each one changes.`)}
     <canvas class="chart" id="curveBig" style="height:200px"></canvas>
     <div class="indchips">${Object.entries(IND).map(([k,I])=>{const p=S.picks.includes(k),cls=S.picked?(vd.v[k]==='yes'?'ok':vd.v[k]==='border'?'mid':'no'):'';

     ${S.picked?why('ijump','The best indicator changes colour inside the steep jump. One drop takes the pH right through its colour change, so you get a sharp end point.'):''}`;},
   bind:()=>{const vd=indVerdicts(),bands=S.picks.map(k=>({lo:IND[k].lo,hi:IND[k].hi,color:IND[k].to}));

       if(wrongN===0){right(30,'perfect picks'); badge('picker');} else {wrong(); award(5,'checked');} renderCard(true);});},

  {id:'c_sum',w:2,solo:true,title:'Combo complete',
   html:()=>{const k=S.key,v=CHEM[k],vd=indVerdicts(),good=Object.keys(IND).filter(x=>vd.v[x]!=='no').map(x=>IND[x].name+(vd.v[x]==='border'?' (borderline)':''));
     return `<div class="info-card" style="--c:${cv(v.c)};--c-soft:var(--${v.c}-soft)"><b>${v.tab}</b><span>Equivalence at ${veq().toFixed(2)} mL, pH ${pHat(veq()).toFixed(2)} (${v.eqpH}). The salt is ${v.salt}.</span><span>Works: ${good.join(', ')}.</span>${k==='c_wasb'?`<span>pKa read: ${S.calc.pk?S.calc.pk.val:''} (accepted 4.76)</span>`:k==='cb_wbsa'?`<span>pKb read: ${S.calc.pk?S.calc.pk.val:''} (accepted 4.75)</span>`:''}</div>
     <canvas class="chart" id="curveBig" style="height:180px"></canvas>`;},
   bind:()=>drawChart($('curveBig'),curveCfg()),
   can:()=>true,next:()=>COMBO_C.every(k=>S.cres[k]||k===S.key)?'Compare all six':'Pick the next combo',
   onNext:()=>{const k=S.key,vd=indVerdicts(); S.cres[k]={pts:run().pts.filter(p=>p[1]!=null),eqV:veq(),eqpH:pHat(veq()),pk:S.calc.pk?S.calc.pk.val:null,picks:S.picks.slice(),good:Object.keys(IND).filter(x=>vd.v[x]!=='no').map(x=>IND[x].name+(vd.v[x]==='border'?' (borderline)':'')),mark:S.eqMark};
     PROG.curve.combos[k]=true; save(); const nxt=COMBO_C.find(x=>!S.cres[x]); if(nxt) startCombo(nxt);},
   goto:()=>COMBO_C.every(k=>S.cres[k])?'c_compare':'c_pick'},
  {id:'c_compare',w:2,solo:true,title:'Compare the curves',
   html:()=>{const has=g=>g.some(k=>S.cres[k]),leg=g=>`<div class="legend">${g.filter(k=>S.cres[k]).map(k=>`<span><i style="background:var(--${CHEM[k].c})"></i>${CHEM[k].short}</span>`).join('')}</div>`;
     return `${has(COMBO_A)?`<h3>Acid in the flask</h3><canvas class="chart" id="cmpA" style="height:200px"></canvas>${leg(COMBO_A)}`:''}
     ${has(COMBO_B)?`<h3>Base in the flask</h3><canvas class="chart" id="cmpB" style="height:200px"></canvas>${leg(COMBO_B)}`:''}
     <ul style="margin:0;padding-left:18px;font-weight:600;font-size:.92rem;display:flex;flex-direction:column;gap:4px"><li>Base in the flask flips the curve: it starts high and falls.</li><li>A weak acid or weak base gives a flatter <b>buffer region</b> before the jump, and a smaller jump.</li><li>The jump is biggest when both are strong.</li></ul>
